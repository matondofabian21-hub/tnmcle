:root{--bg:#f6f7f9;--sf:#fff;--tx:#1b2430;--mu:#5d6b7c;--bd:#d8dee6;--ac:#0f6e56;--ok:#d9f2e4;--okb:#1b8a50;--no:#fbe0e0;--nob:#c23b3b;--fl:#f3b63f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--tx)}

header h1{font-size:16px;margin:0;flex:1;min-width:180px}.bar{height:8px;background:var(--bd);border-radius:4px;flex:1 1 100%;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .2s}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:8px;padding:7px 12px}button.p{background:var(--ac);border-color:var(--ac);color:#fff}button:disabled{opacity:.4}
.wrap{display:flex;gap:14px;padding:14px;max-width:1100px;margin:auto}nav{width:230px;flex:none}main{flex:1;min-width:0}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.sec{display:block;width:100%;text-align:left;margin-bottom:6px;font-size:13px}.sec.on{border-color:var(--ac);outline:1px solid var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px}.grid button{padding:5px 0;font-size:12px}
.grid .ans{background:var(--ac);color:#fff;border-color:var(--ac)}.grid .flg{box-shadow:inset 0 -4px 0 var(--fl)}.grid .cur{outline:2px solid var(--tx)}.grid .c{background:var(--ok);border-color:var(--okb);color:var(--tx)}.grid .w{background:var(--no);border-color:var(--nob);color:var(--tx)}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin:8px 0;cursor:pointer}.opt.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent)}
.opt.ok{background:var(--ok);border-color:var(--okb)}.opt.bad{background:var(--no);border-color:var(--nob)}.opt b{min-width:20px}
.q{font-size:16px;font-weight:600}.mu{color:var(--mu);font-size:13px}.rat{border-left:4px solid var(--ac);padding:6px 10px;margin-top:8px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.big{font-size:34px;font-weight:700}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px}.lo{color:var(--nob);font-weight:600}
@media(max-width:720px){.wrap{flex-direction:column}nav{width:100%}}
body{background:linear-gradient(135deg,color-mix(in srgb,var(--bg) 85%,#0f6e56),var(--bg)) fixed}</style></head><body>

<script>
const S=[["A","Basic Nursing",1,40],["B","Medical Surgical Nursing",41,76],["C","Community Health Nursing",77,96],["D","Midwifery & Child Health",97,136],["E","Mental Health Nursing",137,160],["F","Leadership & Management",161,180]];
// [no, text, [A,B,C,D], answer, rationale] — add the remaining paper questions here in the same format.
const Q=[
[1, "This paper consists of 180 Multiple Choice Questions divided into Five Sections: - Section A: EBN 101 Basic Nursing (50 Questions - 25 Marks) - Section B: EMS 102 Medical Surgical Nursing (40 Questions - 20 Marks) - Section C: ECH 103 Community Health Nursing (30 Questions - 15 Marks) - Section D: EMC 104 Midwifery and Child Health (40 Questions - 20 Marks) - Section E: EMH 105 Mental Health Nursing (20 Questions - 20 Marks) 2. Answer ALL questions in ALL sections. 3. Each question has four alternatives (A, B, C, and D) from which you will SELECT ONE correct answer. SECTION A: EBN 101 - BASIC NURSING (QUESTIONS 1 - 50) 1. Which position will you maintain to ensure that there is adequate support and stability to move the patient comfortably from bed to wheel chair?", ["Spread your feet apart and flex your hips and knees", "Brake your front knee against client's knees", "Instruct the patient to place his hands on your arm rest", "Use transfer belt to reduce risk of falling"], "A", "A wide base of support with flexed hips and knees gives stability and uses the leg muscles.", "A"],
[2, "You are assessing an adult patient who has undergone laparotomy. Which of the following information will you classify as subjective data?", ["Vital signs records", "Surgeon's operation report", "Patient's description of pain", "Laboratory investigation results"], "C", "Subjective data are what the patient says or feels, such as a description of pain.", "A"],
[3, "You positioned Mr. Hugo who is unconscious in a Sim's position. Which of the following is the rationale for the intervention?", ["To reduce pressure over the sacrum and shoulders", "To facilitate drainage from the mouth and to prevent aspiration of fluids", "To promote comfort and sleeping", "To promote venous return and blood circulation"], "B", "Sim's (semi-prone) position lets secretions drain from the mouth and keeps the airway clear.", "A"],
[4, "You are discharging Mr. Kamala who has just recovered from clinical malaria. Which health education will you give to prevent him from reoccurrence of the disease?", ["Maintain body hygiene", "Drink safe and clean water", "Drain all stagnant water around his house", "Eat hot meals"], "C", "Stagnant water breeds Anopheles mosquitoes, so removing it breaks transmission.", "A"],
[5, "You are monitoring progress of a patient who is on oxygen therapy. Which of the following signs will you frequently observe in this patient?", ["Pallor", "Redness", "Jaundice", "Cyanosis"], "D", "Cyanosis shows continuing hypoxia and tells you whether oxygen is effective.", "A"],
[6, "You are preparing Mrs. Kavumbi for total hysterectomy. Which of the following rights will you consider for her?", ["Writing a will", "Signing consent form", "Providing history", "Submitting her belongings"], "B", "Informed consent is the patient's right before any surgery.", "A"],
[7, "Mr. Juma complains to you to have high fever throughout the night. Which of the following action would you do to confirm his complaint?", ["Call the doctor to review the patient", "Read patient's file to obtain information", "Check patient's body temperature", "Obtain blood sample for investigation"], "C", "Measuring the temperature objectively confirms the complaint.", "A"],
[8, "The actions that you will take prior to taking client's weight will include all of the following EXCEPT:", ["Ask client to reduce heavy clothes", "Turn the scale to read 150 to 200kg", "Instruct the client to step on the scale when it reads zero", "Assess the client's ability to stand on the scale"], "B", "The scale must be set to zero, not to 150–200 kg.", "A"],
[9, "You are to dispose reagent strip after testing Mrs. Chalo's urine for albumin. A container that you would use to discard the strip is:", ["In the sharp box", "In the blue bucket", "In the yellow bucket", "In the red bucket"], "C", "Contaminated clinical waste such as test strips goes into the yellow bucket.", "A"],
[10, "You are collecting urine specimen from Mr. Chango for culture and sensitivity. Which of the following specimen bottles will you use?", ["Empty clean bottle", "Hematological bottle", "Biochemical bottle", "Empty sterile bottle"], "D", "Culture needs a sterile container to avoid contamination of the sample.", "A"],
[11, "You are teaching a patient on low protein diet. Which of the following meals will you tell that patient as lowest in proteins?", ["Combined fruits", "Combined animal products", "Combined nuts", "Combined vegetables"], "A", "Fruits are the lowest in protein among the options.", "A"],
[12, "You are caring for Mr. Mzee 69 years old who is admitted in your ward. On assessment you find his teeth plagued with old decayed food and has foul smell. What interventions would you carry for the Mzee?", ["Assist patient to brush, flossing and rinsing the teeth", "Refer patient to the dentist to remove the dentures", "Add fluoride in water as part of treatment", "Place patient on lateral position head towards the wall"], "A", "Oral hygiene is a basic nursing intervention that removes food debris and odour.", "A"],
[13, "Which of the following actions would you take during bed making to ensure that patient is prevented from the risk to develop bed sores?", ["Tuck the loose portion of linen under the mattress", "Tuck the excess bottom sheets tightly under the mattress", "Lay sheet tight on the top of mattress to form a flat fold", "Tuck loose hanging sheets below the mattress"], "B", "A tight, wrinkle-free bottom sheet prevents pressure and friction on the skin.", "A"],
[14, "You have administered Valium 10 mg intramuscularly to a patient with anxiety. Which of the following sharps disposal methods will you use?", ["Recap the needle and drop it into sharps box", "Rinse the needle with antiseptic and discard into sharps box", "Discard the needle into sharps box immediately", "Put it into a receiver, later discard in sharp box"], "C", "Dispose of the needle immediately without recapping to prevent needle-stick injury.", "A"],
[15, "You are administering oral medication to Mr. Kobelo who has dysphagia. Which of the following nursing actions will you take to assist him to get the desired medication?", ["Place him in Fowler's position to facilitate swallowing", "Stay with him while the medicine is swallowed", "Give him guideline or drug safety as appropriate", "Recommend to physician to prescribe injectable medicine"], "A", "Upright position makes swallowing safer and lowers the risk of aspiration.", "A"],
[16, "Which of the following techniques would you use to assess heart beat to a young child during physical examination?", ["Auscultation", "Palpation", "Percussion", "Inspection"], "A", "Heart sounds are assessed by listening with a stethoscope.", "A"],
[17, "Mrs. Kipolo who is admitted in a medical ward for the first time presents symptoms of anxiousness. Which nursing action would you do to reduce her problem?", ["Assess client's sensory functions to determine ways of reducing anxiety", "Stay with patient and continue taking history about his anxiousness", "Compare patient with other patients in the ward", "Orient the patient toward staff, premises, patients and ward routines"], "D", "Orientation to the ward and routine reduces fear of the unknown.", "A"],
[18, "Before administering any medication to a patient you must adhere to the drug administration principles. Which of the following principles would you follow first?", ["Check the client's identification band on his hand", "Call his name and compare with written data", "Check the room number where the patient is admitted", "State the client's name aloud and have the client repeat it"], "A", "The identification band is the most reliable way to verify the right patient.", "A"],
[19, "You are giving sublingual oral medication to Mrs. Njumu. Which of the following responses would you give to patient question on the rationale for giving the drug under her tongue?", ["The dose is too large to administer in other route", "For slow digestion and action", "It melts easily and gets into digestive system", "For easy absorption directly into the capillaries"], "D", "The rich blood supply under the tongue gives rapid absorption into the circulation, bypassing the liver.", "A"],
[20, "While checking vital signs for Mrs Chege, you identified that her blood pressure reading is 160/110 mmHg. Your interpretation to this reading is that Mrs. Chege has:", ["High blood pressure", "Normal blood pressure", "Low blood pressure", "Abnormal pulse pressure"], "A", "160/110 mmHg is well above 140/90, which is hypertension.", "A"],
[21, "You want to check temperature of Mr. Chilla who has signs of dehydration, vomiting and diarrhea. Which part of the body would you place the thermometer?", ["Axilla", "Mouth", "Rectum", "Groin"], "A", "Oral and rectal routes are unsuitable with vomiting and diarrhoea, so the axilla is safest.", "A"],
[22, "You are assisting Mrs. Halubu to read the Snellen's Chart in the Eye Clinic. Which of the following nerves will you be testing?", ["Optic nerve", "Olfactory nerve", "Trochlear nerve", "Oculomotor nerve"], "A", "The Snellen chart tests visual acuity, which depends on the optic nerve (cranial nerve II).", "A"],
[23, "You are administering ampicillin orally to Mr. Babu whose medication sheet indicates three times a day. The first dose was given at 6.00 am. At what time will you give the second dose?", ["12.00 md", "2.00 pm", "6.00 pm", "8.00 am"], "B", "Three times a day means every 8 hours, so the second dose is at 2.00 pm.", "A"],
[24, "You were assessing baby John whose body temperature is fluctuating as follows: at 2.00 pm was 39°C, at 8.00 pm 36.5°C, and at 2:00 am was 40°C. Which of the following types of fever would you suspect to baby John?", ["Relapsing fever", "Constant fever", "Remittent fever", "Intermittent fever"], "D", "In intermittent fever the temperature returns to normal between peaks within 24 hours.", "A"],
[25, "You are collecting urine specimen from Mr. Koki who has indwelling catheter. Which nursing action will you apply in collecting the specimen?", ["Collect urine from the drainage bag without disconnecting catheter from the bag", "Detach tube from catheter, draw the specimen through the catheter", "Insert the syringe straight to the catheter to allow self-sealing of the catheter", "Use sterile syringe to aspirate urine specimen from the draining catheter port"], "D", "A sterile syringe at the sampling port keeps the closed drainage system intact.", "A"],
[26, "You are convincing junior nurses to join professional association at your work place. Which information will you emphasize as a primary purpose of the Association?", ["Promote advancement and professional growth", "Assist and enable nurses to secure jobs abroad", "Facilitate and establish interpersonal relationship", "Work and plan for raising funds for nurses benefit"], "A", "Professional associations exist mainly to advance the profession and its members.", "A"],
[27, "You are to assess a patient's chest condition by using auscultation technique. Which of the following instruments will you use?", ["Tracheoscope", "Laryngoscope", "Stethoscope", "Audio scope"], "C", "A stethoscope is used to listen to chest sounds.", "A"],
[28, "Bed making is one of the routine basic nursing procedures in the hospital. What would you consider when making a cardiac bed?", ["To place a back rest at the bottom part of the bed", "To place back rest at middle part of the bed", "To place back rest at the top part of the bed", "To place back rest at foot part of the bed"], "C", "In a cardiac bed the back rest is placed at the head end so that the patient sits upright for easy breathing.", "A"],
[29, "You are performing rectal examination to Mrs. Safari. Which of the following positions would you place her for the examination?", ["Prone position", "Lithotomy position", "Sim's position", "Dorsal position"], "C", "Sim's (left lateral) position gives easy access to the rectum.", "A"],
[30, "You are teaching student nurses on proper disposal of soiled dressing materials. Which of the following containers will you insist them to use?", ["Black bucket", "Red bucket", "Yellow bucket", "Blue bucket"], "C", "Soiled dressings are infectious clinical waste and go into the yellow bucket.", "A"],
[31, "You are preparing chlorine solution for decontamination of used dressing instruments. Which strengths of chlorine solution will you use for soaking the instruments?", ["1:6 parts", "1:8 parts", "1:10 parts", "1:20 parts"], "A", "Per the key, the strength is 1:6 (one part chlorine to six parts water).", "A"],
[32, "You are assisting a first year student nurse on performing decontamination of used dressing towels. What recommended time will you tell the student to leave the dressing towels into chlorine solution?", ["5 minutes", "10 minutes", "15 minutes", "20 minutes"], "B", "Items are soaked for 10 minutes for effective decontamination.", "A"],
[33, "You are inserting an indwelling catheter to Mr. Mtondo prior to prostatectomy. Which of the following precautions should you take?", ["Shave the patient thoroughly before the procedure", "Obtain informed consent from the patient", "Use the most clean equipment for the procedure", "Perform catheterization using aseptic technique"], "D", "Aseptic technique prevents catheter-associated urinary infection.", "A"],
[34, "You were giving BCG vaccine to a child by intradermal route. Which of the following angles would you insert needle into the skin?", ["At an angle of 5-10 degrees", "At an angle of 15-20 degrees", "At an angle of 20-30 degrees", "At an angle of 10-15 degrees"], "D", "Per the key, an intradermal injection is given at 10–15 degrees with the bevel up.", "A"],
[35, "Nursing services are currently improved due to introduction of modern computer application. The benefit of this technology in daily nursing activities is:", ["Easy to transfer information to a small group", "Easy to transfer information manually", "Easy to retrieve and transfer information", "Easy to document information confidentially"], "C", "Computers store records so they can be retrieved and shared quickly.", "A"],
[36, "You are in a medical ward caring a patient experiencing an asthmatic attack. Which nursing intervention will you implement first?", ["Obtain the patient's short acting medication", "Notify the Doctor on duty", "Administer oxygen", "Elevate the head of the bed"], "D", "Sitting the patient upright is the quickest measure to ease breathing, then oxygen and medication follow.", "A"],
[37, "You have just finished administering intramuscular injection to Mr Rosho. Accidentally you prick yourself with that needle used to a patient. Which immediate intervention should you do to prevent the risk of infection?", ["Report to in charge, get counseling and testing, then start PEP within 72 hours", "Report to in charge, get counseling and testing, then start PEP within 80 hours", "Report to in charge, get counseling and testing, then start PEP within 84 hours", "Report to in charge, get counseling and testing, then start PEP immediately"], "D", "PEP works best when started as soon as possible after the exposure, ideally within hours.", "A"],
[38, "You have qualified and posted to work at Ndwikarmu Rural Health Centre. Which of the following will be your responsibilities towards client's and the community?", ["Maintaining cooperative relationship with co-workers in nursing and other cadres", "Sharing responsibilities with other cadres to meet social and health needs of the society", "Participating in establishment and maintain social/economic working conditions", "Maintaining the highest standards of nursing care and personal conduct"], "D", "The nurse's duty to clients and the community is to maintain the highest standards of care and conduct.", "A"],
[39, "You are to give advice on nutrition to a patient with vitamin C deficiency. Which of the following food sources would you recommend to him?", ["Citrus fruits, tomatoes and fish", "Oranges, cabbage and tomatoes", "Beef, fish and Bananas", "Tomatoes, eggs and wheat"], "B", "Oranges, cabbage and tomatoes are all rich in vitamin C.", "A"],
[40, "You are teaching medical attendants on arranging dust bin using colour coding. Which color would you tell the attendants to use for highly infectious wastes?", ["Yellow", "Red", "Blue", "Black"], "A", "According to the key, yellow is used for highly infectious waste.", "A"],
[41, "You are preparing to perform disinfection in the cholera ward after discharging the patient. Which of the following protective gears would you use?", ["Gown, clean gloves, apron, boots, cap, mask and goggles", "Sterile gloves, boot, apron, mask, cap, goggles, gown", "Gown, boots, mask, goggles, long heavy duty gloves and apron", "Disposable gloves, goggles, gown, apron, mask, and cap"], "C", "Cleaning contaminated surfaces needs heavy-duty utility gloves and boots, plus gown, apron, mask and goggles.", "A"],
[42, "You are assisting the anaesthetist in transferring a patient from operating theatre to the ward who is in deep sleep due to anaesthetic agents he received. Which of the following considerations would you pay attention to?", ["Efficiency of sterile field", "Maintenance of adequate airway", "Availability of medical history", "Impact of surgery on exercises"], "B", "An unconscious patient is at risk of airway obstruction, so airway maintenance comes first.", "A"],
[43, "You are preparing to dress Mr. Julie's wound. Which of the following order of nursing interventions would you do before starting the procedure to him?", ["Wash hands, inform the patient and prepare equipment", "Inform the patient, wash hands and prepare equipment", "Prepare equipment, wash hands and inform patient", "Close the door, wash hands and prepare equipment"], "B", "The patient is informed first, then hands are washed, then the equipment is prepared.", "A"],
[44, "You are receiving bed to bed report in the surgical ward, you find Mr. Tetes who was your former thief sustained multiple cut wounds on his head. Which of the following principles would you apply during the care of this patient?", ["Veracity/honesty", "Beneficence", "Value of life", "Non-maleficence / Justice"], "D", "Every patient deserves fair treatment without harm, whatever his past. This is justice and non-maleficence.", "A"],
[45, "You are caring for Mrs. Muki who is in a terminally ill condition. Which of the following interventions will you take to ensure a peaceful death?", ["Allow relative to be at the bed side", "Discourage her husband to discuss issues at the patient bed side", "Give prescribed narcotics to alleviate pain", "Keep the patient in a comfortable position"], "C", "Pain relief is essential for a peaceful, dignified death.", "A"],
[46, "When caring a terminally ill patient, you should maintain patient's dignity. Which of the following intervention would you perform to this patient?", ["Make decisions for patient's needs", "Spend time to allow a patient share his life experiences", "Place a patient in a separate room for privacy", "Call for spiritual support and counseling"], "B", "Listening to the patient's life story respects his personhood and dignity.", "A"],
[47, "During the ward round shift exchange you find a patient fallen down from the bed and sustained injury of the hip. Which of the following legal aspects of nursing has been violated?", ["Harm", "Negligence", "Battery", "Assault"], "B", "Failure to provide safe care that results in injury is negligence.", "A"],
[48, "You are assigned duty at the Emergency Unit where a known experienced thief is severely injured. The appropriate statement for you to tell him would be:", ["Today will be the last chance for you to survive", "You should mention all of your colleagues before us", "Don't worry about your injury, you are in safe hands", "Do you have money to serve your care demands?"], "C", "Reassurance in a non-judgemental way respects the patient's rights regardless of his background.", "A"],
[49, "Which of the following legal directives that nurses should adhere to while providing quality nursing services?", ["Physician orders and prescriptions", "Civil workers code of conduct and rules", "Professional associations rules and orders", "Nursing policies and procedure manuals"], "D", "Nursing policies and procedure manuals are the directives that guide safe, legal practice.", "A"],
[50, "You are preparing to perform dressing to Mr. Poli in the surgical ward. Which of the following techniques would you apply during surgical hand scrub?", ["Keep the hand below the elbow throughout the scrub", "Use brush for the palms and dorsal surface of the hands", "Perform the scrub for at least two to five minutes", "Wash well around all jewels"], "C", "A surgical scrub takes at least 2–5 minutes, with the hands held higher than the elbows.", "A"],
[51, "You were feeding a patient by using cup and spoon, immediately the patient began to cough and had difficulty breathing. Which of the following nursing interventions would you implement first?", ["Suction through the client mouth", "Change the patient to tube feeding", "Administer oxygen by nasal cannula", "Turn the client to the side"], "D", "Turning him to the side lets food drain out of the airway before suction and oxygen.", "B"],
[52, "You are taking history from Ms. Lubasha who complains of heavy greenish fluids from her vagina. Which of the following parts of the patient's history should you be more attentive when interviewing her?", ["Obstetric history", "Occupational history", "Sexual history", "Family history"], "C", "Greenish vaginal discharge suggests a sexually transmitted infection.", "B"],
[53, "You are assessing casualty with multiple cut wounds on his head at the OPD. The immediate action you should take would be:", ["Shave the head thoroughly", "Apply gauze pressure to the head", "Apply crepe bandage to the head", "Inspect bleeding sites over the head"], "B", "Direct pressure controls bleeding first.", "B"],
[54, "You are discharging Mr. Tido who is having frequent asthma attacks. The nursing instructions that you will give Mr. Tito will include:", ["Intent discuss with the patient moving to a different climate", "Tell the patient to buy cotton linen for the home", "Ask the patient to avoid circumstances when and where the attacks occur", "Teach the patient to attempt avoiding all stress"], "C", "Identifying and avoiding triggers is the key prevention measure.", "B"],
[55, "You are assessing an 89 years old patient with pneumonia. Which signs and symptoms would you expect to obtain from him?", ["Pink frothy sputum and edema", "Confusion and lethargy", "High fever and chills", "Dyspnea and jugular vein distention"], "B", "Elderly patients often present with confusion and lethargy instead of fever and cough.", "B"],
[56, "You are caring a patient who has undergone tonsillectomy. On the 2nd day the patient complained of dryness of the throat. Your immediate intervention to the patient would be:", ["Give him a glass of water to drink", "Provide him cane sugar to chew", "Give him small quantity of porridge", "Give him sips of water"], "D", "Small sips of cool water relieve dryness without irritating the throat.", "B"],
[57, "Mr. Dodi is admitted to the emergency department with an injury on the left leg. The immediate nursing intervention you should perform is:", ["Assess the patient's left dorsalis pedis pulse", "Elevate the left extremity on two pillows", "Ask the client how the injury occurred", "Call radiology for x-ray of the extremity"], "A", "Check the distal pulse first to ensure the limb has circulation.", "B"],
[58, "You are assessing a patient with suspected diagnosis of osteoarthritis. Which of the following signs and symptoms you are likely to identify from the patient?", ["Severe bony deformity in the lower extremities", "Joint stiffness in the morning", "Enlarged joint of the lower extremity", "Rise in body temperature in the evening"], "C", "Joint enlargement with bony changes is typical of osteoarthritis. Morning stiffness lasts longer in rheumatoid arthritis.", "B"],
[59, "You are instructing student nurses on administering medicine using Directly Observed Therapy (DOT). Which of the following actions points would you emphasize during your instruction?", ["Record the medicine given in every week and observe", "Provide medicine direct using intramuscular route and observe", "Give the medicine under close supervision and observe", "Administer medicine in small doses in a day and observe"], "C", "DOT means the nurse watches the patient swallow every dose, which ensures adherence.", "B"],
[60, "Mr. Chupaki who has sustained pathological fracture on the clavicle has been prescribed 3g of calcium supplement a day. The medication comes in 600mg/tablet. How many tablets would you instruct the patient to take daily?", ["3 tablets", "8 tablets", "6 tablets", "5 tablets"], "D", "3 g = 3000 mg; 3000 ÷ 600 = 5 tablets.", "B"],
[61, "You are admitting Mrs. Cheche with suspected peptic ulcers. Which of the following statements from the patient supports her diagnosis of gastric ulcers?", ["\"I have bright red rectal bleeding after defecation\"", "\"If I lay down after eating a meal, I get burning in my chest\"", "\"After eating a full meal, I get severe pain in my right side\"", "\"I get pain in my stomach about 30 minutes after eating\""], "D", "Per the key, gastric ulcer pain starts soon after eating, while duodenal ulcer pain comes when the stomach is empty.", "B"],
[62, "You are giving health education to a group of clients on how to prevent Hepatitis B. Which of the following messages will you be expected to tell them?", ["Wash hands after attending toilet", "Do not share eating utensils", "Obtain three doses of Hepatitis B vaccine", "Take precaution when eating fresh fish"], "C", "Complete Hepatitis B vaccination (three doses) is the most effective prevention.", "B"],
[63, "You are caring for Maria who has peritonitis. The correct position you would keep her to minimize spread of the infection within the peritoneum is:", ["Sim's position", "Dorsal position", "Recumbent position", "Sitting up (Fowler's) position"], "D", "Sitting up (Fowler's) lets pus gravitate to the pelvis and limits spread in the peritoneum.", "B"],
[64, "While giving care to a patient with Intra Venous Infusion you observed that the fluid does not flow and the site of injection is swollen. Your immediate action would be:", ["Stopping intravenous infusion and remove the cannula", "Taking another cannula for insertion and report to in-charge", "Calling for help and prepare infusion tray", "Massaging the swollen site and apply bandage"], "A", "Swelling with no flow means infiltration, so stop the infusion and remove the cannula.", "B"],
[65, "Mr. Makunguru developed anaphylactic shock soon after you administered Procaine Penicillin Fortified parenterally. Which of the following immediate interventions would you employ?", ["Give injection diazepam intravenously", "Give injection promethazine intramuscularly", "Give injection atropine", "Give injection Adrenaline subcutaneously"], "D", "Adrenaline is the first-line drug in anaphylaxis; it reverses bronchospasm and hypotension.", "B"],
[66, "An elderly patient is admitted to the medical ward with acute gastroenteritis. Which nursing intervention would be most appropriate for you to delegate to the student nurses?", ["Record the client's intake and output", "Discuss the purpose of collecting a stool sample", "Insert the indwelling urinary catheter", "Assess the patient's skin turgor"], "A", "Recording intake and output is routine and can be delegated; assessment and procedures stay with the nurse.", "B"],
[67, "The client complaining of frequent watery bloody stool after eating undercooked meat at a fast food restaurant. Which intervention would you implement first?", ["Obtain a stool sample for laboratory investigation", "Give the patient antibiotic therapy", "Obtain blood sample for serum sodium and potassium level", "Administer anti-diarrhea medication"], "A", "Bloody diarrhoea after undercooked meat needs a stool sample for culture before treatment.", "B"],
[68, "You are preparing to administer digoxin to the patient diagnosed with heart failure. Which nursing intervention would you implement first?", ["Check the patient's blood pressure", "Assess the patient's radial (apical) pulse", "Monitor the patient's respiration", "Ask the patient if he has eaten food"], "B", "Count the apical pulse for a full minute; withhold digoxin if below 60 beats per minute.", "B"],
[69, "You are receiving a patient diagnosed with neurogenic shock. Which data would you expect to obtain during the assessment?", ["The patient has cool clammy skin", "The patient's apex beat (pulse) is 56/minute (bradycardia)", "The patient has bilateral wheezing", "Low specific gravity urine"], "B", "Loss of sympathetic tone in neurogenic shock gives bradycardia, hypotension and warm dry skin.", "B"],
[70, "You are working at emergency department where you meet baby Sophia who has drunk kerosene. Which of the following nursing interventions will you provide immediately to rescue the baby?", ["Induce the patient to vomit", "Give another volume of kerosene", "Confine patient to bed rest", "Give patient plenty of milk"], "D", "Do not induce vomiting after kerosene because of aspiration risk. The key gives milk; always refer urgently.", "B"],
[71, "You have identified nursing diagnosis of 'alteration in comfort related to chills and hyperpyrexia' to Mr. Chupa suffering from sepsis. Which intervention would you include in the plan of care?", ["Place a blanket on the patient", "Assess the patient vital signs every two hours", "Obtain a blood sample for culture", "Administer antipyretic medication every four hours"], "D", "Antipyretics treat the hyperpyrexia and relieve the discomfort caused by the fever.", "B"],
[72, "You are working at Kijiweni Dispensary, you received a child having a foreign body in the ear. Which of the following intervention would you perform to rescue the child?", ["Refer the child to the district hospital", "Give analgesics to relieve pain", "Remove foreign body using a scissor", "Instill oil to kill/expel foreign body if it is an insect"], "D", "The key marks instilling oil, used to kill a live insect in the ear; never use a scissor.", "B"],
[73, "Ally had sustained fracture of the radius. Which of the following types of bandages will you apply to support his fractured limb?", ["Crepe bandage", "Roller bandage", "T-shape bandage", "Triangular bandage"], "D", "A triangular bandage can make an arm sling to support a fractured forearm.", "B"],
[74, "Mr. Njaro reports to you with a history of being bitten by bees an hour ago. Your action to help Njaro's problem would be:", ["Bath him all over the body using warm water", "Remove tight clothes and shoes, give Panadol", "Give him antihistamine drugs and remove stings", "Check vital signs and refer him immediately"], "C", "Remove the stings and tight items and give an antihistamine to control the allergic reaction.", "B"],
[75, "Which of the following immediate measures will you take to help Mrs. Faki whose gown has caught fire and is running away for help?", ["Run after her while flushing her with water and call for help", "Ask the nearby people to flush her with water", "Tell her to lie down and cover her with heavy blankets", "Catch her and put off fire using sand"], "C", "Make her stop and lie down, then smother the flames with a blanket or cloth.", "B"],
[76, "Mr. Sali 20 years old came to OPD complaining of feeling tired after taking rice and cooked mushrooms. He was later diagnosed to have food poisoning. What will be your immediate action for him?", ["Perform gastric lavage", "Ask him to stay in sitting up position", "Give him amoxicillin tabs", "Give him Aspirin tablets to reduce acidic media"], "A", "Gastric lavage removes the poison from the stomach in food poisoning.", "B"],
[77, "You received a casualty who sustained fracture of femur due to motor accident. Your priority measure in saving the patient would be:", ["Dress the wound", "Check vital signs", "Call for help", "Control bleeding and splint injured limb"], "D", "Haemorrhage is controlled first, and the limb is splinted to prevent more damage.", "B"],
[78, "Babu Manyara's grandson has fallen into fire and sustained 2nd degree burn to his upper arm. Which of the following first aid measures would you give to the child?", ["Expose the burnt area to air", "Dip burnt part into cold water", "Cover the part with hot water", "Protect the part with clothes"], "B", "Cool running water for a first-degree or second-degree burn reduces pain and tissue damage.", "B"],
[79, "Mr. Kenni is brought to the hospital while unconscious. Your immediate action in saving his life would be:", ["Smell him for odors like alcohol, acetone", "Take historical background", "Check vital signs at once / Airway assessment", "Perform head to toe assessment"], "C", "Per the key, vital signs are checked at once in the unconscious patient, after ensuring the airway is clear.", "B"],
[80, "You are providing emergency pre-operative care to a 24 years old young man with ruptured spleen. The following interventions would be your priority, EXCEPT:", ["Perform enema", "Obtain consent form", "Check vital signs", "Take blood sample for grouping and cross-matching"], "A", "An enema is not a priority in a ruptured spleen; shock and bleeding must be addressed.", "B"],
[81, "While providing nursing care to Mr. Zakaria, you noticed him to be in shock evidenced by signs indicating diabetic acidosis. Which of the following types of fluids would you administer to him?", ["Ringer lactate", "Raise foot of the bed, insert IV line (Normal Saline)", "5% Dextrose", "Dextrose saline"], "B", "Raise the foot of the bed and start IV normal saline to correct hypovolaemia in diabetic ketoacidosis.", "B"],
[82, "Which of the following intervention will you employ in helping a patient suffering from broncho-pneumonia and presents with signs of difficulty in breathing and cyanosis?", ["Give oxygen, keep patient in sim's position and encourage breathing exercises", "Position patient in sitting up position, give oxygen and plenty of fluids", "Maintain clear airway, keep patient in semi sitting position and give oxygen", "Give oxygen, clear airway, and open nearby windows"], "C", "Clear the airway and keep the patient in an easy breathing position to maintain oxygenation.", "B"],
[83, "You are preparing Mr. Anton for chest x-ray. Which of the following interventions will you first employ during preparations?", ["Informing patient about procedure", "Checking his vital signs", "Collecting his previous documents", "Preparing his relatives for signing consent form"], "A", "Explaining the procedure first reduces anxiety and gains cooperation.", "B"],
[84, "You are providing first aid to the client of a poisonous snake bite on the right lower leg. Your first action you will implement would be:", ["Cover site with warm towel and refer", "Instruct the client to avoid movement in the affected leg", "Give antihistamine immediately and refer", "Give Anti-snake Venom Injection immediately"], "B", "Keep the limb still, because movement spreads the venom through the lymph.", "B"],
[85, "You are caring for Mr. Kalunde who has difficulty in coughing. Which of the following actions will you take to help him?", ["Encourage patient to be in Fowler's position", "Place patient in lithotomy position", "Assist patient to left lateral position", "Place patient on Trendelenburg position"], "A", "Fowler's position lets the diaphragm move freely and makes coughing easier.", "B"],
[86, "Miss Wande is vomiting blood due to Pulmonary Tuberculosis. She is anxious and restless. Which of the following interventions will be your immediate action in assisting her?", ["Give warm water to gargle", "Give antiemetic to reduce vomiting", "Tell the patient remain in sitting up position", "Assess nature of the vomitus and report to Ward Manager"], "C", "Sitting up reduces anxiety and helps him breathe and cough safely.", "B"],
[87, "You are to collect Mr. George's sputum who is admitted in the ward for investigations. Which of the following instructions will you give him regarding the collection of the specimen?", ["Expectorate evening sputum directly into the container", "Expectorate morning sputum directly into the container", "Expectorate mid-day sputum directly into a container", "Expectorate night sputum directly into the container"], "B", "Early-morning sputum has the highest number of TB bacilli.", "B"],
[88, "Mrs Maua is diagnosed with dental caries. The advice that you should give her to prevent recurrence of the condition is:", ["Brush the teeth after meals", "Brush the teeth at least once a week", "Report to the doctor for check up", "Avoid eating sweets and strong drinks"], "A", "Brushing after meals removes food debris that causes caries.", "B"],
[89, "You are preparing Mr Angelus for barium swallow. Which of the following instructions would you give him?", ["\"Avoid eating or drinking after midnight before the test\"", "\"Limit yourself to smoke only two cigarettes on the morning of the test\"", "\"Have a clear liquid breakfast only on the morning of the test\"", "\"Take all routine medications with a glass of water on the morning of the test\""], "A", "The patient fasts after midnight so that the stomach is empty for the barium.", "B"],
[90, "While working at Kitunguu Hospital you meet Mr. Chakubanga who had severe abdominal distension. Your immediate nursing intervention you would perform for him would be:", ["Report to the in charge and prepare patient for laparotomy the next day", "Keep the patient in comfortable position and prepare for flatus and Nasogastric tube insertion", "Prepare patient for intravenous infusion and flatus tube insertion", "Communicate with the patient on the risk behavior related to the problem"], "B", "A comfortable position relieves the distension immediately.", "B"],
[91, "The community at Kwetukwetu where you have been posted to work is affected by rats and mice. What advice would you immediately give in order to get rid of the anticipated hazard?", ["Improve standards of sanitation and food storage", "Clean the surroundings and clear bushes", "Use rat-proof materials and clear water channels", "Use insecticides and dispose uncooked food"], "A", "Rodents breed where sanitation and food storage are poor, so improving them controls them.", "C"],
[92, "You are conducting health education to a group of pregnant mothers on importance of vaccination to their babies. One mother asked when Pentavalent 1 vaccination is given. Your response to her would be:", ["Two weeks after birth", "Four weeks after birth", "Six weeks after birth", "Ten weeks after birth"], "C", "Pentavalent 1 is given at 6 weeks.", "C"],
[93, "You are conducting health survey at Kete village with a population of 1500 males and noted that 30 males developed prostate cancer. From your calculations which of the following will be the incidence rate if the given factor is 1000?", ["2 per 1000", "6 per 1000", "10 per 1000", "20 per 1000"], "D", "Rate = 30 ÷ 1500 × 1000 = 20 per 1000.", "C"],
[94, "You are working at community level, where your responsibility is to prevent helminthiasis diseases to school age children. Which of the following preventive measures will you consider at primary level for this problem?", ["Advise the community to construct and use latrine", "Advise the community to wash their clothes with soap", "Advise the community to vaccinate their domestic animals", "Advise the community to sleep in well ventilated houses"], "A", "Latrines stop soil contamination, which breaks the transmission of helminths.", "C"],
[95, "You are teaching a group of nurses on preventive measures of communicable diseases in a given community. Which of the following strategies would you insist to your audience in reducing preventable diseases?", ["Improving referral system and treatment", "Early diagnosis and treatment", "Health promotion interventions", "Counseling and referral"], "C", "Health promotion is the main strategy to prevent communicable diseases in communities.", "C"],
[96, "It is strongly believed by villagers of Kwetuchini that diarrhoea is brought by witchcraft. You are planning to conduct health education to them. Which of the following preventive measure of the disease will you consider in your plan?", ["Personal hygiene and proper waste disposal", "Treatment and safe water supply", "Use of personal protective gears", "Good health behaviours and personal hygiene"], "A", "Education on hygiene and waste disposal addresses real causes of diarrhoea, not witchcraft beliefs.", "C"],
[97, "You are conducting home visiting as a means of community survey. Which of the following activities would you do to ensure focused visits?", ["Prepare a list of homes for home visiting", "Prepare time table for home visiting", "Prepare budget for home visiting", "Prepare objectives of home visiting"], "D", "Clear objectives focus the visit on what is to be achieved.", "C"],
[98, "Which of the following interventions would you insist when teaching nursing students as means of primary prevention of communicable diseases?", ["Pre symptomatic diagnosis and treatment", "Health promotion and specific protection", "Rehabilitation and restoration of health", "Early detection and referral"], "B", "Primary prevention is health promotion and specific protection such as immunization.", "C"],
[99, "Which of the following interventions would you employ to ensure conformity and compliance of the community?", ["Multisectoral collaboration", "Community involvement", "Equitable distribution of health care", "Use of simple technology"], "B", "Involving the community builds ownership and compliance.", "C"],
[100, "You were conducting community health survey at Mumi village, where you came across children with different types of malnutrition. Which of the following actions would you take first?", ["Call an ambulance to take them to the hospital", "Administer folic and iron supplements to all children", "Notify the village leaders about the problem", "Involve family members in the care process"], "D", "Family members carry on feeding and care at home, so they are involved.", "C"],
[101, "You are elaborating on the contents of the National Health Policy to the community leaders at Kutu village. Which of the following policy statements focuses on maternal and child health would you elaborate?", ["Reduction of poverty and infant mortality", "Reduction of maternal and child mortality", "Reduction of malaria and environmental sanitation", "Reduction of HIV and promote gender equality"], "B", "The key states reduction of maternal and child mortality.", "C"],
[102, "You are counseling the people of Malulu village on HIV and AIDS. Which of the following stages of prevention of HIV that you will emphasize to them as best?", ["Tertiary prevention", "Primary prevention", "Secondary prevention", "Prodromal prevention"], "B", "Preventing HIV infection itself is primary prevention.", "C"],
[103, "You are talking to Umoja Community on prevention of trachoma. Which of the following messages that would you tell the community on prevention of this disease?", ["Supply adequate vaccines to improve immunity", "Proper wearing of shoes", "Good handling of food and drinking water", "Regular washing of face to avoid attraction to flies"], "D", "Face washing removes discharge that attracts flies, which spread trachoma.", "C"],
[104, "During home visiting at Karua village, you found Pima a twelve years old boy complains of scratching and itching at the peri-anal area. Which of the following conditions might be affecting this boy?", ["Amoebiasis", "Enterobiasis (Pinworm)", "Ascariasis", "Schistosomiasis"], "B", "Perianal itching in a child is typical of Enterobius (pinworm).", "C"],
[105, "While eating in a restaurant you noticed one of the waiters is blowing his nose using bare fingers then shaking hands with another person. What would be your immediate action?", ["Educate him on washing nose", "Advice him to ask for excused duty", "Guide him to use a handkerchief", "Tell him to go to the hospital for treatment"], "C", "A handkerchief prevents spread of droplets and germs to food and hands.", "C"],
[106, "Which of the following life styles would you include in your health education session to the community that complains of frequent illness?", ["Ways of living and behaviours", "Poverty and culture", "Living in extended family", "Agricultural activities with poor income"], "A", "Behaviours and ways of living strongly affect health and frequency of illness.", "C"],
[107, "The measures that you will take to prevent upper respiratory tract infections to a given community will include all EXCEPT:", ["Avoid spilling chemicals in the air", "Maintaining body hygiene", "Attend hospital for medical treatment", "Eat balanced diet"], "A", "Treatment at hospital is not a preventive measure for the whole community; it is curative.", "C"],
[108, "Which of the following approaches would you use to ensure that all community members in Ziwi Village are fully involved in identifying and planning actions related to their health?", ["Community sensitization", "Community awareness", "Community mobilizations", "Community assessment"], "C", "Mobilization actively engages community members in identifying problems and planning.", "C"],
[109, "After conducting community needs assessment for Borawao Village you started preparing a community assessment report. Which of the following components of the report will you include in the report?", ["Introduction, challenges and achievement", "Work done, acknowledgement and achievement", "Work done, achievement and acknowledgement", "Work done, achievement and challenges"], "D", "A report states the work done, achievements and challenges.", "C"],
[110, "The village chairperson informed you that people at Tungi Village have habit of eating dead domestic animals. Which of the following approaches would you use to make them discard this habit?", ["Report this habit to the District Health Officer for action", "Teach the villagers on the risks of eating dead domestic animals", "Prevent death of domestic animals in the village", "Provide prophylaxis to the villagers against anthrax"], "B", "Educating the villagers about the risks of eating dead animals changes the behaviour.", "C"],
[111, "You are invited to teach primary and secondary school teachers on proper refuse disposal methods. Which of the following methods would you tell them as beneficial for their schools?", ["Dumping", "Controlled tipping", "Incineration", "Composting / Decomposing"], "D", "Composting turns organic refuse into manure, as per the key.", "C"],
[112, "You are involved in preparing student nurses for community field work. Which of the following behaviours would you insist them to demonstrate in the village?", ["Be simple", "Request for hospitality and other favors", "Eat natural foods only", "Live with villagers in their homes"], "A", "Being simple and humble helps students be accepted by villagers.", "C"],
[113, "You are sensitizing and advocating for behavioral change to the community members on prevention of Ebola disease. Which of the following factors would you emphasize to ensure effective prevention?", ["Causation, risk factors and preventive measures", "Medicines and routes of administration factors", "Community organization and preventive measures factors", "Health facility services and risk factors"], "A", "Behaviour change messages cover causes, risk factors and prevention.", "C"],
[114, "You are teaching a group of women at the RCH Clinic on family planning methods. Which of the following interventions will you perform prior to allowing them select method of their choice?", ["Physical examination and occupational history", "History taking and physical examination", "Family history and social history", "Occupational and medical history"], "B", "History and physical examination guide the safe selection of a method.", "C"],
[115, "You are working at Mtukaja community helping them with the health planning process. How would you assist the community during this stage?", ["Assemble the problems", "Analyze the information collected", "Write the performance action", "Select long and short term objectives"], "D", "Selecting objectives is the planning stage of the health planning process.", "C"],
[116, "Which of the following challenges would you tell the community as barrier in implementing Community Based Health Care?", ["Excessive food in the village", "Improved roads and other infrastructure", "Seasonal change in the community", "Poor accessibility to health facility in the village"], "D", "Poor access to health facilities limits community-based health care.", "C"],
[117, "You are teaching a community on Primary Health Care (PHC). Which of the following achievements of PHC would you explain to the community?", ["Reduction of morbidity and mortality rates", "Detecting risk and early treatment of disease", "Availability of medicine and distribution", "Availability of transport and friendly services"], "A", "PHC aims to reduce illness and death.", "C"],
[118, "Which of the following community health roles would you play in order to achieve primary health care goals?", ["Supply clean and safe water", "Encourage multisectoral collaboration", "Orienting new health providers to PHC", "Advocacy for political multipartism"], "B", "PHC depends on collaboration between sectors such as water, education and agriculture.", "C"],
[119, "You are designing an action plan for Kiwewe village on how Primary Health Care will be implemented. Which of the following strategies would you include in the plan?", ["Treatment and rehabilitation", "Nursing process on sanitation", "Health education, nutrition and sanitation", "Proper use of drugs and medicines"], "C", "Health education, nutrition and sanitation are core elements of PHC.", "C"],
[120, "If you were involved in caring for people displaced by floods at a camp, what would you implement first?", ["Provide mother and child health services", "Prevent communicable diseases", "Call for food and water supplies", "Screen them for health problems"], "C", "Food and water are the first needs of displaced people.", "C"],
[121, "You are attending a primigravida with gestation age 36/40 weeks who complains to you on frequency micturition. Urinalysis result was negative. Which of the following information would you give to resolve her complaints?", ["The urethra is very close to the growing uterus", "The kidneys are very close to the growing uterus", "The growing uterus is pressing on the urinary bladder", "The growing uterus is very close to the anterior ureters"], "C", "The growing uterus presses on the bladder in late pregnancy, which causes frequency.", "D"],
[122, "You are instructing a second year student nurse how to perform abdominal examination to a pregnant woman. Which of the following sequences would you tell her to follow?", ["Percussion, Palpation and Auscultation", "Inspection, Palpation, and Auscultation", "Palpation, Auscultation and Inspection", "Auscultation, Percussion and Inspection"], "B", "Per the key: inspection, palpation, then auscultation of the fetal heart.", "D"],
[123, "You are attending a couple at the antenatal clinic in their first visit seeking for advice on individualized birth preparedness. Which of the following information would you give?", ["Identify family decision maker, blood donors, adequate clothes, transport, fetoscope", "Prepare adequate clothes, blood donors, delivery pack, place of birth, adequate money", "Identify blood donors, place of birth, means of transport, adequate clothes, decision maker", "Identify place of delivery, funds for emergency, blood donors, transport and adequate clothes"], "D", "Birth preparedness includes place of delivery and funds for emergencies.", "D"],
[124, "You are counseling a woman on family planning methods. Which of the following intervention will you perform to guide a woman on proper selection?", ["Check blood grouping and cross-match", "Orient a woman on informed choice", "Obtain information on past medical history", "Perform vaginal examination"], "B", "Informed choice lets her select the method that suits her.", "D"],
[125, "Miss. Chahwa reported to the antenatal clinic complaining of excessive weight gain following oral contraceptives she had used a few months ago. Which of the following examinations would you perform to her?", ["Assessing the vagina, check weight and abdominal examination", "Check weight, speculum examination and chest examination", "Measuring blood pressure, check for leg edema and urine for albumin", "Checking weight, blood pressure and urine for sugar"], "D", "Weight gain, blood pressure and urine protein screen for pre-eclampsia.", "D"],
[126, "When performing vaginal examination to Mrs Kibarua you identified that cervical dilatation was 7cm, membrane was intact and cord was pulsating. Which of the following would be your interpretation?", ["Vasa praevia", "Cord presentation", "Occult cord prolapse", "Cord prolapse"], "B", "With intact membranes and a pulsating cord below the presenting part, this is cord presentation.", "D"],
[127, "You are assigned to work in the neonatal unit. Which of the following newborn babies would you assess first?", ["The four hour old newborn who has a respiratory rate of 70/min", "The two hour old newborn whose APGAR Scores were 9-10", "A six hour old newborn whose skin is jaundiced", "The eight hour old newborn who was born at 40 weeks gestation"], "A", "A baby with breathing problems is assessed first (airway and breathing).", "D"],
[128, "You have conducted second stage of labour to Mrs Muu and delivered a male baby with APGAR Score 10. Which signs would you observe to score the baby?", ["Temperature, heart rate, colour, respiratory effort and muscle tone", "Respiratory rate, reflex irritability, muscle tone, colour, and crying", "Colour, heart rate, reflex response to stimulus, respiratory effort and muscle tone", "Heart rate, respiratory effort, muscle tone, reflex irritability and colour"], "D", "Apgar: heart rate, respiratory effort, muscle tone, reflex response and colour.", "D"],
[129, "Which of the following signs would lead you to suspect impending rupture of uterus?", ["Full bladder", "Bandl's ring", "Saucer shaped depression around the umbilicus", "Cord pulsation"], "B", "Bandl's ring (pathological retraction ring) signals impending uterine rupture.", "D"],
[130, "Supine hypotensive syndrome is caused by compression of inferior vena cava by a gravid uterus. If it occurs when performing physical examination, you should:", ["Refer the woman to the doctor immediately", "Reassure the woman", "Set an intravenous infusion", "Turn the woman on her left side"], "D", "Turning to the left side relieves pressure on the inferior vena cava.", "D"],
[131, "You are conducting a second stage of labour to a woman with undiagnosed twins. Which of the following moments will you pay attention on possibility of occurrences of complications?", ["During delivery of the first twin", "During delivery of the second twin", "Midway during delivery of second twin", "Immediately after expulsion of the first twin"], "D", "Twins are most often discovered after the first twin, so be alert at that moment.", "D"],
[132, "You are teaching second year student nurses on danger signs during post-natal period. Which of the following signs would you focus most?", ["Severe headache, severe bleeding, high fever, perineal pain and painful breasts", "Excessive PV bleeding, breathing difficulties, foul smelling lochia, convulsion and severe headache", "Diarrhea, painful micturition, heart palpitations, fever and redness in breasts", "Vomiting, blurred vision, abdominal pain, convulsion and perineal pain"], "B", "Severe bleeding and difficulty in breathing are life-threatening postnatal danger signs.", "D"],
[133, "You are providing care to Mrs. Maulid who is in the first stage of labour at Sokoine Dispensary and a primigravida with suspected contracted pelvis. Which of the following interventions would you do?", ["Examine the woman to assess pelvic capacity", "Immediately refer the woman to the highest level of health facility", "Admit the woman in labour ward", "Advise her to report to the dispensary weekly"], "B", "Suspected contracted pelvis needs referral to a facility that can do caesarean section.", "D"],
[134, "Which of the following would be your rationale in performing postnatal examination to Mrs Lyuki before discharge?", ["To provide her health education regarding care of herself and of the new born baby and give follow up dates", "To perform detailed assessment of her and to know her status, and give follow up dates", "To assess her general condition and of the baby to detect problems, manage, give follow up dates and refer if necessary", "To check vital signs to the baby and record any deviation and give health talk and give follow up dates"], "C", "The exam checks the mother's general condition and her recovery before discharge.", "D"],
[135, "Administration of malaria prophylaxis to a pregnant woman is of paramount importance. Which of the following gestation ages would you initiate the dose?", ["14/40 weeks", "12/40 weeks", "20/40 weeks", "24/40 weeks"], "A", "Per the key, malaria prophylaxis (IPTp) starts after 14 weeks.", "D"],
[136, "You are advising a woman to initiate breast feeding immediately after delivering. The nutritional advantages that breast milk has over the baby that you should tell her are:", ["High concentration of carbohydrates and Amino Acids", "High concentration of minerals supplements and fluids", "High concentration of first class protein and hormones", "High concentration of antibodies and anti-infective factors"], "D", "Breast milk gives antibodies that protect the baby from infection.", "D"],
[137, "You are assessing the milestone of a three-month-old infant. During physical examination you identified failure of the baby to control the head in erect position. Which diagnosis would you suspect?", ["Spina bifida", "Meningocele", "Cerebral palsy / Developmental delay", "Down's syndrome"], "C", "Failure of head control at three months suggests cerebral palsy, per the key.", "D"],
[138, "You are providing health education to a couple in the RCH Clinic about danger signs in pregnancy in the first trimester. Which of the following advantages of health education to the couple will you document?", ["Helps the couple to distinguish normal from abnormal findings", "Helps the couple to decide on early and timely seeking of appropriate health care", "Encourages the couple to manage their preparation for birth of the baby", "Helps to reduce fear of unknown and increase confidence"], "B", "Knowing danger signs lets the couple seek care early.", "D"],
[139, "You are admitting a pregnant woman with Pregnancy Induced Hypertension (PIH). You advice her to adhere to strict regime of bed rest in lateral recumbent position. Which of the following rationales would you tell the mother concerning this position?", ["Helps to decrease pressure on the abdominal aorta", "Helps to decrease pressure on abdomen organs", "Helps to decrease pressure on the inferior vena cava and improves renal blood flow", "Helps to prevent pressure on the pelvic organs"], "C", "The lateral position removes the uterus from the inferior vena cava and improves blood flow.", "D"],
[140, "You are caring for newborn babies in a neonatal unit during their first 24 hours of life. Which of the following signs would you monitor frequently?", ["Reflexes and heart rate", "Temperature and respiration", "Muscle tone and skin colour", "Grimace and pulse rate"], "B", "Temperature and respiration change quickly in the first 24 hours.", "D"],
[141, "You are discussing on neonatal care plan to post natal mothers on breast feeding. Which action will you demonstrate to the mothers to expel air swallowed during feeding?", ["Positioning the newborn baby on the shoulder (burping) after feeding", "Positioning the newborn baby on semi-fowlers position after feeding", "Positioning the newborn baby on prone position after feeding", "Positioning the newborn on the right side of shoulder after feeding"], "A", "Holding the baby on the shoulder helps burping and expels swallowed air.", "D"],
[142, "You have received a Baby Born before Arrival (BBA) at the post-natal ward. On assessment you identified the baby has less than 20 breaths per minute. Which of the following emergency interventions will you initiate?", ["Clear airway and resuscitate the baby by using mouth to mouth respiration", "Clear airway and resuscitate the baby by administering oxygen with nasal catheter", "Clear airway and resuscitate the baby by using thumb fingers compression", "Clear airway and resuscitate the baby by using a bag and mask immediately"], "D", "A baby breathing below 20 breaths per minute needs resuscitation with bag and mask.", "D"],
[143, "You are assessing a three days aged newborn baby suspected to have tetanus. Which of the following signs and symptoms would you identify to confirm the diagnosis?", ["Severe twitching with head and heels bend backward", "Jerky movements of the limbs and face with head and heels bend backwards", "Rapid and repetitive movements of the limbs with head and heels bend backwards", "Extreme hyperextension of the body (opisthotonos) and trismus/spasms"], "D", "Opisthotonos (arching of the body) is typical of neonatal tetanus.", "D"],

Q.sort((a,b)=>a[0]-b[0]);
const secOf=n=>S.find(s=>s[0]===(Q.find(q=>q[0]===n)||[])[5]);
const st={a:{},f:new Set(),i:0,sec:null,done:false};
const K="tnmcle2016_v1";
function save(){try{localStorage.setItem(K,JSON.stringify({a:Object.fromEntries(Object.entries(st.a).map(([i,v])=>[Q[i][0],v])),f:[...st.f].map(i=>Q[i][0]),n:Q[st.i][0],done:st.done}))}catch(e){}}
try{const d=JSON.parse(localStorage.getItem(K)||"null");if(d){const ix=n=>Q.findIndex(q=>q[0]==n);for(const[n,v]of Object.entries(d.a||{})){const j=ix(n);if(j>=0)st.a[j]=v}for(const n of d.f||[]){const j=ix(n);if(j>=0)st.f.add(j)}const j=ix(d.n);if(j>=0)st.i=j;st.done=!!d.done}}catch(e){}

const $=id=>document.getElementById(id);
function side(){save(); $("secs").innerHTML='<div class="mu" style="margin-bottom:6px">Sections</div>'+S.map(s=>{const k=Q.filter(q=>secOf(q[0])===s).length;return `<button class="sec ${st.sec===s[0]?'on':''}" onclick="goSec('${s[0]}')" ${k?'':'disabled'}>${s[0]}: ${s[1]} <span class="mu">(${k?k+' loaded':'not loaded'})</span></button>`}).join("")+`<button class="sec ${st.sec===null?'on':''}" onclick="goSec(null)">All questions</button>`;
 $("grid").innerHTML=Q.map((q,i)=>{let c=[];if(st.done){c.push(st.a[i]===undefined?'':st.a[i]===q[3]?'c':'w')}else if(st.a[i]!==undefined)c.push('ans');if(st.f.has(i))c.push('flg');if(i===st.i)c.push('cur');return `<button class="${c.join(' ')}" onclick="go(${i})">${q[0]}</button>`}).join("");
 const n=Object.keys(st.a).length;$("pb").style.width=n/Q.length*100+"%";$("cnt").textContent=`${n} / ${Q.length} answered`}
function goSec(l){st.sec=l;if(l){const i=Q.findIndex(q=>secOf(q[0])[0]===l);if(i>=0)st.i=i}render()}
function go(i){st.i=i;st.sec=secOf(Q[i][0])[0];if(st.done&&view==="review")return render();view=st.done?"review":"exam";render()}
let view="exam",rf="all";
function opts(i,rev){const q=Q[i];return q[2].map((t,k)=>{const L="ABCD"[k];let c="opt";if(rev){if(L===q[3])c+=" ok";else if(st.a[i]===L)c+=" bad";}else if(st.a[i]===L)c+=" sel";return `<div class="${c}" ${rev?'':`onclick="pick(${i},'${L}')"`}><b>${L}.</b><span>${t}${rev&&L===q[3]?' ✓':''}${rev&&st.a[i]===L&&L!==q[3]?' ✗ (your answer)':''}</span></div>`}).join("")}
function pick(i,L){st.a[i]=L;render()}
function flag(i){st.f.has(i)?st.f.delete(i):st.f.add(i);render()}
function render(){side();if(view==="result")return;const m=$("m");
 if(view==="review"){m.innerHTML=`<div class="row" style="margin-bottom:10px">${[["all","All"],["wrong","Wrong"],["none","Unanswered"],["flag","Flagged"]].map(([k,l])=>`<button class="${rf===k?'p':''}" onclick="rf='${k}';render()">${l}</button>`).join("")}</div>`+Q.map((q,i)=>{const ok=st.a[i]===q[3];if(rf==="wrong"&&(ok||st.a[i]===undefined))return"";if(rf==="none"&&st.a[i]!==undefined)return"";if(rf==="flag"&&!st.f.has(i))return"";return `<div class="card"><div class="mu">Q${q[0]} · Section ${secOf(q[0])[0]} · ${st.a[i]===undefined?'Unanswered':ok?'Correct':'Incorrect'}</div><div class="q">${q[1]}</div>${opts(i,true)}<div class="rat"><b>Correct answer: ${q[3]}.</b> ${q[4]}</div></div>`}).join("")+`<div class="row"><button onclick="showRes()">Back to results</button></div>`;return}
 const i=st.i,q=Q[i],list=Q.map((x,k)=>k).filter(k=>!st.sec||secOf(Q[k][0])[0]===st.sec),p=list.indexOf(i);

function stats(){return S.map(s=>{const qs=Q.map((q,i)=>i).filter(i=>secOf(Q[i][0])===s);const c=qs.filter(i=>st.a[i]===Q[i][3]).length;return{s,n:qs.length,c,pct:qs.length?c/qs.length*100:null}})}
const TIPS={A:"Drill the nursing process phases, ABC prioritization, fluid/IV calculations and first-aid triage; practise ‘first action’ questions.",B:"Revise pre/post-operative care, shock, renal, cardiac and respiratory conditions; link each sign to its pathophysiology and priority nursing diagnosis.",C:"Study outbreak investigation steps, IMCI classifications, immunization targets, epidemiology formulas (median, fatality rate) and community assessment sequence.",D:"Rehearse the partograph, third-stage management, PPH, obstetric emergencies, newborn care and PMTCT/family planning protocols.",E:"Review mental status exam terminology, therapeutic communication, delusion types and safety interventions for psychiatric emergencies.",F:"Learn leadership styles, communication directions, delegation rules, supervision tools, budgets and conflict-resolution modes."};
function showRes(){view="result";const r=stats(),tot=Q.length,sc=Q.filter((q,i)=>st.a[i]===q[3]).length/2,max=tot/2;
 $("m").innerHTML=`<div class="card"><div class="mu">Final score (${tot} loaded questions × 0.5 mark)</div><div class="big">${sc} / ${max} Marks</div><div>${(sc/max*100).toFixed(1)}%</div></div>
 <div class="card"><b>Section breakdown</b><table><tr><th>Section</th><th>Correct</th><th>Marks</th><th>%</th></tr>${r.map(x=>x.n?`<tr><td>${x.s[0]}: ${x.s[1]}</td><td>${x.c}/${x.n}</td><td>${x.c/2}/${x.n/2}</td><td class="${x.pct<50?'lo':''}">${x.pct.toFixed(0)}%</td></tr>`:`<tr><td>${x.s[0]}: ${x.s[1]}</td><td colspan="3" class="mu">No questions loaded</td></tr>`).join("")}</table></div>
 <div class="card"><b>Recommendations Report</b>${(()=>{const w=r.filter(x=>x.n&&x.pct<50);return(w.length?w.map(x=>`<p><b class="lo">${x.s[1]} (${x.pct.toFixed(0)}%)</b><br>${TIPS[x.s[0]]} Re-attempt the missed items in Review Mode and write a one-line rule for each.</p>`).join(""):`<p>No section is below 50%. Keep sharpening with timed practice (about 1 minute per question) and re-read rationales for every miss.</p>`)+`<p class="mu">General: flagged questions (${st.f.size}) show where confidence is low; revisit those first.</p>`})()}</div>
 <div class="row"><button class="p" onclick="view='review';render()">Open Review Mode</button><button onclick="resetAll()">Restart exam</button></div>`}
function doSubmit(){st.done=true;$("sub").textContent="View Results";showRes();side()}
$("sub").onclick=()=>{const n=Object.keys(st.a).length;if(st.done)return showRes();view="confirm";side();$("m").innerHTML=`<div class="card"><b>Submit exam?</b><p>You have answered ${n} of ${Q.length} questions. You cannot change answers after submitting.</p><div class="row"><button class="p" onclick="doSubmit()">Yes, submit</button><button onclick="view='exam';render()">Cancel</button></div></div>`};
if(st.done){$("sub").textContent="View Results";side();showRes()}else render();
</script></body></html>
