<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>TNMCLE 2024 Practice Exam</title>
<style>
:root{--bg:#f6f7f9;--sf:#fff;--tx:#1b2430;--mu:#5d6b7c;--bd:#d8dee6;--ac:#0f6e56;--ok:#d9f2e4;--okb:#1b8a50;--no:#fbe0e0;--nob:#c23b3b;--fl:#f3b63f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12171d;--sf:#1b222b;--tx:#e8edf3;--mu:#97a4b4;--bd:#2f3946;--ac:#3fbf9c;--ok:#16372a;--okb:#3fbf7c;--no:#3d1c1c;--nob:#e06a6a}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--sf);border-bottom:1px solid var(--bd);padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:16px;margin:0;flex:1;min-width:180px}.bar{height:8px;background:var(--bd);border-radius:4px;flex:1 1 100%;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .2s}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:8px;padding:7px 12px}button.p{background:var(--ac);border-color:var(--ac);color:#fff}button:disabled{opacity:.4}
.wrap{display:flex;gap:14px;padding:14px;max-width:1100px;margin:auto}nav{width:230px;flex:none}main{flex:1;min-width:0}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.sec{display:block;width:100%;text-align:left;margin-bottom:6px;font-size:13px}.sec.on{border-color:var(--ac);outline:1px solid var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px}.grid button{padding:5px 0;font-size:12px}
.grid .ans{background:var(--ac);color:#fff;border-color:var(--ac)}.grid .flg{box-shadow:inset 0 -4px 0 var(--fl)}.grid .cur{outline:2px solid var(--tx)}.grid .c{background:var(--ok);border-color:var(--okb);color:var(--tx)}.grid .w{background:var(--no);border-color:var(--nob);color:var(--tx)}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin:8px 0;cursor:pointer}.opt.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent)}
.opt.ok{background:var(--ok);border-color:var(--okb)}.opt.bad{background:var(--no);border-color:var(--nob)}.opt b{min-width:20px}
.q{font-size:16px;font-weight:600}.mu{color:var(--mu);font-size:13px}.rat{border-left:4px solid var(--ac);padding:6px 10px;margin-top:8px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.big{font-size:34px;font-weight:700}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px}.lo{color:var(--nob);font-weight:600}
@media(max-width:720px){.wrap{flex-direction:column}nav{width:100%}}
body{background:linear-gradient(135deg,color-mix(in srgb,var(--bg) 85%,#0f6e56),var(--bg)) fixed}</style></head><body>
<header><a href="./" style="text-decoration:none;font-size:20px" title="Home">🏠</a><h1>TNMCLE Past Paper 2024 – Registration Nurses</h1><span id="cnt" class="mu"></span><button id="sub" class="p">Submit Exam</button><div class="bar"><i id="pb"></i></div></header>
<div class="wrap"><nav><div class="card" id="secs"></div><div class="card"><div class="mu" style="margin-bottom:6px">Question grid</div><div class="grid" id="grid"></div><div class="mu" style="margin-top:8px">Filled = answered · gold underline = flagged</div></div></nav><main id="m"></main></div>
<script>
const S=[["A","Basic Nursing",1,40],["B","Medical Surgical Nursing",41,76],["C","Community Health Nursing",77,96],["D","Midwifery & Child Health",97,136],["E","Mental Health Nursing",137,160],["F","Leadership & Management",161,180]];
// [no, text, [A,B,C,D], answer, rationale] — add the remaining paper questions here in the same format.
const Q=[
[1,"You are caring for a patient on a mechanical ventilator. Blood gas results indicate a high pH and a PCO2 of 30 mmHg. The patient presents with headache, syncope, confusion and cramps. You determine the patient is experiencing respiratory alkalosis. Which laboratory result would you expect?",["Sodium level of 145 mEq/L","Magnesium level of 2.0 mg/L","Potassium level of 3.0 mEq/L","Phosphorus level of 4.0 mg/dL"],"C","Alkalosis shifts potassium into cells, causing hypokalaemia (K+ 3.0 is low), which explains the cramps. The other values are normal.","B"],
[2,"A 21-year-old primigravida has just completed a difficult, forceps-assisted delivery of twins. Her labour was unusually long and needed oxytocin augmentation. During management you should stay alert for:",["Uterine involution","Uterine atony","Uterine discomfort","Uterine inversion"],"B","Twins (over-distended uterus), prolonged labour and oxytocin exhaustion the muscle, so uterine atony and postpartum haemorrhage are the main risks.","D"],
[3,"A 20-year-old with a new seizure disorder is on phenytoin 100 mg tds. After 10 days he reports reddish-brown urine. What is your appropriate action?",["Assess for kidney function and urine clearance","Assess the patient for blood clotting factor deficiency","Assess the patient for blood clotting factor deficiency","Educate the patient on the side effects of phenytoin"],"D","Phenytoin can colour urine pink, red or reddish-brown. This is harmless, so reassure and educate. Report it only if other signs of kidney or blood problems appear.","B"],
[4,"Before appendectomy a patient receives a single IV antibiotic dose. He complains of hearing impairment and vestibular disorders. Which group of antibiotics do you suspect?",["Aminoglycosides","Macrolides","Tetracycline","Penicillin"],"A","Aminoglycosides (gentamicin, amikacin) are ototoxic and cause hearing loss and vestibular damage, as well as nephrotoxicity.","B"],
[5,"You need to give methylprednisolone sodium succinate 125 mg IV push bid. You have 40 mg/mL on hand. How much do you prepare?",["0.3 mL","3.1 mL","1 mL","1.3 mL"],"B","Volume = dose ÷ concentration = 125 ÷ 40 = 3.125, about 3.1 mL.","A"],
[6,"A 76-year-old patient is admitted for elective knee surgery. Examination shows shallow respirations without distress. Which is a normal physiological change of ageing?",["Increased elastic recoil of the lungs","Increased number of functional capillaries in the alveoli","Decreased residual volume","Decreased vital capacity"],"D","With age, chest wall stiffens and elastic recoil falls, so vital capacity decreases while residual volume increases.","B"],
[7,"A 23-year-old with post-traumatic stress disorder is admitted to a psychiatric male ward with recurrent, unwanted distressing memories of the traumatic event. The psychiatrist prescribes a benzodiazepine. Which medication is a benzodiazepine?",["Haloperidol (Haldol)","Risperidone (Risperdal)","Clonazepam (Klonopin)","Olanzapine (Zyprexa)"],"C","Clonazepam is a benzodiazepine. Haloperidol, risperidone and olanzapine are antipsychotics.","E"],
[8,"A newborn in the NICU after birth asphyxia has RR 40/min and irregular, HR 100/min, bluish colour and SpO2 60–80%. What is your appropriate nursing intervention?",["Assisted ventilation to support the baby’s breathing and blood pressure","Put the baby in an incubator and perform bag-mask ventilation","Monitor for respiration, cyanosis and clammy skin","Assessment of breathing, skin-to-skin contact and early breastfeeding"],"B","Irregular breathing, cyanosis and low saturation need positive pressure ventilation with bag and mask while keeping the baby warm. Observation alone is not enough.","D"],
[9,"You discharge an 8-month-old infant who is recovering from gastroenteritis and dehydration. You teach the parents about dietary and fluid requirements. What should you include?",["Safety guidelines","Preparation for surgery","Toilet training","Food preparation"],"D","Teaching should match the problem: hygienic food preparation, ORS, continued breastfeeding and suitable complementary foods prevent recurrence.","D"],
[10,"A 61-year-old with a history of pulmonary disease comes to the emergency department with shortness of breath. PR 75/min, RR 16/min. Which drug is most appropriate to relieve her symptoms?",["Beclomethasone","Adenosine","Salbutamol","Propranolol"],"C","Salbutamol is a rapid-acting bronchodilator for acute relief. Beclomethasone is a preventer, adenosine is for arrhythmias, and propranolol can worsen bronchospasm.","B"],
[11,"An 80-year-old with pulmonary oedema has been ordered extra furosemide 40 mg IV push and will also start digoxin 0.5 mg daily. You check the patient’s most recent:",["Digoxin level","Sodium level","Potassium level","Creatinine level"],"C","Furosemide causes hypokalaemia, and low potassium makes digoxin toxicity and arrhythmias more likely, so check the potassium first.","B"],
[12,"A premature baby delivered 4 minutes ago with an Apgar of 8/10 and stable vitals is in the NICU. At 30 minutes the baby has irregular breathing with grunting and retractions. What is your immediate care?",["Institute oral pharyngeal suction","Perform cardiopulmonary resuscitation","Administer oxygen therapy 15 L/min","Initiate continuous positive airway pressure"],"D","Grunting and retractions in a premature baby suggest respiratory distress syndrome from surfactant deficiency. CPAP keeps the alveoli open and is the immediate care.","D"],
[13,"A 61-year-old man with a long history of alcohol and opioid dependence, enrolled in a recovery programme, shows cognitive deficits. Which drug is appropriate to assist his recovery?",["Disulfiram","Bupropion","Naltrexone","Methadone"],"C","Naltrexone blocks opioid receptors and reduces craving for both alcohol and opioids. Disulfiram causes aversive reactions and methadone is itself an opioid.","E"],
[14,"A 35-year-old woman with schizophrenia began haloperidol 2 mg twice a day. Suddenly she holds her head to one side and complains of neck and jaw spasms. What is your immediate nursing intervention?",["Put the patient on the list for the psychiatrist to see tomorrow","Evaluate the patient for adverse reactions to haloperidol","Assume that the patient is posturing","Tell the patient to lie down and relax"],"B","Neck and jaw spasms are acute dystonia, an extrapyramidal side effect that needs prompt assessment and an order for an anticholinergic such as benztropine.","E"],
[15,"A 45-year-old with anxiety disorder is prescribed alprazolam 0.5 mg daily, but the pharmacist dispensed 0.25 mg tablets. You must give 0.5 mg. How many tablets do you give?",["2 tablets","2.5 tablets","1 tablet","1.5 tablets"],"A","0.5 mg ÷ 0.25 mg per tablet = 2 tablets.","E"],
[16,"A patient 24 hours after cardiac surgery has urine output averaging 19 mL/hour for 2 hours. After a 500 mL IV bolus the next hour’s urine is 25 mL. BUN is 45 mg/dL and creatinine 2.2 mg/dL. You interpret that the patient is at risk for:",["Hypovolaemia","UTI","Glomerulonephritis","Acute renal failure"],"D","Persistent oliguria (below 30 mL/hour) despite a fluid bolus, with high BUN and creatinine, shows kidney injury rather than simple volume depletion.","B"],
[44,"You assess a 29-year-old man’s kidney function with an indwelling urinary catheter by measuring hourly urine output. Which measure should make you notify the physician?",["90 mL in 3 hours","Less than 30 mL/hour","64 mL in 2 hours","125 mL in 4 hours"],"B","Adequate output is at least 30 mL/hour (0.5 mL/kg/hour). The other options are about 30–32 mL/hour.","B"],
[45,"Bi Z, 48, has ventricular arrhythmia. You give IV procainamide (3–6 mg/kg over 5 minutes). She suddenly complains of nausea and drowsiness. Which intervention do you do first?",["Do a 12-lead ECG right away","Measure the heart rate on the rhythm strip","Check the blood pressure and heart rate","Give hydralazine (Apresoline)"],"C","Rapid procainamide can cause hypotension and bradycardia. Nausea and drowsiness are early signs, so check blood pressure and heart rate first.","B"],
[46,"An unconscious male patient has pH 7.30, low bicarbonate, normal carbon dioxide and elevated potassium. These results indicate:",["Respiratory acidosis","Metabolic acidosis","Overcompensated respiratory acidosis","Combined respiratory and metabolic acidosis"],"B","Low pH with low bicarbonate and normal CO2 is metabolic acidosis. Acidosis pushes potassium out of cells, explaining the high potassium.","B"],
[47,"A 56-year-old with a history of polysubstance abuse has nausea and vomiting 24 hours after admission, with pupillary dilation and lacrimation. Which withdrawal do you suspect?",["Cocaine withdrawal","Cannabis withdrawal","Alcohol withdrawal","Opioid withdrawal"],"D","Opioid withdrawal gives mydriasis, lacrimation, rhinorrhoea, yawning, nausea, vomiting and diarrhoea. It is distressing but rarely life-threatening.","E"],
[48,"You discharge a 5-month-old with poor weight gain and projectile vomiting after eating, admitted to NICU with pyloric stenosis. Which nutrition instruction do you give the mother?",["Withhold oral feeding until the surgery is performed","Provide total enteral feeding until surgery is performed","Feed the infant slowly while he or she is sitting in an infant seat or being held upright","Feed the baby by nasogastric tube inserted by the health care provider"],"C","Slow feeds in an upright position reduce vomiting and aspiration. Small frequent feeds are recommended.","D"],
[60,"A 56-year-old with hyperthyroidism is scheduled for thyroidectomy. The surgeon orders Lugol’s solution 1 mL three times a day. What is the primary reason for giving it pre-operatively?",["Decrease the risk of agranulocytosis post-operatively","Prevent tetany while the patient is under general anaesthesia","Reduce the size and vascularity of the thyroid and prevent haemorrhage","Potentiate the effect of other pre-operative medication so less medicine is needed"],"C","Iodine reduces thyroid hormone release and the gland’s blood flow, so the thyroid is smaller and firmer and bleeds less, and it also lowers the risk of thyroid storm.","B"],
[61,"In the male ICU you will give naloxone hydrochloride 0.4–2 mg IV to a patient with a known opioid overdose. Which equipment should be at the bedside?",["Normal saline","Suction machine","Resuscitative equipment","Nasogastric tube"],"C","Naloxone can suddenly reverse the opioid, causing vomiting, agitation or seizures, and the effect may wear off before the opioid, so resuscitation equipment must be ready.","B"],
[63,"A 20-year-old with obsessive-compulsive disorder, with aggressive and unpleasant sexual thoughts, is given clomipramine 25 mg at bedtime. What is the expected outcome?",["Increases serotonin levels","Increases dopamine levels","Decreases norepinephrine levels","Decreases GABA levels"],"A","Clomipramine is a tricyclic that strongly blocks serotonin reuptake, which relieves obsessions and compulsions.","E"],
[64,"According to the nursing code of ethics, when a conflict arises between the client’s needs and what the family, physician or hospital policy wants, what is your first loyalty?",["Hospital","Client","Family","Physician"],"B","The nurse’s primary commitment is to the client, whose welfare and rights come first.","A"],
[65,"A patient after left adrenalectomy is sleepy but easily aroused. IV normal saline with hydrocortisone is running. Which intervention is essential in your care plan?",["Monitor blood glucose levels every shift to detect hypo- or hyperglycaemia","Teach the patient how to care for his wound","Keep flat on his back with minimal movement","Give hydrocortisone until vital signs stabilize, then discontinue"],"A","After adrenalectomy the patient depends on replacement steroids. Glucocorticoids raise glucose, while adrenal insufficiency can cause hypoglycaemia, so glucose is monitored. Steroids must be tapered, not stopped suddenly.","B"],
[66,"A 64-year-old with wheezing receives theophylline 300 mg per day IV. After several doses he is restless and has palpitations. Which level shows theophylline toxicity?",["10 mcg/mL","15 mcg/mL","20 mcg/mL","25 mcg/mL"],"D","The therapeutic range is 10–20 mcg/mL. Restlessness and palpitations at 25 mcg/mL show toxicity.","B"],
[67,"A 37-year-old with schizophrenia received 10 mg fluphenazine. Temp is 38.9 °C, PR 120/min and BP 210/140 mmHg. He is confused and incontinent, and you suspect neuroleptic malignant syndrome. What is your first action?",["Give the next dose of fluphenazine, call the physician and monitor vital signs","Withhold the next dose of fluphenazine, call the physician and monitor vital signs","Withhold the next dose, give an antipyretic and increase fluid intake","Give the next dose of fluphenazine and restrict the patient to the room"],"B","NMS (fever, rigidity, autonomic instability, confusion) is life-threatening. Stop the antipsychotic immediately, notify the physician and monitor vitals.","E"]
];
Q.sort((a,b)=>a[0]-b[0]);
const secOf=n=>S.find(s=>s[0]===(Q.find(q=>q[0]===n)||[])[5]);
const st={a:{},f:new Set(),i:0,sec:null,done:false};
const K="tnmcle2024_v1";
function save(){try{localStorage.setItem(K,JSON.stringify({a:Object.fromEntries(Object.entries(st.a).map(([i,v])=>[Q[i][0],v])),f:[...st.f].map(i=>Q[i][0]),n:Q[st.i][0],done:st.done}))}catch(e){}}
try{const d=JSON.parse(localStorage.getItem(K)||"null");if(d){const ix=n=>Q.findIndex(q=>q[0]==n);for(const[n,v]of Object.entries(d.a||{})){const j=ix(n);if(j>=0)st.a[j]=v}for(const n of d.f||[]){const j=ix(n);if(j>=0)st.f.add(j)}const j=ix(d.n);if(j>=0)st.i=j;st.done=!!d.done}}catch(e){}
function resetAll(){try{localStorage.removeItem(K)}catch(e){}location.reload()}
const $=id=>document.getElementById(id);
function side(){save(); $("secs").innerHTML='<div class="mu" style="margin-bottom:6px">Sections</div>'+S.map(s=>{const k=Q.filter(q=>secOf(q[0])===s).length;return `<button class="sec ${st.sec===s[0]?'on':''}" onclick="goSec('${s[0]}')" ${k?'':'disabled'}>${s[0]}: ${s[1]} <span class="mu">(${k?k+' loaded':'not loaded'})</span></button>`}).join("")+`<button class="sec ${st.sec===null?'on':''}" onclick="goSec(null)">All questions</button>`;
 $("grid").innerHTML=Q.map((q,i)=>{let c=[];if(st.done){c.push(st.a[i]===undefined?'':st.a[i]===q[3]?'c':'w')}else if(st.a[i]!==undefined)c.push('ans');if(st.f.has(i))c.push('flg');if(i===st.i)c.push('cur');return `<button class="${c.join(' ')}" onclick="go(${i})">${q[0]}</button>`}).join("");
 const n=Object.keys(st.a).length;$("pb").style.width=n/Q.length*100+"%";$("cnt").textContent=`${n} / ${Q.length} answered`}
function goSec(l){st.sec=l;if(l){const i=Q.findIndex(q=>secOf(q[0])[0]===l);if(i>=0)st.i=i}render()}
function go(i){st.i=i;st.sec=secOf(Q[i][0])[0];if(st.done&&view==="review")return render();view=st.done?"review":"exam";render()}
let view="exam",rf="all";
function opts(i,rev){const q=Q[i];return q[2].map((t,k)=>{const L="ABCD"[k];let c="opt";if(rev){if(L===q[3])c+=" ok";else if(st.a[i]===L)c+=" bad";}else if(st.a[i]===L)c+=" sel";return `<div class="${c}" ${rev?'':`onclick="pick(${i},'${L}')"`}><b>${L}.</b><span>${t}${rev&&L===q[3]?' ✓':''}${rev&&st.a[i]===L&&L!==q[3]?' ✗ (your answer)':''}</span></div>`}).join("")}
function pick(i,L){st.a[i]=L;render()}
function flag(i){st.f.has(i)?st.f.delete(i):st.f.add(i);render()}
function render(){side();if(view==="result")return;const m=$("m");
 if(view==="review"){m.innerHTML=`<div class="row" style="margin-bottom:10px">${[["all","All"],["wrong","Wrong"],["none","Unanswered"],["flag","Flagged"]].map(([k,l])=>`<button class="${rf===k?'p':''}" onclick="rf='${k}';render()">${l}</button>`).join("")}</div>`+Q.map((q,i)=>{const ok=st.a[i]===q[3];if(rf==="wrong"&&(ok||st.a[i]===undefined))return"";if(rf==="none"&&st.a[i]!==undefined)return"";if(rf==="flag"&&!st.f.has(i))return"";return `<div class="card"><div class="mu">Q${q[0]} · Section ${secOf(q[0])[0]} · ${st.a[i]===undefined?'Unanswered':ok?'Correct':'Incorrect'}</div><div class="q">${q[1]}</div>${opts(i,true)}<div class="rat"><b>Correct answer: ${q[3]}.</b> ${q[4]}</div></div>`}).join("")+`<div class="row"><button onclick="showRes()">Back to results</button></div>`;return}
 const i=st.i,q=Q[i],list=Q.map((x,k)=>k).filter(k=>!st.sec||secOf(Q[k][0])[0]===st.sec),p=list.indexOf(i);
 m.innerHTML=`<div class="card"><div class="row"><span class="mu" style="flex:1">Question ${q[0]} of 147 · Section ${secOf(q[0])[0]}: ${secOf(q[0])[1]}</span><button onclick="flag(${i})">${st.f.has(i)?'⚑ Flagged':'⚐ Flag for review'}</button></div><p class="q">${q[1]}</p>${opts(i,false)}<div class="row" style="margin-top:10px"><button onclick="go(${list[p-1]})" ${p<=0?'disabled':''}>← Previous</button><button class="p" onclick="go(${list[p+1]})" ${p>=list.length-1?'disabled':''}>Next →</button></div></div><div class="mu">Flagged: ${[...st.f].map(k=>'Q'+Q[k][0]).join(', ')||'none'}</div>`}
function stats(){return S.map(s=>{const qs=Q.map((q,i)=>i).filter(i=>secOf(Q[i][0])===s);const c=qs.filter(i=>st.a[i]===Q[i][3]).length;return{s,n:qs.length,c,pct:qs.length?c/qs.length*100:null}})}
const TIPS={A:"Drill the nursing process phases, ABC prioritization, fluid/IV calculations and first-aid triage; practise ‘first action’ questions.",B:"Revise pre/post-operative care, shock, renal, cardiac and respiratory conditions; link each sign to its pathophysiology and priority nursing diagnosis.",C:"Study outbreak investigation steps, IMCI classifications, immunization targets, epidemiology formulas (median, fatality rate) and community assessment sequence.",D:"Rehearse the partograph, third-stage management, PPH, obstetric emergencies, newborn care and PMTCT/family planning protocols.",E:"Review mental status exam terminology, therapeutic communication, delusion types and safety interventions for psychiatric emergencies.",F:"Learn leadership styles, communication directions, delegation rules, supervision tools, budgets and conflict-resolution modes."};
function showRes(){view="result";const r=stats(),tot=Q.length,sc=Q.filter((q,i)=>st.a[i]===q[3]).length/2,max=tot/2;
 $("m").innerHTML=`<div class="card"><div class="mu">Final score (${tot} loaded questions × 0.5 mark)</div><div class="big">${sc} / ${max} Marks</div><div>${(sc/max*100).toFixed(1)}%</div></div>
 <div class="card"><b>Section breakdown</b><table><tr><th>Section</th><th>Correct</th><th>Marks</th><th>%</th></tr>${r.map(x=>x.n?`<tr><td>${x.s[0]}: ${x.s[1]}</td><td>${x.c}/${x.n}</td><td>${x.c/2}/${x.n/2}</td><td class="${x.pct<50?'lo':''}">${x.pct.toFixed(0)}%</td></tr>`:`<tr><td>${x.s[0]}: ${x.s[1]}</td><td colspan="3" class="mu">No questions loaded</td></tr>`).join("")}</table></div>
 <div class="card"><b>Recommendations Report</b>${(()=>{const w=r.filter(x=>x.n&&x.pct<50);return(w.length?w.map(x=>`<p><b class="lo">${x.s[1]} (${x.pct.toFixed(0)}%)</b><br>${TIPS[x.s[0]]} Re-attempt the missed items in Review Mode and write a one-line rule for each.</p>`).join(""):`<p>No section is below 50%. Keep sharpening with timed practice (about 1 minute per question) and re-read rationales for every miss.</p>`)+`<p class="mu">General: flagged questions (${st.f.size}) show where confidence is low; revisit those first.</p>`})()}</div>
 <div class="row"><button class="p" onclick="view='review';render()">Open Review Mode</button><button onclick="resetAll()">Restart exam</button></div>`}
function doSubmit(){st.done=true;$("sub").textContent="View Results";showRes();side()}
$("sub").onclick=()=>{const n=Object.keys(st.a).length;if(st.done)return showRes();view="confirm";side();$("m").innerHTML=`<div class="card"><b>Submit exam?</b><p>You have answered ${n} of ${Q.length} questions. You cannot change answers after submitting.</p><div class="row"><button class="p" onclick="doSubmit()">Yes, submit</button><button onclick="view='exam';render()">Cancel</button></div></div>`};
if(st.done){$("sub").textContent="View Results";side();showRes()}else render();
</script></body></html>
