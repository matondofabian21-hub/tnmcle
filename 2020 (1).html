button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:8px;padding:7px 12px}button.p{background:var(--ac);border-color:var(--ac);color:#fff}button:disabled{opacity:.4}

.q{font-size:16px;font-weight:600}.mu{color:var(--mu);font-size:13px}.rat{border-left:4px solid var(--ac);padding:6px 10px;margin-top:8px;font-size:14px}

<header><h1>TNMCLE Past Paper 2020 – Registration Nurses</h1><span id="cnt" class="mu"></span><button id="sub" class="p">Submit Exam</button><div class="bar"><i id="pb"></i></div></header>
<div class="wrap"><nav><div class="card" id="secs"></div><div class="card"><div class="mu" style="margin-bottom:6px">Question grid</div><div class="grid" id="grid"></div><div class="mu" style="margin-top:8px">Filled = answered · gold underline = flagged</div></div></nav><main id="m"></main></div>
<script>
const S=[["A","Basic Nursing",1,40],["B","Medical Surgical Nursing",41,76],["C","Community Health Nursing",77,96],["D","Midwifery & Child Health",97,136],["E","Mental Health Nursing",137,160],["F","Leadership & Management",161,180]];
// [no, text, [A,B,C,D], answer, rationale] — add the remaining paper questions here in the same format.
const Q=[
[1,"You are giving digoxin to a patient with heart failure and must watch for digitalis toxicity. Which symptom would the patient report?",["Muscle aches","Constipation","Pounding headache","Anorexia and nausea"],"D","Early digoxin toxicity shows gastrointestinal effects first: anorexia, nausea and vomiting; later come visual halos, bradycardia and arrhythmias. Check the apical pulse for a full minute before each dose and withhold if below 60 bpm. Hypokalaemia (for example from diuretics) increases toxicity, so monitor potassium.","B"],
[2,"A 45-year-old reports a fire-like sensation starting in the foot and moving up the calf since yesterday, with no injury. Which pain-assessment components have been obtained?",["Aggravating and alleviating factors","Exacerbation with associated signs and symptoms","Intensity, temporal characteristics and functional impact","Location, quality and onset"],"D","The patient has told you where the pain is (foot to calf), what it feels like (burning) and when it began. Intensity, aggravating or relieving factors and effect on function are still unknown. Use a structured tool such as PQRST to complete the assessment.","A"],
[3,"During a CBT session on major depression, which statement best shows a true understanding of the disorder?",["Depression can’t occur without manic episodes.","Depression often begins after a major loss.","Mourning is pathological and not normal behaviour.","Bereavement and depression are the same problem."],"B","Major depression commonly follows a major loss or stressor. A is false: unipolar depression has no mania (mania defines bipolar disorder). Mourning is a normal process, and grief differs from depression because it comes in waves and self-esteem is usually preserved. Note: the key in the source document lists A, which is clinically incorrect.","E"],
[4,"A patient in the ICU has ARDS. Which arterial blood gas pattern is characteristic at the initial stage?",["Respiratory alkalosis","Metabolic alkalosis","Respiratory acidosis","Metabolic acidosis"],"A","Early ARDS causes hypoxaemia that stimulates rapid breathing, so CO2 is blown off and pH rises (respiratory alkalosis with low PaO2). Later, as the patient tires and lungs stiffen, CO2 is retained and respiratory acidosis develops, which signals deterioration.","B"],
[5,"You prepare a lesson for a 60-year-old woman referred to physiotherapy. Which factor should you include as a possible cause of her problem (osteoporosis)?",["Lack of exercise","Lack of calcium","Hormonal disturbances","Genetic predisposition"],"B","Bone mass depends on calcium and vitamin D intake; deficiency leads to bone loss, fractures and pain. Postmenopausal oestrogen loss, inactivity and heredity also contribute, but calcium deficiency is the direct nutritional cause that nurses can teach her to correct.","B"],
[6,"You plan an operational study on risk factors for pressure ulcers. Which group is your study population?",["Malnourished young patient","Patient with shortness of breath","Patient with altered consciousness level","Patient with muscular pain"],"C","Patients with reduced consciousness cannot feel pressure or change position, so tissue stays compressed and ischaemic. They are the high-risk group in which risk factors such as immobility, moisture and friction are best studied.","A"],
[7,"For a Pap smear sensitization programme, which group of women is your priority?",["Women with a history of HPV","Women on oral contraceptives","Women with a history of genital herpes","Women planning to conceive within a year"],"A","Persistent high-risk HPV infection (types 16 and 18) is the main cause of cervical cancer, so women with HPV history need regular screening. Early detection of precancerous changes allows treatment before cancer develops.","C"],
[8,"Mrs. Juu is admitted post-mastectomy. What is the expected outcome of your care plan?",["Vital signs checked and incision site approximated","Relative informed and vital signs checked","Absence of drainage at the incision site and patient remains afebrile","Incision site approximated and patient ambulated"],"C","An outcome describes the patient’s expected state, not the nurse’s actions. No excessive drainage and no fever show the wound is healing without infection or haemorrhage. Options A and B list nursing activities rather than patient outcomes.","B"],
[9,"You take part in a COVID-19 awareness campaign in the community. What is the rationale?",["Identify infected cases","Reduce the risk of disease spread and contamination in the community","Check laboratory capacity","Get awareness of disease patterns of occurrence"],"B","Health education promotes prevention behaviours (hand hygiene, masking, distancing, vaccination) that interrupt transmission. Case identification and laboratory checks belong to surveillance, not to sensitization.","C"],
[10,"A client returns to the post-anaesthesia care unit after a modified radical mastectomy. What do you observe first?",["Obtain and record vital signs","Ensure the client’s airway is free of obstruction","Observe that drainage tubes are patent","Check the dressings for drainage"],"B","Airway comes first (ABC). Anaesthesia depresses consciousness and the tongue or secretions can obstruct breathing within minutes. Vital signs, drains and dressings follow once the airway is secured.","B"],
[11,"A client is scheduled for abdominoperineal resection with permanent colostomy. Which preoperative measure do you anticipate?",["Stop eating 24 hours before surgery","Inform him TPN will likely be used after surgery","Administer ordered antibiotics the evening before surgery","Advise him to limit physical activity"],"C","Bowel surgery needs mechanical bowel preparation plus oral or IV antibiotics to lower colonic bacteria and prevent wound infection and peritonitis. Fasting is usually from midnight (not 24 hours) and activity is encouraged.","B"],
[12,"Mr. Chupa has a fractured right tibia. Which independent nursing intervention will you include?",["Elevate the leg 5 inches above the heart","Apply a cold pack to the tibia","Perform range of motion to the right leg","Administer aspirin 325 mg every 4 hours as needed"],"A","Elevation reduces swelling and pain and is within the nurse’s independent scope. Drugs need a prescription, and passive range of motion on a fractured limb is contraindicated because it can displace the fracture.","B"],
[13,"For a child with severe pneumonia, which IMCI management applies?",["Give prescribed antibiotic and refer","Refer him urgently to the hospital","Instruct the mother to increase fluid intake","Admit the child for oxygen therapy"],"B","IMCI classifies severe pneumonia (chest indrawing, danger signs) as needing urgent referral to hospital for oxygen and injectable antibiotics. A dispensary cannot give oxygen. IMCI also advises giving the first dose of an antibiotic before the transfer, as the key here marks referral as the main action.","C"],
[14,"A woman in the first stage of labour has good contractions but diminished progress. Which diagnosis do you suspect?",["Multiple pregnancy with maternal distress","Distended bladder pressing on the cervix","Fetal abnormalities with abnormal presentation","Obstructed labour that may lead to early uterine rupture"],"B","Good contractions with slow descent can be due to a full bladder that blocks descent of the presenting part. It is a simple, reversible cause that you check first and correct by asking her to void or by catheterizing if needed before suspecting obstruction.","D"],
[15,"A 5-month-old has diarrhoea 4–5 times a day, skin pinch going back slowly and sunken eyes. How does IMCI classify him?",["No signs of dehydration","Some dehydration","Severe dehydration","Insufficient data"],"B","IMCI classifies some dehydration when two of these are present: restless or irritable, sunken eyes, drinks eagerly, skin pinch going back slowly. Severe dehydration needs skin pinch going back very slowly, lethargy or inability to drink. Treat with ORS (Plan B). Note: the source key lists C, which does not match the IMCI criteria.","C"],
[16,"A terminally ill man says, “I wish my family would stop hoping for a cure! After all, I’m the one who’s dying.” Best response?",["“Have you shared your feelings with your family?”","“I think we should talk more about your anger with your family.”","“You’re feeling angry that your family continues to hope for you to be cured?”","“You are probably very depressed, which is understandable with such a diagnosis.”"],"A","The key selects the response that encourages the patient to communicate his feelings to the people concerned, which helps resolve the conflict. Avoid labelling him depressed (D) or imposing your interpretation (B). Reflecting feelings (C) is also therapeutic.","A"],
[17,"You teach juniors effective chest compressions in CPR. What technique do you insist on?",["At least 2 inches deep at 100–120 per minute","At least 2 inches deep at 60 per minute","At least 1 inch deep at 100–120 per minute","At least 1 inch deep at 80 per minute"],"A","Adult CPR needs a depth of at least 5 cm (2 inches) at 100–120 compressions per minute, full chest recoil and minimal interruptions. Shallow or slow compressions fail to generate enough coronary and cerebral perfusion.","A"],
[18,"A postpartum mother with mastitis has severe pain during breastfeeding. Which measure do you insist on?",["Use analgesics to relieve discomfort","Continuous breastfeeding until the condition resolves","Use antibiotics; she should feel better in 24–48 hours","Wear a supportive bra to relieve discomfort"],"D","The key selects a supportive bra, which reduces breast movement, pain and engorgement. Also teach effective milk removal and continued breastfeeding from the affected breast, analgesics and, if infection is confirmed, antibiotics.","D"],
[19,"As OPD shift manager you receive five road-accident casualties. Which administrative style do you use to mobilize resources immediately?",["Bureaucratic/Democratic style","Ultra-liberal/Laissez-faire style","Focused contingency style","Autocratic/Authoritarian style"],"C","Contingency (situational) leadership adapts the style to the circumstances. An emergency needs quick, directive decisions that mobilize staff and supplies immediately, with later return to consultation when the crisis ends.","F"],
[20,"Mrs. Jaa wants a family planning method that also protects against STIs. What do you advise?",["Consistent and correct use of barrier methods","Spermicides during sexual acts","Lactational amenorrhoea method","Billings ovulation method"],"A","Condoms (male or female) are the only methods that give dual protection against pregnancy and STIs, including HIV. Spermicides, LAM and natural methods do not prevent STIs.","D"],
[21,"At the antenatal clinic, which signs tell you Ms. G has severe pre-eclampsia?",["BP 140/90 mmHg, generalized oedema","BP 160/110 mmHg, generalized oedema and proteinuria +++","BP 139/85 mmHg, generalized oedema","BP 140/90 mmHg, generalized oedema and proteinuria +++"],"B","Severe pre-eclampsia is diastolic BP of 110 mmHg or more (or systolic 160 or more) with significant proteinuria (+++). BP 140/90 with proteinuria is mild to moderate. Give magnesium sulphate and refer or deliver.","D"],
[22,"At a nurses’ meeting, promotions, uniform allowance and retirement benefits are raised. Which advice solves these problems?",["Use the Tanzania Nursing and Midwifery Council","Use public platforms to argue with labour boards","Use professional representatives such as labour unions and TANNA","Use political campaign forums"],"C","Welfare and working-condition issues are handled by staff representatives and unions through negotiation. TNMC regulates standards and licensing, not salaries or benefits, and public or political forums are unprofessional.","F"],
[23,"A woman at 37 weeks, cervix 4 cm, head 3/5 palpable, has the umbilical cord protruding from the vagina. What is most appropriate?",["Sitting-up position and prepare for induction","Lateral position and report to the doctor","Knee-chest position and prepare for referral","Semi-Fowler position and prepare for caesarean section"],"C","This is cord prolapse. Knee-chest (or exaggerated Sims) position lets the presenting part fall away from the cord, preventing compression and fetal hypoxia during urgent referral. Keep the cord moist inside warm saline gauze and never push it back.","D"],
[24,"A 50 kg patient has 40% second-degree burns 1 hour ago. How much IV fluid in the first eight hours?",["8000 mL","16000 mL","4000 mL","2000 mL"],"C","Parkland formula: 4 mL × weight (kg) × % burn = 4 × 50 × 40 = 8,000 mL in 24 hours. Half (4,000 mL) is given in the first 8 hours from the time of the burn and the rest over the next 16 hours.","B"],
[25,"You assist a woman in the second stage of labour. What is the best practice?",["Offer clear fluids between contractions","Encourage ambulation","Instruct her to push with each contraction","Encourage frequent position changes and rest between contractions"],"C","In the second stage, pushing with each contraction (with full dilatation) uses the expulsive force to deliver the baby. Rest between contractions and keeping her well supported are also part of good care.","D"],
[26,"A stroke patient with mobility problems is at risk of skin impairment. What initial intervention?",["Change position using pillows every two hours","Gentle cleaning and thorough drying of the skin","Use absorbent pads and dry clothes","Use therapeutic beds and air mattresses"],"A","Pressure and shear are the root cause, so relieving pressure by turning every two hours with pillow support is the first and most effective step. Skin care and special mattresses support but do not replace repositioning.","B"],
[27,"A student inserts an IUCD under your supervision. In which situation do you urgently remove the device?",["Client presents with severe vaginal bleeding","Client complains of pain at the cervical area","Uterine cavity is in line with the cervical canal","Loading inserter with plunger is rigid to pass"],"A","Severe bleeding may signal perforation, infection or malposition, so the device is removed and the client assessed. Mild cramping after insertion is common, and alignment of cavity and canal is the correct technique.","D"],
[28,"How far do you insert a rectal thermometer into an infant’s anus?",["3 to 4 inches","1 to 2 inches","2 to 3 inches","0.5 to 1.5 inches"],"D","Insert only about 1.25 cm (0.5–1 inch) in infants, holding the thermometer and the baby’s legs steady. Deeper insertion risks rectal perforation.","A"],
[29,"A patient has been deceased for 2 hours in your ward. What is your first intervention before sending the body to the mortuary?",["Inform the relatives","Keep a record of the time of death","Bathe and dry the entire body","Call for help to shift the body"],"B","The time of death is a legal record, so it is documented first after confirmation by the doctor. Then relatives are informed and body care and labelling follow before transfer.","A"],
[30,"Why do you caution nurses against erasing or multiple cancellations in patient files?",["It portrays negligence and laissez-faire attitude","Information belongs to the patient","It could raise suspicion about the accuracy of records","It is hospital standards and policy"],"D","Documentation standards require errors to be corrected by a single line, signed and dated, because records are legal documents. The key marks hospital standards and policy as the rationale; erasures also raise suspicion of tampering.","A"],
[31,"A premature baby has severe jaundice with high bilirubin. Which intervention saves the baby’s life?",["Give glucose as much as possible","Cover the baby’s eyes with patches","Increase light in the baby’s room","Expose the baby to ultraviolet rays"],"D","Phototherapy converts bilirubin into water-soluble forms that are excreted, preventing kernicterus. The key labels it as exposure to light; in practice blue-spectrum lamps are used, never direct sunlight, with eye shields and repeated bilirubin checks.","D"],
[32,"In an outpatient mental health unit, which behaviours of personality-disorder patients have priority for admission?",["Social isolation and neurotic disorder","Self-neglect and discrimination","Suicide attempts and self-mutilation","Mutism and depressive episode"],"C","Suicide attempts and self-harm are immediate threats to life and need a protected inpatient environment. The other behaviours can be managed as outpatients.","E"],
[33,"You have received a mother who brought her 4-year-old daughter to the pediatric unit because of a cough and common cold. Using the IMCI assessment guide, which of the following danger signs would indicate the need for urgent referral to a hospital?",["Signs of severe dehydration","Cough for more than 30 days","Inability to drink","High-grade fever"],"C","IMCI general danger signs are: unable to drink or breastfeed, vomits everything, convulsions, lethargic or unconscious. Any one of them means urgent referral after pre-referral treatment. Chronic cough and fever are classified and managed separately.","C"],
[34,"You are managing Mrs. Dogo in the labor ward under induction with intravenous administration of 5 IU oxytocin in 500 mL of Ringer's Lactate. Which of the following conditions would alert you to discontinue the oxytocin infusion?",["When the fetal heart rate is below 120 beats per minute","When the fetal heart rate is 140 beats per minute","When the fetal heart rate is 150 beats per minute","When the fetal heart rate is 110 beats per minute"],"A","Oxytocin can cause hyperstimulation, reducing placental blood flow and causing fetal bradycardia. A fetal heart rate that falls below the safe range is a sign of fetal distress, so stop the infusion, position the mother on her left side, give oxygen and inform the doctor. The key marks below 120 as the cut-off.","D"],
[35,"You are planning to validate your community nursing diagnosis with the community health committee on the incidence of hookworm in the village. Which of the following steps will you take to ensure mutual understanding of the problem?",["Set objectives and discuss them with the committee","Develop a memorandum of understanding with the community","Establish and maintain a partnership spirit","Involve family members in data collection"],"C","Validation depends on community participation. A trusting partnership with the committee lets both sides agree that the problem exists, share ownership and plan interventions together. Objectives and agreements follow after this understanding is built.","C"],
[36,"You are providing health education to a group of diabetes patients. One of them asks, \"How is hypoglycemia prevented in a healthy person who does not have diabetes, even after fasting for more than 8 hours?\" What would be the best response?",["Metabolism is very slow during fasting","Lipolysis occurs in fat stores to maintain blood glucose level","Fasting triggers conversion of protein into glycogen","Glucagon promotes glucose release from the liver storage site"],"D","When blood glucose falls, the pancreas secretes glucagon, which stimulates glycogenolysis (breakdown of liver glycogen) and later gluconeogenesis, releasing glucose into the blood. This counter-regulatory response keeps healthy people from becoming hypoglycaemic, while diabetic patients on insulin or drugs may lack it.","B"],
[37,"You are caring for an unconscious patient admitted to the intensive care unit with fat embolism, kept on 100% FiO2 and a mechanical ventilator with no marked improvement. Which of the following measures will you take to improve ventilation for this patient?",["Add Positive End Expiratory Pressure (PEEP)","Give the patient diuretics and observe for side effects","Give the patient beta blockers and defibrillation","Increase FiO2 in the ventilator and do nothing"],"A","Fat embolism causes ARDS-like injury with refractory hypoxaemia. PEEP keeps the alveoli open at the end of expiration, improves gas exchange and lets oxygen concentration be lowered, which reduces oxygen toxicity. Monitor blood pressure and for barotrauma.","B"],
[38,"You are caring for a 69-year-old semi-conscious patient admitted to the ward receiving total parenteral nutrition (TPN). The patient suddenly demonstrates the signs and symptoms of air embolism. What will be your priority intervention?",["Place the patient in low Fowler's position.","Place the patient in high Fowler's position.","Place the patient on the left side in the Trendelenburg position.","Stop the total parenteral nutrition."],"D","The first action is to stop the source of the air by clamping the line and stopping the TPN. Then place the patient on the left side in Trendelenburg so air collects in the right atrium away from the pulmonary outflow, give 100% oxygen and call the doctor.","B"],
[39,"Ms. Zaly, a primigravida woman at 37 weeks of gestation, was admitted to the labor ward and presented with signs of severe pre-eclampsia. She was kept on Magnesium Sulfate 50% intravenously. Which of the following will be the appropriate doses for this woman?",["4g MgSO4 diluted with 12 mls of normal saline slowly at 5-10 minutes.","20% MgSO4 diluted with 12 mls of normal saline slowly at 5-10 minutes.","4g MgSO4 diluted with 8 mls of normal saline intravenously.","8g of MgSO4 diluted with 10 mls of normal saline, administered in two buttocks"],"A","The loading dose of magnesium sulphate is 4 g IV (8 mL of the 50% solution) diluted with normal saline to 20 mL and given slowly over 5-10 minutes, followed by 5 g IM in each buttock. Monitor reflexes, respiration over 16 and urine output over 30 mL/hour; calcium gluconate is the antidote.","D"],
[40,"You are caring for a postoperative patient admitted to your ward. His urine output at 8 A.M. is 50 mls, and at 9 A.M., the urine output is 60 mls. Based on the amount of urine output, which of the following would be your nursing intervention for this patient?",["Increase the IV fluid infusion rate","Irrigate the indwelling urinary catheter","Stop the intravenous infusion","Continue to monitor and record hourly"],"D","Normal urine output is at least 0.5 mL/kg/hour, about 30 mL per hour in adults. Outputs of 50 and 60 mL per hour are adequate, so no change is needed and monitoring continues.","B"],
[41,"You are teaching student nurses in mental health care to provide care without doing any harm to their clients, either intentionally or unintentionally. Your response to this student's question will be:",["Autonomy","Veracity","Beneficence","Non-maleficence"],"D","Non-maleficence means \"do no harm\". Autonomy is the right to choose, veracity is truthfulness and beneficence is doing good for the client.","E"],
[48,"Mr. T, a patient with major depression, came to the psychiatric clinic crying and tells you, \"I don't find any hope in life.\" You decided to sit quietly just nearby him. What will be the rationale for your action?",["Assists patient to comply with regime","Changes patient behavior","Prevents patient from suicidal temptation","Provides support to patient"],"D","Silent presence communicates acceptance and caring without pressure to talk. It builds trust and shows the patient he is not alone, although it does not by itself stop suicide risk, which still needs separate assessment.","E"],
[49,"You are giving health advice to a primigravida woman on the normal changes that happen to a newborn baby during the first month, including the loss of 5% to 10% of body weight during the first week of life. Which of the following will be the reason for this change?",["The baby experiences excessive heat","The baby's physical handling and surrounding protection","The baby cries too much","The baby's adaptation to a new environment"],"D","Early weight loss is physiological. The baby loses excess extracellular fluid, passes meconium and urine, and takes small volumes of colostrum while adapting to life outside the womb. Birth weight is regained by about 10-14 days.","D"],
[50,"A community health practitioner reported the presence of a cholera outbreak within the catchment area of the Health Centre where you are working. Which of the following measures will you take first to prevent and control the spread of disease?",["Declare quarantine of the village","Notify the District Health Management Team","Isolate the victims","Identify the most vulnerable group"],"B","Cholera is a notifiable disease. Immediate notification brings supplies, staff and coordination, and allows the district to start the outbreak response. Isolation, treatment and health education follow.","C"],
[51,"While working at a Youth Friendly Services clinic, you receive a 17-year-old girl who was raped 10 hours ago and is worried about becoming pregnant. Which of the following interventions will you do first?",["Provide emergency contraceptive","Refer her for post-exposure prophylaxis","Report to Social Welfare Officer","Take pregnancy test"],"A","Emergency contraception works best when given as early as possible and within 72 hours, so it addresses her main concern immediately. HIV post-exposure prophylaxis (within 72 hours), STI treatment, counselling and reporting follow.","D"],
[52,"You are assisting a primigravida on effective breastfeeding technique. Which of the following practices will evidence the correct attachment of the baby on the mother's breast?",["Baby's mouth open widely, sucking noises heard from the mouth.","Baby's mouth wide open, lips covering the whole nipple and a large amount of the areola in the mouth.","Baby's mouth wide open, chin touching the breast.","Baby's mouth wide open, nipple partially covered, and rapid swallowing observed"],"B","Good attachment shows a wide-open mouth with the nipple and most of the areola inside, which lets the tongue compress the milk sinuses. Smacking noises and rapid shallow sucking suggest poor attachment.","D"],
[53,"You have received a 21-year-old female patient complaining of severe vomiting. On assessment, the findings are: Temperature 38°C, BP 90/50 mmHg, PR 100 bpm, skin pinch goes back very slowly, and dry mucous membranes. What type of intravenous fluid therapy will you administer to this patient?",["Isotonic crystalloids fluid","Hypotonic fluids","Hypertonic fluids","Colloid solution"],"A","She has hypovolaemia from fluid loss. Isotonic crystalloids (normal saline, Ringer's lactate) expand the extracellular volume and restore blood pressure without shifting water in or out of cells.","B"],
[54,"Mrs. Suu, a 37-week pregnant woman, gravida two, was admitted to the maternity ward complaining of lower abdominal pain. Which of the following signs will you consider to diagnose that the woman is in true labor?",["Uterine contractions, fetal position show, and signs of expulsion","Effacement, cervical dilation, show, and uterine contractions","Uterine contractions, cervical sufficiency, show, and presenting part","Cervical dilation, descent, presenting part, and show"],"B","True labour is diagnosed by regular, increasingly strong contractions that cause progressive cervical effacement and dilatation, with a bloody show. Irregular contractions without cervical change are false labour.","D"],
[55,"You have been assigned to care for a gravida 1, para 0 woman of 37 weeks of gestation who has a cervical dilation of 2 cm. Which of the following is your intervention?",["Teach and communicate on labor processes and expected interventions.","Advise her to communicate with relatives until delivery.","Ask her to lie in a lateral position for a long time","Ask her to take a deep breath,it can be easy for the cervix to dilate"],"A","At 2 cm she is in the latent phase. Information about labour and expected procedures reduces anxiety and fear, which otherwise slow labour, and encourages cooperation. Encourage walking, fluids and rest.","D"],
[56,"You are caring for Mr. Chuu, who was admitted to the hospital with a diagnosis of acute renal failure. His urinary output for the first 8 hours is 50 ml, and laboratory results reveal sodium 120 mEq/L and potassium 5.2 mEq/L. Which of the following electrolyte imbalances is presented by this patient?",["Hypercalcemia","Hyperkalemia","Hyperphosphatemia","Hyponatremia"],"D","Normal serum sodium is 135-145 mEq/L, so 120 is hyponatraemia caused by water retention (dilution) in oliguric renal failure. Potassium of 5.2 is only borderline high, and calcium and phosphate values were not given.","B"],
[57,"You are caring for a patient with schizophrenia admitted to the Mental Health Unit. The patient has been prescribed 100 mg chlorpromazine intramuscularly, then 50 mg orally BID, and benztropine orally PRN. What will you need to closely assess and monitor for this patient following the use of benztropine?",["Development of sore throat","Development of yellowish skin cast","Increase in level of agitation","Development of muscle spasms"],"D","Benztropine is given to treat chlorpromazine-induced extrapyramidal symptoms, so the nurse monitors whether muscle spasms (acute dystonia), stiffness or tremor subside. Also watch for anticholinergic effects such as dry mouth and urinary retention.","E"],
[58,"Miss Kuta, a Form Three student, attended the Youth Friendly Clinic where you are working. She came for a family planning method. Which of the following advice will you give her?",["Counsel the client for informed choice","Strictly forbid her from attending the clinic","Use a female condom when having sexual intercourse","Discourage her completely from engaging in sexual intercourse"],"A","Youth-friendly services respect confidentiality and non-judgemental care. Counselling lets her understand all methods, including dual protection, and choose freely. Forbidding or lecturing pushes adolescents away from services.","D"],
[59,"Which of the following extrapyramidal symptoms will you pay attention to when giving nursing care to Mama Odo, who is taking chlorpromazine (Largactil) tablets?",["Dry mouth, blurred vision, urinary retention, and orthostatic hypotension","Muscular weakness and facial spasms","Elevated blood pressure, severe occipital headache, and stiff neck","Amenorrhea, gynecomastia and retrograde orgasm"],"B","Extrapyramidal symptoms are movement disorders: acute dystonia (muscle spasms of face and neck), parkinsonism, akathisia and tardive dyskinesia. A lists anticholinergic effects, C a hypertensive crisis and D hormonal effects. Note: the source key lists D, which does not describe extrapyramidal symptoms.","E"],
[60,"You are teaching newly employed members on how to improve the organization’s quality of services. Which of the following statements reflects good customer care?",["Gather information from other people","Ask the customers complicated questions","Ask them to practice talking politely","Put yourself in the customer’s shoes"],"D","Empathy, seeing the service from the customer's point of view, is the basis of good customer care. It guides respect, listening and responsiveness to needs.","F"],
[61,"You have received a 21-year-old woman who is immobilized and brought to the orthopedic unit. The X-ray shows a fractured femur and pelvis. Which of the following signs and symptoms would you carefully monitor for in this patient?",["Bradycardia and Hypertension","Fever and Bradycardia","Tachycardia and Hypotension","Fever and Hypertension"],"C","Fractures of the femur and pelvis can cause heavy concealed blood loss. Tachycardia and falling blood pressure are signs of hypovolaemic shock and fat embolism, which need urgent fluids and notification of the doctor.","B"],
[62,"You are working in the Neonatal Unit where you have just received a premature neonate weighing 1.5 kg. Which of the following will be your immediate care?",["Taking rectal temperature","Examining for anomalies","Checking airway for patency","Cleaning the vernix caseosa"],"C","The sequence is Airway, Breathing, Circulation. Premature babies have immature lungs and are prone to apnoea and respiratory distress, so airway patency is checked first, before warmth maintenance and examination. Vernix is not removed.","D"],
[63,"During a hospital supervision round, you are emphasizing to all nurses the importance of being accountable and responsible for their nursing interventions and judgments during the provision of care. How will this facilitate the improvement of quality nursing services in your ward?",["Enables individual performance, self-motivation, and teamwork at work","Enables individual self-audit, peer review, and teamwork at the workplace","Enables individual self-effort, performance, and teamwork at work","Enables individual self-audit, motivation, performance, and teamwork at the workplace"],"B","Accountability makes nurses evaluate their own practice (self-audit) and accept review from colleagues (peer review) and work as a team, which are the core mechanisms of quality improvement.","F"],
[64,"Which of the following preventive measures will you carry out for mentally ill patients with signs and symptoms of anxiety disorder?",["Teach the client the importance of taking caffeine daily","Leave anxious clients alone as much as possible","Advise the client to do exercise to conserve endorphins","Help the client link feelings with behavior"],"C","Regular physical exercise releases endorphins and reduces tension, so it is a healthy coping and preventive strategy. Caffeine raises anxiety, and leaving anxious clients alone increases it. Linking feelings with behaviour (D) is also useful in therapy.","E"],
[65,"You are assessing a newborn baby who was reported to be unable to breastfeed. Which of the following would reflect the nursing diagnosis for this child?",["Impaired Moro reflex","Impaired sucking reflex","Impaired rooting reflex","Impaired swallowing reflex"],"B","Breastfeeding depends on the suck reflex, which creates the negative pressure and tongue movement that remove milk. Inability to breastfeed therefore points to an impaired sucking reflex, which is also a danger sign in sick newborns.","D"],
[66,"You are assisting in orthopedic surgery as a scrub nurse to perform open reduction and internal fixation (ORIF) for a femur fracture. Which of the following implant will you assemble for use in this procedure?",["Smith-Peterson nail","Denham nails and its pins","K-nail or screw and plate","Thompson wire"],"C","Femoral shaft fractures are fixed internally with an intramedullary (Küntscher) nail, or with a plate and screws. The other implants are used for fractures of the femoral neck or for hip replacement.","B"],
[67,"You are performing a mental status evaluation on Mr. Cola, who has been identified with paranoid schizophrenia. Which of the following signs and symptoms presented by this patient would lead you to suggest this diagnosis?",["Perceived delusion, peculiar mannerisms, and laughing without any provocation","Abdominal pain, loss of sexual desire, and painful menstrual period","Insomnia, feelings of despair, and loss of esteem","Crying without any provocation, lack of flexibility, and disturbed sleep pattern"],"A","Schizophrenia shows psychotic features: delusions, odd mannerisms and inappropriate affect such as laughing without cause. B is a somatic complaint, C is depression and D suggests mood or catatonic features.","E"],
[68,"You are working at a Health Centre where Mrs. Tongan, a 12-week pregnant woman, came to you complaining of feeling dizzy, headache, chills, and vomiting. How will you manage this woman?",["Give antihistamines, antiemetics, and check vital signs","Provide rest and sleep, check vital signs, and reassurance","Provide reassurance, change environment, and replace fluids","Replacement of fluids, antiemetics, checking vital signs, and blood for malaria test"],"D","Chills with headache and vomiting in a pregnant woman suggest malaria, which is dangerous in pregnancy. Check vital signs, replace lost fluid, control vomiting and confirm with a blood slide or rapid test, then treat as per guidelines.","D"],
[69,"You are discussing with the parents of a young man who has been diagnosed with schizophrenia. They express feelings of responsibility and guilt for their son's problems. How will you educate the parents?",["Acknowledge the responsibility of parents","Explain the biological nature of schizophrenia","Refer the family to a support group","Teach the parents various ways they must change"],"B","Schizophrenia is a brain disorder with genetic and neurochemical causes, not caused by bad parenting. Explaining this relieves guilt. Support groups and family education can follow.","E"],
[70,"Mr. Util is admitted to the psychiatric ward and demonstrates behaviors indicative of acute mania. What would be your nursing intervention?",["Discourage the client's use of abusive language","Protect the client by engaging him in useful activities","Leave the client alone","Keep the music volume high with bright light"],"B","Manic patients have excessive energy and poor judgement. Structured, safe, non-competitive activities channel the energy and protect him from harming himself or others. A low-stimulus environment is needed, not loud music and bright light.","E"],
[71,"You are managing a patient with compromised extracellular fluid regulation, resulting in increased fluid volume and electrolyte imbalance. Which of the following will be the nursing interventions?",["Monitor for a sudden or marked decrease in blood pressure and restlessness","Administer isotonic fluid, normal saline, and dextrose saline","Monitor vital signs, mainly for temperature elevation","Monitor for decreased renal perfusion, cardiac insufficiency, and decreased urinary output and edema formation"],"D","Fluid volume excess is caused by or leads to heart and kidney failure. The nurse monitors for oedema, reduced urine output, raised blood pressure and signs of heart failure. Giving more fluids (B) would worsen it.","B"],
[72,"You are counseling a pregnant woman who is dependent on heroin. Which of the following effects will you inform her may befall her baby?",["Mental retardation","Heroin dependence","Addiction in adulthood","Psychological disturbance"],"B","Heroin crosses the placenta, so the baby is born physically dependent and shows neonatal abstinence syndrome after birth (tremors, irritability, high-pitched cry, poor feeding). It also carries risks of low birth weight and prematurity.","D"],
[73,"You have been assigned to take care of a client who is intoxicated from alcohol in the methadone clinic at your hospital. Which of the following interventions would you consider useful when dealing with this client?",["Wait until the client sobers up","Decide immediately on care goals","Ask what drugs other than alcohol the client has used","Gain compliance by sharing personal drinking habits with the client"],"C","Methadone clients may use several substances, and mixing alcohol, opioids and sedatives can cause respiratory depression. Knowing every drug taken guides safe assessment and treatment. Sharing personal habits is unprofessional.","E"],
[74,"Which of the following actions will you take in a situation where you find all workers have lost interest in work and are resistant to accommodating changes?",["Propose promotion of all staff","Modify duty rotation","Improve communication skills","Perform orientation of staff"],"C","Resistance to change often arises from poor information and mistrust. Better communication (explaining reasons for change, listening and involving staff) restores motivation and cooperation.","F"],
[75,"Mr. Dula, a form II student, reported to the psychiatric clinic telling you that the State has nominated him to be a senior parliament member in the coming cabinet. Which of the following is the best therapeutic approach to apply when nursing this patient?",["Be kind and positively listen to him","Maintain passive friendliness","Perform physical assessment and mental status evaluation","Notify the Headmistress not to restrict the client's emotions"],"C","A grandiose belief that is out of keeping with reality is a possible delusion. A physical examination and mental status evaluation give an objective base to confirm the diagnosis and rule out organic causes before planning care. Do not argue with or confirm the belief.","E"],
[76,"You are observing very close an aggressive patient admitted to the male ward of the psychiatric unit. You noticed that the aggressiveness behavior is increasing. Which of the following nursing interventions will you give at this point in time?",["Initiate separation measures","Acknowledge the patient's behavior","Assist the patient to an area that is quiet","Maintain a safe distance with the patient"],"C","Rising aggression is reduced by lowering stimulation. Calmly guiding him to a quiet area allows de-escalation. Seclusion or restraint are last resorts when less restrictive measures fail.","E"],
[77,"You are planning to train newly employed staff who are working in the labor ward on better maternal service and midwifery performance. Which of the following approach will you consider to meet the need for individual learning?",["Plan job allocation to favor all staff to attend the session","Identify representative to attend the training","Set time to conduct the session","Ask staff not to attend the session"],"A","Adjusting the duty roster so every new employee can attend ensures each individual's learning need is met without leaving the ward unsafe. Sending only a representative leaves others untrained.","F"],
[78,"You are teaching student nurses on wound dressing. Which appropriate technique will you instruct to follow when caring for a wound in order to reduce patient discomfort during dressing?",["Use long forceps to pull out the gauze and pad the area","Gently remove the tape and cleanse the wound","Press down to remove the top tape","Press inward to drain the wound and pad with soiled gauze"],"B","Removing tape gently, along the skin and toward the wound, avoids pain and skin injury. Then clean from the cleanest area outward using aseptic technique. Soiled gauze must never be reused.","A"],
[79,"A depressed patient expressed to you that \"I am finally cured.\" You interpret this statement as a hint to modify the treatment. Which of the following nursing interventions will you carry as a treatment plan?",["Refer patient to social worker","Reduce dose of antidepressants","Make preparations for patient to get discharged","Increase the level of suicide precautions"],"D","A sudden claim of being cured in a depressed patient may mean he has decided to end his life and feels relieved. This is a warning sign, so supervision and suicide precautions are increased.","E"],
[80,"During the department staff meeting, one of your junior staff asked you to clarify more on the channels of communication that are commonly utilized to inform clients and staff about hospital functions. Which of the following will you use to provide appropriate instructions?",["Hospital organization policy","Hospital organization schedule","Hospital organization structure","Hospital billboards"],"A","The key marks the organization policy, the formal document that states rules and the official channels through which instructions and information flow to staff and clients. A structure only shows levels of authority.","F"],
[81,"You are a community psychiatric nurse addressing health promotion activities across the wellness domain that may reduce the incidence of childhood psychopathology. Which most appropriate area will you focus?",["Childhood care","Parenting care","Adolescent care","Prenatal care"],"B","The family environment strongly shapes a child's emotional and behavioural development. Parenting education on bonding, discipline and nurturing is the key preventive area for childhood psychopathology, according to the key.","E"],
[82,"You are working as a community nurse in an urban area where community members have diverse cultures. Which of the following practices would be culturally relevant in psychiatric nursing?",["Understanding all self-structures, world views, and explanatory models","Seeking clarification of the client's health-related beliefs about illness","Recognizing individual variation among group members","Working within the cultural context of the client"],"D","Culturally competent psychiatric care fits assessment and treatment into the client's own cultural context. One nurse cannot know every culture, and individuals within a group also vary.","E"],
[83,"You are a Nurse Manager of the Medical ward department where you are responsible for handling all staff personal records. Which of the following considerations will you take to keep the records of your staff correspondence?",["Treat all correspondence as confidential","Ask the hospital administrator to keep all correspondence","Communicate all correspondence with your senior staff","Type all correspondence in the computer and put a password"],"A","Personnel records contain private information. Treating them as confidential, with restricted access, protects staff rights and trust, in line with the principles of record management.","F"],
[84,"You are coordinating mental health services at the regional level. You are obliged to provide advice on care for patients with mental health conditions attended to at the hospital. Which of the following combined approaches will you use to identify symptoms present in specific mental disorders?",["Nursing interventions classification","North America Nursing Diagnosis Association","Nursing outcomes classification","Diagnosis Statistical Manual (DSM-5) classification"],"D","DSM-5 lists the diagnostic criteria and symptoms of mental disorders. NANDA, NIC and NOC classify nursing diagnoses, interventions and outcomes, not medical psychiatric diagnoses.","E"],
[85,"You are caring for a patient who has episodes of school absenteeism, withdrawal from friends, and bizarre behavior. What will be your nursing intervention for this patient?",["Acknowledge that the patient's perception seems real to him","Encourage the patient to express his/her thoughts","Ignore the patient's bizarre behaviors","Inform the patient that his perceptions of reality have become distorted"],"A","Perceptions in psychosis feel completely real to the patient. Acknowledging that without agreeing builds trust. Arguing or announcing that he is unwell increases distress.","E"],
[86,"You are caring for a primigravida woman at 38 weeks + 4 days of gestation with a confirmed pregnancy of hydatidiform mole, and she is being considered for termination. Which of the following interventions should you undertake to address opinions and potential conflicts or dilemmas?",["Gather information regarding the clinical, social, and spiritual aspects of the dilemma","Ensure that the order has written support for the procedure","Consult a professional ethicist to ensure that the steps of the process are observed","List the ethical principles that inform the dilemma to the woman"],"A","The first step in ethical decision-making is to collect all relevant facts: clinical condition, social situation and the woman's values and beliefs. Options are then analysed and decided together. (The gestation given is unusual for a mole.)","D"],
[87,"Working as a Departmental Nurse Manager, you identified that one of your ward in-charges is very committed, generous, confident, capable of communicating effectively, and always involves other staff members' ideas and opinions in decision-making. Which of the following styles of management does this leader employ?",["Benevolent-authoritative","Exploitive-authoritative","Consultative","Participative"],"D","In Likert's system, the participative style involves staff in decisions, with open two-way communication and trust. Consultative managers ask for opinions but keep the final decision on their own.","F"],
[88,"Which of the following instructions would you include in your lesson plan to teach a group of inpatients receiving lithium medication at a mental health clinic for mood stabilization?",["Discontinuing the drug if weight gain is noticed","The importance of monitoring potassium intake","Dietary teaching to restrict daily sodium intake","Periodic monitoring of renal and thyroid function"],"D","Lithium is cleared by the kidneys and can cause hypothyroidism and kidney damage, so renal and thyroid function and serum lithium levels are monitored. Sodium must stay normal because sodium restriction raises lithium toxicity.","E"],
[89,"Which of the following management styles will you employ to ensure the organization culture has positive stewardship to quality of services to customers, including staff welfare?",["Country club management","Team management","Organizational management","Authority-obedience management"],"B","In the Blake and Mouton grid, team management (9,9) combines high concern for production and for people, achieving quality service and staff welfare through commitment and participation.","F"],
[90,"At your unit, patient satisfaction has dropped to 60%, and staff morale is negatively demonstrated with burnout spirit. Which of the following is the best action to resolve this situation?",["Call for a staff meeting to address the situation","Let the staff ventilate her feelings and ask how she can be of help","Develop a strategic action plan to deal with the concerns","Ignore the issues since these will resolve naturally"],"C","A planned, systematic approach with set objectives, activities, responsibilities and time frames resolves both patient dissatisfaction and staff burnout. Ignoring problems makes them worse.","F"],
[91,"You have performed an assessment on a patient with schizophrenia and found him to be suspicious, lacking trust, jealous, experiencing hallucinations, and argumentative. Which of the following will be your nursing diagnosis for this patient?",["Self-care deficit related to persistent violent behavior","Impaired communication related to perceptual deficit","Altered thinking process related to perceptual disturbances","Noncompliance to treatment related to increased risk of relapse"],"C","Suspiciousness, jealousy and hallucinations show disturbed thinking and perception, so altered thought processes related to perceptual disturbances matches the data. The other diagnoses are not supported by the findings.","E"],
[92,"You are the Nurse Manager in a hospital where you are responsible for developing careers and improving the professional performance of individuals for quality practice. Which of the following approaches will you use to initiate a facility career development program?",["Create a clear structure for career path","Develop a plan for a continuous professional development program","Allow employees to self-seek for advancement ladder","Advertise on the organization board"],"A","A career development programme begins with a clear career path structure showing the levels, requirements and routes of advancement. Training plans and individual development are then built on it.","F"],
[93,"You are working as a community mental health nurse in a village where there is a patient with severe mental illness. Which of the following will be your cornerstone of treatment for a severely mentally ill patient within the community?",["Intense psychotherapy","Compliance with the medication regime","Interval care to ease family burden","Referrals to numerous community resources"],"B","In severe mental illness such as schizophrenia, continued medication prevents relapse and is the foundation of community treatment. Psychosocial support, respite and referrals add to it but do not replace it.","E"],
[94,"You were invited to be the resource person in a training class for food handlers. Which of the following would you emphasize regarding the prevention of staphylococcal food poisoning?",["Thorough washing of all cooking and eating utensils","Proper hand washing during food preparation","Stool examination for food handlers and food servers","Proper cooking of food, especially vegetables"],"B","Staphylococcus aureus lives on skin, nose and infected wounds of food handlers and produces a heat-stable toxin. Hand washing and avoiding contamination during preparation are the key control, because cooking does not destroy the toxin.","C"],
[95,"You are working in a dispensary far located in a peripheral village. While reviewing the weekly report, you noted that there is an increase in upper respiratory disease cases. Which of the following will be your immediate function regarding this occurrence?",["Conducting assessment of suspected cases to detect the communicable diseases","Participating in the investigation to determine the source of the epidemic","Monitoring the condition of the cases affected by the communicable disease","Teaching the community on preventive measures against the disease"],"B","A rise above the usual number of cases may be the start of an outbreak. The immediate step is to take part in investigating to confirm it and find the source so control measures can start. Health education follows.","C"],
[96,"You are planning to improve the delivery of services in your health facility by minimizing time wasters. Which of the following situations will you insist on being observed as an external time waster during the staff meeting?",["Attending the meeting","Charting on a mobile phone","Later lunchtime","Searching for information from the website"],"B","External time wasters come from outside the individual, such as interruptions and distractions. According to the key, charting on a mobile phone during a meeting diverts attention from the discussion and wastes time.","F"],
[97,"As the Nurse In-charge of Toka Health Center, you observed that nurses have the freedom to do what they think is right for patients, subordinates, and students with little or no control at all. Which action will you take to correct this situation?",["Discuss with all unit in-charges to ensure facility protocols and behavior are adhered to","Transfer some of the staff to other departments","Remind all staff in written form of their responsibilities","Report to higher authority for disciplinary actions"],"A","This is a laissez-faire problem of weak control. The first corrective step is to involve the unit in-charges so protocols and expected behaviour are followed and supervised. Transfers or disciplinary reports are not the first step.","F"],
[98,"You are planning to give initial care for Mrs. Ory, who has an acute schizophrenic illness. Which of the following actions will you include in your care?",["Assigning the same staff members to work with the client each day.","Encouraging the client to enter into simple group activities.","Providing a variety of activities to keep the client focused on reality-based topics.","Establishing a daily routine to promote orientation to the unit."],"D","A predictable daily routine reduces confusion and anxiety and helps the acutely ill patient orient to the unit. Consistent staff (A) also builds trust, but group activities and varied stimulation overwhelm an acutely psychotic patient.","E"],
[99,"You have been invited to attend a Regional Health Committee meeting where one of the agenda items is to discuss a case of maternal death reported to be caused by midwives' negligence at one of the health centers under your supervision. Which of the following leadership roles will you play in this situation?",["Write a defensive statement on the occurrence.","Testify that you are legally appointed to submit a report to the Council office in case of any misconduct.","Investigate the charges against the offended midwives to explore the situation.","Conduct supportive supervision to subordinates to ensure quality service."],"C","As the supervisor, you must establish the facts before judging. Investigating the charges, reviewing records and hearing the midwives gives a fair, evidence-based account to the committee. Defensive statements or early conclusions are not appropriate.","F"],
[100,"You are working in a busy labor ward with limited human resources to effectively execute the ward functions. Which of the following considerations will you keep in mind during staff job allocation?",["The right task, the right circumstances, the right person, the right competency, and the right supervision or feedback.","The right competency, the right education and training, the right scope of practice, the right environment, and the right client condition.","The right competency, the right person, the right scope of practice, the right environment, and the right client condition.","The right task, the right circumstances, the right person, the right direction or communication, and the right supervision or feedback."],"D","The five rights of delegation are the right task, right circumstances, right person, right direction or communication, and right supervision or evaluation. Note: the source key lists A, but A replaces direction or communication with competency and does not match the standard five rights.","F"]
];
Q.sort((a,b)=>a[0]-b[0]);
const secOf=n=>S.find(s=>s[0]===(Q.find(q=>q[0]===n)||[])[5]);
const st={a:{},f:new Set(),i:0,sec:null,done:false};
const K="tnmcle2020_v1";
function save(){try{localStorage.setItem(K,JSON.stringify({a:Object.fromEntries(Object.entries(st.a).map(([i,v])=>[Q[i][0],v])),f:[...st.f].map(i=>Q[i][0]),n:Q[st.i][0],done:st.done}))}catch(e){}}
try{const d=JSON.parse(localStorage.getItem(K)||"null");if(d){const ix=n=>Q.findIndex(q=>q[0]==n);for(const[n,v]of Object.entries(d.a||{})){const j=ix(n);if(j>=0)st.a[j]=v}for(const n of d.f||[]){const j=ix(n);if(j>=0)st.f.add(j)}const j=ix(d.n);if(j>=0)st.i=j;st.done=!!d.done}}catch(e){}
function resetAll(){try{localStorage.removeItem(K)}catch(e){}location.reload()}
const $=id=>document.getElementById(id);
function side(){save(); $("secs").innerHTML='<div class="mu" style="margin-bottom:6px">Sections</div>'+S.map(s=>{const k=Q.filter(q=>secOf(q[0])===s).length;return `<button class="sec ${st.sec===s[0]?'on':''}" onclick="goSec('${s[0]}')" ${k?'':'disabled'}>${s[0]}: ${s[1]} <span class="mu">(${k?k+' loaded':'not loaded'})</span></button>`}).join("")+`<button class="sec ${st.sec===null?'on':''}" onclick="goSec(null)">All questions</button>`;
 $("grid").innerHTML=Q.map((q,i)=>{let c=[];if(st.done){c.push(st.a[i]===undefined?'':st.a[i]===q[3]?'c':'w')}else if(st.a[i]!==undefined)c.push('ans');if(st.f.has(i))c.push('flg');if(i===st.i)c.push('cur');return `<button class="${c.join(' ')}" onclick="go(${i})">${q[0]}</button>`}).join("");
 const n=Object.keys(st.a).length;$("pb").style.width=n/Q.length*100+"%";$("cnt").textContent=`${n} / ${Q.length} answered`}
function goSec(l){st.sec=l;if(l){const i=Q.findIndex(q=>secOf(q[0])[0]===l);if(i>=0)st.i=i}render()}
function go(i){st.i=i;st.sec=secOf(Q[i][0])[0];if(st.done&&view==="review")return render();view=st.done?"review":"exam";render()}
let view="exam",rf="all";
function opts(i,rev){const q=Q[i];return q[2].map((t,k)=>{const L="ABCD"[k];let c="opt";if(rev){if(L===q[3])c+=" ok";else if(st.a[i]===L)c+=" bad";}else if(st.a[i]===L)c+=" sel";return `<div class="${c}" ${rev?'':`onclick="pick(${i},'${L}')"`}><b>${L}.</b><span>${t}${rev&&L===q[3]?' ✓':''}${rev&&st.a[i]===L&&L!==q[3]?' ✗ (your answer)':''}</span></div>`}).join("")}
function pick(i,L){st.a[i]=L;render()}
function flag(i){st.f.has(i)?st.f.delete(i):st.f.add(i);render()}
function render(){side();if(view==="result")return;const m=$("m");
 if(view==="review"){m.innerHTML=`<div class="row" style="margin-bottom:10px">${[["all","All"],["wrong","Wrong"],["none","Unanswered"],["flag","Flagged"]].map(([k,l])=>`<button class="${rf===k?'p':''}" onclick="rf='${k}';render()">${l}</button>`).join("")}</div>`+Q.map((q,i)=>{const ok=st.a[i]===q[3];if(rf==="wrong"&&(ok||st.a[i]===undefined))return"";if(rf==="none"&&st.a[i]!==undefined)return"";if(rf==="flag"&&!st.f.has(i))return"";return `<div class="card"><div class="mu">Q${q[0]} · Section ${secOf(q[0])[0]} · ${st.a[i]===undefined?'Unanswered':ok?'Correct':'Incorrect'}</div><div class="q">${q[1]}</div>${opts(i,true)}<div class="rat"><b>Correct answer: ${q[3]}.</b> ${q[4]}</div></div>`}).join("")+`<div class="row"><button onclick="showRes()">Back to results</button></div>`;return}
 const i=st.i,q=Q[i],list=Q.map((x,k)=>k).filter(k=>!st.sec||secOf(Q[k][0])[0]===st.sec),p=list.indexOf(i);
 m.innerHTML=`<div class="card"><div class="row"><span class="mu" style="flex:1">Question ${q[0]} of 100 · Section ${secOf(q[0])[0]}: ${secOf(q[0])[1]}</span><button onclick="flag(${i})">${st.f.has(i)?'⚑ Flagged':'⚐ Flag for review'}</button></div><p class="q">${q[1]}</p>${opts(i,false)}<div class="row" style="margin-top:10px"><button onclick="go(${list[p-1]})" ${p<=0?'disabled':''}>← Previous</button><button class="p" onclick="go(${list[p+1]})" ${p>=list.length-1?'disabled':''}>Next →</button></div></div><div class="mu">Flagged: ${[...st.f].map(k=>'Q'+Q[k][0]).join(', ')||'none'}</div>`}
function stats(){return S.map(s=>{const qs=Q.map((q,i)=>i).filter(i=>secOf(Q[i][0])===s);const c=qs.filter(i=>st.a[i]===Q[i][3]).length;return{s,n:qs.length,c,pct:qs.length?c/qs.length*100:null}})}
const TIPS={A:"Drill the nursing process phases, ABC prioritization, fluid/IV calculations and first-aid triage; practise ‘first action’ questions.",B:"Revise pre/post-operative care, shock, renal, cardiac and respiratory conditions; link each sign to its pathophysiology and priority nursing diagnosis.",C:"Study outbreak investigation steps, IMCI classifications, immunization targets, epidemiology formulas (median, fatality rate) and community assessment sequence.",D:"Rehearse the partograph, third-stage management, PPH, obstetric emergencies, newborn care and PMTCT/family planning protocols.",E:"Review mental status exam terminology, therapeutic communication, delusion types and safety interventions for psychiatric emergencies.",F:"Learn leadership styles, communication directions, delegation rules, supervision tools, budgets and conflict-resolution modes."};
function showRes(){view="result";const r=stats(),tot=Q.length,sc=Q.filter((q,i)=>st.a[i]===q[3]).length/2,max=tot/2;
 $("m").innerHTML=`<div class="card"><div class="mu">Final score (${tot} loaded questions × 0.5 mark)</div><div class="big">${sc} / ${max} Marks</div><div>${(sc/max*100).toFixed(1)}%</div></div>
 <div class="card"><b>Section breakdown</b><table><tr><th>Section</th><th>Correct</th><th>Marks</th><th>%</th></tr>${r.map(x=>x.n?`<tr><td>${x.s[0]}: ${x.s[1]}</td><td>${x.c}/${x.n}</td><td>${x.c/2}/${x.n/2}</td><td class="${x.pct<50?'lo':''}">${x.pct.toFixed(0)}%</td></tr>`:`<tr><td>${x.s[0]}: ${x.s[1]}</td><td colspan="3" class="mu">No questions loaded</td></tr>`).join("")}</table></div>
 <div class="card"><b>Recommendations Report</b>${(()=>{const w=r.filter(x=>x.n&&x.pct<50);return(w.length?w.map(x=>`<p><b class="lo">${x.s[1]} (${x.pct.toFixed(0)}%)</b><br>${TIPS[x.s[0]]} Re-attempt the missed items in Review Mode and write a one-line rule for each.</p>`).join(""):`<p>No section is below 50%. Keep sharpening with timed practice (about 1 minute per question) and re-read rationales for every miss.</p>`)+`<p class="mu">General: flagged questions (${st.f.size}) show where confidence is low; revisit those first.</p>`})()}</div>
 <div class="row"><button class="p" onclick="view='review';render()">Open Review Mode</button><button onclick="resetAll()">Restart exam</button></div>`}
function doSubmit(){st.done=true;$("sub").textContent="View Results";showRes();side()}
$("sub").onclick=()=>{const n=Object.keys(st.a).length;if(st.done)return showRes();view="confirm";side();$("m").innerHTML=`<div class="card"><b>Submit exam?</b><p>You have answered ${n} of ${Q.length} questions. You cannot change answers after submitting.</p><div class="row"><button class="p" onclick="doSubmit()">Yes, submit</button><button onclick="view='exam';render()">Cancel</button></div></div>`};
if(st.done){$("sub").textContent="View Results";side();showRes()}else render();
</script></body></html>
