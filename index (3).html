<script>
const NOTES=[{"t": "🚨 EMERGENCY / PRIORITY CARE — NURSING REVISION NOTES", "m": "# 🚨 EMERGENCY / PRIORITY CARE — NURSING REVISION NOTES\n\n## 1. ABCs — PRIMARY SURVEY\n\nKatika emergency, ABCs hutumika kutambua na kutibu matatizo yanayotishia maisha.\n\n### A — Airway\n\nAngalia kama airway iko wazi.\n\nSigns of airway obstruction:\n\n- Gasping\n\n- Stridor\n\n- Choking\n\n- Inability to speak\n\n- Cyanosis\n\nNursing actions:\n\n- Open airway.\n\n- Remove visible obstruction if safe.\n\n- Suction secretions when indicated.\n\n- Use appropriate airway adjunct.\n\n- Prepare for advanced airway management if required.\n\n### B — Breathing\n\nAssess:\n\n- Respiratory rate\n\n- Depth\n\n- Chest movement\n\n- Oxygen saturation\n\n- Breath sounds\n\n- Signs of respiratory distress\n\nSigns of respiratory distress:\n\n- Severe dyspnea\n\n- Cyanosis\n\n- Use of accessory muscles\n\n- Low SpO₂\n\n- Altered consciousness\n\n### C — Circulation\n\nAssess:\n\n- Pulse\n\n- Blood pressure\n\n- Capillary refill\n\n- Skin colour/temperature\n\n- External bleeding\n\nImmediate actions:\n\n- Control severe bleeding.\n\n- Establish IV access when indicated.\n\n- Give appropriate fluids/blood products according to protocol.\n\n- Monitor vital signs.\n\n### ⭐ Priority\n\nAirway → Breathing → Circulation\n\nLakini massive external bleeding inayotishia maisha inapaswa kudhibitiwa immediately.\n\n# 2. CPR — CARDIOPULMONARY RESUSCITATION\n\nCPR hufanyika kwa mtu ambaye:\n\n- Hana normal breathing, au anagasping\n\n- Hana signs of circulation/has no pulse when pulse assessment is appropriate for the rescuer\n\n### Adult Basic Life Support\n\nSequence:\n\n- Ensure scene safety.\n\n- Check responsiveness.\n\n- Call for help/activate emergency response.\n\n- Get AED if available.\n\n- Check breathing and pulse.\n\n- Begin chest compressions if indicated.\n\n### Chest compressions — Adult\n\n- Rate: 100–120/min\n\n- Depth: at least 5 cm, avoiding excessive depth\n\n- Allow complete chest recoil.\n\n- Minimize interruptions.\n\nCompression : ventilation = 30 : 2\n\n### AED\n\n- Apply AED as soon as available.\n\n- Follow its voice/visual prompts.\n\n- Ensure nobody is touching the patient during analysis/shock.\n\n## 👶 CPR — CHILD & INFANT\n\n### Important differences\n\nChild:\n\n- Compression depth ≈ 5 cm or about 1/3 of chest depth.\n\nInfant:\n\n- Compression depth ≈ 4 cm or about 1/3 of chest depth.\n\nRate remains:\n\n100–120 compressions/min\n\nFor two trained rescuers, pediatric CPR commonly uses:\n\n15 : 2\n\nFor a single rescuer:\n\n30 : 2\n\n### ⚠️ Exam point\n\nFor children/infants, early recognition and rapid activation of emergency help are very important, particularly when the arrest is caused by respiratory failure.\n\n# 3. SHOCK\n\nShock = inadequate tissue perfusion leading to inadequate oxygen delivery to cells.\n\n### Signs of shock\n\n- Hypotension\n\n- Tachycardia\n\n- Weak/thready pulse\n\n- Cold, clammy skin\n\n- Pallor\n\n- Rapid breathing\n\n- Reduced urine output\n\n- Restlessness/anxiety\n\n- Altered level of consciousness\n\n## Types of Shock\n\n### A. Hypovolemic shock\n\nCause:\n\n- Hemorrhage\n\n- Severe dehydration\n\n- Burns\n\n- Fluid loss\n\nManagement priorities:\n\n- Control bleeding.\n\n- Oxygen/support breathing as needed.\n\n- IV access.\n\n- Fluid/blood replacement according to clinical protocol.\n\n- Monitor vital signs and urine output.\n\n### B. Cardiogenic shock\n\nCause:\n\n- Severe myocardial infarction\n\n- Severe heart failure\n\n- Major cardiac dysfunction\n\nKey feature: Heart cannot pump enough blood to maintain tissue perfusion.\n\n### C. Septic shock\n\nAssociated with severe infection and circulatory dysfunction.\n\nSigns may include:\n\n- Fever or hypothermia\n\n- Tachycardia\n\n- Tachypnea\n\n- Hypotension\n\n- Altered mental status\n\nPriority: rapid recognition, infection management, fluids/vasopressors as clinically indicated.\n\n### D. Anaphylactic shock\n\nCaused by severe allergic reaction.\n\nCommon triggers:\n\n- Drugs\n\n- Foods\n\n- Insect stings\n\n- Latex\n\nPriority treatment: IM EPINEPHRINE (ADRENALINE).\n\n### E. Neurogenic shock\n\nCan occur following spinal cord injury, especially high spinal injury.\n\nMay present with:\n\n- Hypotension\n\n- Bradycardia\n\n- Warm/dry skin\n\n# 4. ANAPHYLAXIS\n\nAnaphylaxis is a life-threatening systemic allergic reaction.\n\n### Signs\n\n- Difficulty breathing\n\n- Wheezing/stridor\n\n- Swelling of lips/tongue/throat\n\n- Urticaria\n\n- Hypotension\n\n- Tachycardia\n\n- Dizziness/collapse\n\n- GI symptoms may occur\n\n### 🚨 Priority treatment\n\nIM adrenaline/epinephrine is first-line treatment.\n\nUsually administered into the anterolateral thigh according to emergency protocol.\n\n### Nursing priorities\n\n- Call for emergency help.\n\n- Give IM adrenaline immediately when anaphylaxis is suspected.\n\n- Maintain airway.\n\n- Give oxygen as indicated.\n\n- Establish IV access.\n\n- Give IV fluids if hypotensive.\n\n- Monitor BP, pulse, respiration and SpO₂.\n\n- Repeat adrenaline according to protocol if symptoms persist.\n\n### 👶 Children\n\nAdrenaline dose is weight-based, so do not use the adult dose automatically.\n\n### ⭐ EXAM\n\nIf options are:\n\nA. Hydrocortisone\nB. Salbutamol\nC. Adrenaline\nD. Antihistamine\n\nAnswer: C. Adrenaline\n\n# 5. TRAUMA\n\n## Primary Survey\n\nUse:\n\nABCDE\n\n### A — Airway + cervical spine protection\n\nEnsure airway is open while protecting the cervical spine when spinal injury is suspected.\n\n### B — Breathing\n\nAssess:\n\n- Respiratory rate\n\n- Chest movement\n\n- Breath sounds\n\n- SpO₂\n\nLook for:\n\n- Open chest wound\n\n- Tension pneumothorax\n\n- Flail chest\n\n### C — Circulation\n\n- Control bleeding.\n\n- Check pulse/BP.\n\n- Establish IV/IO access when required.\n\n- Assess for shock.\n\n### D — Disability\n\nAssess neurological status:\n\n- AVPU\n\n- GCS\n\n- Pupils\n\n- Blood glucose when indicated\n\nAVPU:\n\n- A — Alert\n\n- V — responds to Voice\n\n- P — responds to Pain\n\n- U — Unresponsive\n\n### E — Exposure\n\nExpose patient enough to identify injuries while preventing hypothermia.\n\n# 6. BURNS 🔥\n\n## Classification by depth\n\n### Superficial\n\n- Red\n\n- Painful\n\n- No blisters usually\n\n- Affects epidermis\n\n### Partial-thickness\n\n- Blisters\n\n- Moist\n\n- Very painful\n\n- Involves deeper skin layers\n\n### Full-thickness\n\n- May appear white, brown or charred\n\n- Dry/leathery\n\n- Sensation may be reduced/absent because nerves are destroyed.\n\n## First Aid for Burns\n\n### Do:\n\n- Stop the burning process.\n\n- Cool the burn with cool running water for about 20 minutes when appropriate.\n\n- Remove jewellery/tight items early if not stuck.\n\n- Cover with a clean/non-adherent dressing or clean cloth.\n\n- Assess airway in facial/inhalation burns.\n\n### Don't:\n\n❌ Apply ice directly\n❌ Apply toothpaste\n❌ Apply butter/oil\n❌ Break blisters unnecessarily\n❌ Remove clothing stuck to the burn\n\n## Rule of Nines — Adult\n\nApproximate percentages:\n\n- Head and neck = 9%\n\n- Each arm = 9%\n\n- Anterior trunk = 18%\n\n- Posterior trunk = 18%\n\n- Each leg = 18%\n\n- Perineum = 1%\n\n### 👶 Children\n\nDo not rely on the adult Rule of Nines because children's body proportions differ.\n\nLund and Browder chart is more accurate for children.\n\n### ⭐ Major burn emergencies\n\nPay special attention to:\n\n- Airway/inhalation injury\n\n- Large TBSA burns\n\n- Electrical burns\n\n- Chemical burns\n\n- Burns involving face, hands, feet, genitalia or major joints\n\n# 7. TRIAGE\n\nTriage = sorting patients according to urgency and priority of treatment, especially when resources are limited.\n\n### Common colour system\n\n🔴 RED — Immediate\n\n- Life-threatening\n\n- Requires immediate treatment\n\nExamples:\n\n- Severe airway obstruction\n\n- Severe respiratory distress\n\n- Major uncontrolled bleeding\n\n- Shock\n\n🟡 YELLOW — Urgent\n\n- Serious but can wait briefly.\n\n🟢 GREEN — Minor\n\n- Walking wounded\n\n- Minor injuries\n\n⚫ BLACK — Dead/expectant\n\n- Dead or injuries incompatible with survival in mass-casualty settings, depending on the triage system used.\n\n### ⭐ Important\n\nTriage is based on urgency, not simply \"who arrived first.\"\n\n# 8. POISONING ☠️\n\nPossible routes:\n\n- Ingestion\n\n- Inhalation\n\n- Injection\n\n- Skin exposure\n\n- Eye exposure\n\n### Priority\n\nABCs first.\n\n### Nursing actions\n\n- Ensure scene safety.\n\n- Remove patient from exposure if safe.\n\n- Assess ABCs.\n\n- Identify substance if possible.\n\n- Determine amount/time of exposure.\n\n- Monitor vital signs.\n\n- Contact appropriate poison/emergency service according to local protocol.\n\n- Give specific antidote if indicated and prescribed/protocol-directed.\n\n### ❌ DO NOT routinely induce vomiting\n\nEspecially avoid inducing vomiting when the substance may be:\n\n- Corrosive\n\n- Hydrocarbon/petroleum-based\n\n- Or when the patient has reduced consciousness.\n\n### Examples of antidotes\n\n| **Poison** | **Antidote** |\n| --- | --- |\n| Opioids | Naloxone |\n| Organophosphates | Atropine + oxime therapy according to protocol |\n| Paracetamol/Acetaminophen | N-acetylcysteine |\n| Benzodiazepines | Flumazenil in selected situations |\n| Some toxic alcohols | Fomepizole |\n\nAntidote does not replace ABC stabilization.\n\n# 9. METHODS OF BLEEDING CONTROL 🩸\n\n## A. Direct pressure\n\nFirst-line method for most external bleeding.\n\n- Apply firm, continuous pressure using gauze/clean cloth.\n\n- Do not repeatedly lift the dressing to check.\n\n- Add more dressing on top if blood soaks through.\n\n## B. Pressure dressing\n\nUsed to maintain pressure after bleeding is controlled.\n\n## C. Tourniquet\n\nUsed for life-threatening limb bleeding when direct pressure is ineffective or impractical.\n\nImportant:\n\n- Place appropriately above the wound.\n\n- Tighten until bleeding stops.\n\n- Note/document application time.\n\n- Do not loosen periodically.\n\n## D. Wound packing\n\nUseful for some deep wounds, especially junctional areas where a tourniquet cannot be applied.\n\n## E. Elevation\n\nElevation may assist with some bleeding, but should not replace direct pressure for major hemorrhage.\n\n# 🔥 HIGH-YIELD EXAM POINTS\n\n- Emergency priority → ABCDE\n\n- Anaphylaxis → IM adrenaline first-line\n\n- Adult CPR → 100–120 compressions/min\n\n- Adult compression depth → at least 5 cm\n\n- CPR ratio → 30:2\n\n- Two-rescuer child/infant CPR → 15:2\n\n- Shock → inadequate tissue perfusion\n\n- Hypovolemic shock → fluid/blood loss\n\n- Neurogenic shock → hypotension + bradycardia\n\n- Severe external bleeding → direct pressure / tourniquet when indicated\n\n- Do not routinely induce vomiting in poisoning\n\n- Burns → cool running water; don't use ice\n\n- Adult Rule of Nines → head 9%, each arm 9%, each leg 18%\n\n- Child TBSA → Lund-Browder is more accurate\n\n- Triage RED → immediate treatment\n\n- Trauma → protect cervical spine if spinal injury suspected\n\n- D in ABCDE → Disability\n\n- E → Exposure while preventing hypothermia"}, {"t": "🦠 INFECTION & IMMUNITY — NURSING REVISION NOTES", "m": "# 🦠 INFECTION & IMMUNITY — NURSING REVISION NOTES\n\n## 1. SEPSIS 🚨\n\n### Definition\n\nSepsis ni life-threatening organ dysfunction inayotokana na mwitikio usio wa kawaida wa mwili dhidi ya infection.\n\nInfection → dysregulated response → organ dysfunction\n\n### Common causes\n\n- Bacterial infections\n\n- Pneumonia\n\n- UTI\n\n- Abdominal infections\n\n- Wound/skin infections\n\n- Meningitis\n\n### Signs & symptoms\n\n- Fever au hypothermia\n\n- Tachycardia\n\n- Tachypnea\n\n- Altered mental status\n\n- Hypotension\n\n- Reduced urine output\n\n- Cold/clammy skin\n\n- Low oxygen saturation\n\n- Poor peripheral perfusion\n\n### Nursing priorities\n\nABCDE first.\n\n- Assess vital signs frequently.\n\n- Give oxygen if indicated.\n\n- Establish IV access.\n\n- Take cultures as ordered, ideally before antibiotics when this does not delay treatment.\n\n- Administer prescribed broad-spectrum antibiotics promptly.\n\n- Give IV fluids when indicated.\n\n- Monitor urine output.\n\n- Monitor lactate and other investigations as ordered.\n\n- Identify and control the source of infection.\n\n### Septic shock\n\nNi severe form of sepsis yenye persistent circulatory failure/hypotension despite adequate fluid resuscitation, requiring vasopressors to maintain adequate perfusion.\n\n### ⭐ Exam\n\nPatient mwenye infection + hypotension + altered consciousness + tachypnea:\n\nThink SEPSIS and act urgently.\n\n# 2. HIV/AIDS\n\n### HIV\n\nHuman Immunodeficiency Virus hushambulia immune system, hasa CD4 T lymphocytes.\n\n### AIDS\n\nAcquired Immunodeficiency Syndrome ni advanced stage of HIV infection yenye severe immune suppression na/or certain opportunistic illnesses.\n\n### Transmission\n\nHIV inaweza kuambukizwa kupitia:\n\n- Unprotected sexual contact\n\n- Infected blood\n\n- Sharing contaminated needles/sharps\n\n- Mother-to-child transmission during pregnancy, delivery or breastfeeding\n\n### HIV does NOT spread through:\n\n❌ Hugging\n❌ Handshake\n❌ Sharing food/utensils\n❌ Mosquito bites\n❌ Casual contact\n❌ Sharing toilets\n\n## HIV Clinical Features\n\n### Early/acute infection\n\nInaweza kuwa na:\n\n- Fever\n\n- Sore throat\n\n- Rash\n\n- Lymphadenopathy\n\n- Fatigue\n\n### Chronic infection\n\nMtu anaweza kuwa asymptomatic kwa muda mrefu.\n\n### Advanced disease\n\n- Weight loss\n\n- Persistent fever\n\n- Chronic diarrhea\n\n- Recurrent infections\n\n- Opportunistic infections\n\n- Certain cancers\n\n## HIV Diagnosis\n\nTesting may involve:\n\n- HIV antigen/antibody tests\n\n- Antibody tests\n\n- Nucleic acid tests in selected situations\n\n### CD4\n\nCD4 count hutumika kutathmini degree ya immune suppression na kusaidia clinical management.\n\n### Viral load\n\nHupima kiwango cha HIV kwenye damu na hutumika sana kufuatilia response to ART.\n\n# 💊 HIV MANAGEMENT\n\n### ART — Antiretroviral Therapy\n\nART:\n\n- Hupunguza viral load.\n\n- Husaidia kuongeza/kuhifadhi CD4.\n\n- Hupunguza morbidity and mortality.\n\n- Hupunguza risk ya transmission wakati viral load ikiwa suppressed.\n\n### Nursing responsibilities\n\n- Encourage adherence.\n\n- Monitor side effects.\n\n- Monitor clinical response.\n\n- Provide counselling.\n\n- Encourage safe sex.\n\n- Screen/manage opportunistic infections.\n\n- Support nutrition.\n\n- Maintain confidentiality.\n\n### ⭐ Important\n\nHIV haina cure ya kuondoa virus kabisa kwa sasa, lakini ART inaweza ku-control HIV effectively.\n\n# 3. TUBERCULOSIS — TB\n\nTB husababishwa na:\n\nMycobacterium tuberculosis\n\nMara nyingi huathiri lungs, lakini inaweza kuathiri organs nyingine.\n\n### Transmission\n\nTB ya pulmonary inayoweza kuambukiza huenea kupitia airborne particles wakati mtu mwenye TB anayeambukiza:\n\n- Anakohoa\n\n- Anapiga chafya\n\n- Anaongea\n\n### Risk factors\n\n- HIV\n\n- Malnutrition\n\n- Diabetes\n\n- Close contact with infectious TB\n\n- Crowded living conditions\n\n- Immunosuppression\n\n## Symptoms of Pulmonary TB\n\nClassic symptoms:\n\n- Cough lasting 2 weeks or more\n\n- Fever\n\n- Night sweats\n\n- Weight loss\n\n- Loss of appetite\n\n- Fatigue\n\n- Chest pain\n\n- Hemoptysis\n\n### ⭐ Exam clue\n\nChronic cough + weight loss + night sweats = suspect TB.\n\n## TB Diagnosis\n\nDepending on available guidelines/resources:\n\n- Sputum molecular testing such as Xpert MTB/RIF or Xpert Ultra\n\n- Sputum microscopy\n\n- Chest X-ray\n\n- Culture and drug susceptibility testing\n\n### Important\n\nA positive TB test does not automatically mean the patient has active pulmonary TB; clinical assessment is required.\n\n# TB TREATMENT\n\nDrug-susceptible TB commonly requires multiple anti-TB drugs.\n\nA standard regimen often includes:\n\n2 months:\n\nHRZE\n\nThen:\n\n4 months:\n\nHR\n\nWhere:\n\n- H = Isoniazid\n\n- R = Rifampicin\n\n- Z = Pyrazinamide\n\n- E = Ethambutol\n\nTotal commonly:\n\n6 months\n\nRegimens can vary depending on national guidelines, drug resistance and patient factors.\n\n### Nursing responsibilities\n\n- Ensure adherence.\n\n- Monitor adverse effects.\n\n- Educate patient on completing treatment.\n\n- Assess contacts where appropriate.\n\n- Use appropriate infection-control precautions.\n\n- Monitor nutritional status.\n\n### Important drug side effects\n\nIsoniazid → Peripheral neuropathy, hepatotoxicity\n\nRifampicin → Orange/red discoloration of body fluids, hepatotoxicity, drug interactions\n\nPyrazinamide → Hepatotoxicity, hyperuricemia\n\nEthambutol → Optic toxicity/visual changes\n\n### ⭐ Exam\n\nPatient taking ethambutol reports blurred vision/colour vision changes:\n\nReport promptly; suspect optic toxicity.\n\n# 4. ISOLATION PRECAUTIONS\n\nKuna:\n\n## A. Standard Precautions\n\nApply to ALL patients, regardless of diagnosis.\n\nIncludes:\n\n- Hand hygiene\n\n- PPE according to anticipated exposure\n\n- Sharps safety\n\n- Safe injection practices\n\n- Respiratory hygiene\n\n- Proper handling of equipment/specimens\n\n# B. CONTACT PRECAUTIONS\n\nUsed for infections spread by direct or indirect contact.\n\nExamples:\n\n- C. difficile\n\n- MRSA in certain circumstances\n\n- Some highly infectious skin/wound infections\n\n### PPE\n\n- Gloves\n\n- Gown when indicated\n\n### Key nursing action\n\nDedicated equipment when possible + good hand hygiene.\n\n# C. DROPLET PRECAUTIONS\n\nFor infections spread mainly through respiratory droplets.\n\nExamples can include:\n\n- Influenza\n\n- Pertussis\n\n- Meningococcal disease\n\n### PPE\n\nSurgical/procedure mask\n\nAdd eye protection when splash/spray risk exists.\n\n# D. AIRBORNE PRECAUTIONS\n\nFor organisms that remain suspended in the air.\n\nClassic examples:\n\n- Pulmonary/laryngeal TB\n\n- Measles\n\n- Chickenpox/varicella\n\n### Key requirements\n\n- Appropriate airborne isolation room/negative pressure when available.\n\n- Healthcare worker uses fit-tested N95 or equivalent respirator.\n\n- Limit unnecessary transport.\n\n### ⭐ Exam\n\nTB → AIRBORNE\n\nC. difficile → CONTACT\n\nInfluenza → DROPLET\n\nMeasles → AIRBORNE\n\n# 5. FEVER MANAGEMENT 🌡️\n\n### Fever\n\nIncrease in body temperature due to a raised hypothalamic set point, commonly associated with infection.\n\n### Nursing assessment\n\nCheck:\n\n- Temperature\n\n- Pulse\n\n- Respiratory rate\n\n- BP\n\n- Level of consciousness\n\n- Hydration status\n\n- Possible source of infection\n\n### Nursing interventions\n\n#### 1. Treat the cause\n\n- Investigate possible infection.\n\n- Administer prescribed antimicrobial treatment when indicated.\n\n#### 2. Hydration\n\n- Encourage oral fluids if appropriate.\n\n- IV fluids may be required when oral intake is inadequate or contraindicated.\n\n#### 3. Antipyretics\n\nExample:\n\nParacetamol/acetaminophen\n\nGive according to prescribed/age-appropriate dosing.\n\n#### 4. Comfort\n\n- Light clothing\n\n- Comfortable room temperature\n\n- Avoid excessive bundling\n\n#### 5. Monitoring\n\n- Recheck temperature.\n\n- Monitor vital signs.\n\n- Monitor urine output and hydration.\n\n### 👶 Child\n\nFever management is particularly important because children can deteriorate quickly.\n\nFebrile convulsions can occur in some young children with fever.\n\nIf a child has a seizure:\n\n- Protect from injury.\n\n- Place safely on side when appropriate.\n\n- Do not put anything in the mouth.\n\n- Monitor airway and breathing.\n\n- Seek urgent medical attention.\n\n### 👴 Older adult\n\nMzee anaweza kuwa na serious infection bila high fever, hivyo usitumie fever pekee ku-rule out infection.\n\nLook for:\n\n- New confusion/delirium\n\n- Weakness\n\n- Reduced appetite\n\n- Functional decline\n\n- Tachypnea\n\n# 6. OPPORTUNISTIC INFECTIONS — OIs\n\nOpportunistic infections ni infections zinazotokea kwa urahisi zaidi wakati immune system imedhoofika, hasa kwa advanced HIV.\n\n### Common OIs\n\n| **Opportunistic infection** | **Important clue** |\n| --- | --- |\n| Tuberculosis | Chronic cough, weight loss, night sweats |\n| Pneumocystis jirovecii pneumonia (PJP/PCP) | Progressive dyspnea, dry cough, hypoxemia |\n| Candidiasis | White oral plaques/thrush |\n| Cryptococcal meningitis | Headache, fever, altered mental status |\n| Toxoplasmosis | CNS disease, headache/seizures/focal deficits |\n| CMV retinitis | Visual disturbance |\n| Herpes zoster | Painful grouped vesicular rash |\n| Cryptosporidiosis | Prolonged watery diarrhea |\n\n### ⭐ High-yield clues\n\nHIV + white oral plaques → Candidiasis\n\nHIV + dry cough + progressive dyspnea → PJP/PCP\n\nHIV + headache + neurological symptoms → Consider cryptococcal meningitis or other CNS OI\n\nHIV + visual changes → Consider CMV retinitis\n\nHIV + chronic cough + night sweats + weight loss → TB\n\n# 👶 CHILD vs 👨 ADULT vs 👴 OLDER ADULT\n\n| **Area** | **Child** | **Adult** | **Older adult** |\n| --- | --- | --- | --- |\n| Infection signs | Fever may be prominent | Typical signs often present | Fever may be absent/minimal |\n| Sepsis | Can deteriorate rapidly | ABCDE + sepsis management | Confusion/weakness may be important |\n| HIV | Growth/development affected | May remain asymptomatic initially | Comorbidities may complicate care |\n| TB | May have atypical symptoms | Chronic cough common | Symptoms can be subtle |\n| Fever | Monitor closely | Treat cause + comfort | Don't rely on fever alone |\n| Hydration | Dehydration can develop quickly | Monitor intake/output | Reduced thirst increases risk |\n| Medication | Weight/age-based dosing | Adult dosing | Renal/hepatic function important |\n\n# 🔥 EXAM MASTER POINTS\n\n- Sepsis → infection + life-threatening organ dysfunction\n\n- First priority in sepsis → ABCDE/resuscitation\n\n- HIV attacks mainly CD4 T cells\n\n- ART controls HIV but is not a cure\n\n- TB → Mycobacterium tuberculosis\n\n- Pulmonary TB → airborne precautions\n\n- TB classic symptoms → cough ≥2 weeks + fever/night sweats/weight loss\n\n- Ethambutol → optic toxicity\n\n- Rifampicin → orange/red body fluids\n\n- Isoniazid → peripheral neuropathy/hepatotoxicity\n\n- Standard precautions → every patient\n\n- Contact → gloves/gown as indicated\n\n- Droplet → surgical/procedure mask\n\n- Airborne → N95/equivalent respirator\n\n- Measles → airborne\n\n- Influenza → droplet\n\n- C. difficile → contact\n\n- HIV + oral thrush → candidiasis\n\n- HIV + dry cough/dyspnea → PJP\n\n- HIV + visual disturbance → CMV retinitis\n\n- Older adult may have serious infection without high fever\n\n- Fever management → hydration + comfort + antipyretic when indicated + treat cause"}, {"t": "🩺 GASTROINTESTINAL — NURSING REVISION NOTE", "m": "# 🩺 GASTROINTESTINAL — NURSING REVISION NOTE\n\n# 1. GERD — Gastroesophageal Reflux Disease\n\n### Definition\n\nGERD ni hali ambapo stomach contents hurudi kwenye esophagus (acid reflux) na kusababisha symptoms au damage ya esophagus.\n\n### Risk factors\n\n- Obesity\n\n- Pregnancy\n\n- Large/fatty meals\n\n- Smoking\n\n- Alcohol\n\n- Certain medications\n\n- Lying down soon after eating\n\n### Signs & symptoms\n\n- Heartburn — burning sensation behind sternum\n\n- Acid regurgitation\n\n- Sour/bitter taste\n\n- Chest discomfort\n\n- Difficulty swallowing\n\n- Chronic cough\n\n- Hoarseness\n\n### Nursing management\n\n- Eat small, frequent meals.\n\n- Avoid lying down for 2–3 hours after eating.\n\n- Elevate head of bed.\n\n- Reduce foods that trigger symptoms.\n\n- Weight reduction if overweight.\n\n- Avoid smoking.\n\n- Administer prescribed medications.\n\n### Medications\n\n- Antacids\n\n- H₂-receptor blockers\n\n- Proton pump inhibitors (PPIs) e.g. omeprazole\n\n### ⭐ Exam\n\nPatient mwenye heartburn inayoongezeka baada ya kula na akilala → think GERD.\n\n# 2. PEPTIC ULCER DISEASE — PUD\n\n### Definition\n\nPeptic ulcer ni open sore kwenye lining ya stomach au duodenum.\n\n### Main causes\n\n- Helicobacter pylori (H. pylori)\n\n- NSAIDs — ibuprofen, aspirin, etc.\n\nOther risk factors:\n\n- Smoking\n\n- Alcohol\n\n- Previous ulcer\n\n### Symptoms\n\n- Epigastric pain/burning\n\n- Nausea\n\n- Bloating\n\n- Early satiety\n\n### Important pain pattern\n\nDuodenal ulcer:\n\nPain inaweza kupungua baada ya kula lakini kurudi masaa kadhaa baadaye/ukiwa na njaa.\n\nGastric ulcer:\n\nPain inaweza kuongezeka baada ya kula.\n\n### Complications 🚨\n\n- GI bleeding\n\n- Perforation\n\n- Gastric outlet obstruction\n\n### Signs of perforation\n\n- Sudden severe abdominal pain\n\n- Rigid/board-like abdomen\n\n- Peritonitis\n\n### Management\n\nIf H. pylori positive:\n\n- Combination of acid suppression + antibiotics according to regimen.\n\nIf NSAID-related:\n\n- Stop/reduce offending NSAID when clinically appropriate.\n\n- PPI may be prescribed.\n\n### ⭐ Exam\n\nPUD + sudden severe abdominal pain + rigid abdomen:\n\nSuspect perforation → emergency.\n\n# 3. GI BLEEDING 🩸\n\nGI bleeding inaweza kutokea upper au lower GI tract.\n\n## Upper GI bleeding\n\nSources:\n\n- Peptic ulcer\n\n- Gastritis\n\n- Esophageal varices\n\n- Mallory-Weiss tear\n\n### Signs\n\nHematemesis → vomiting blood\n\nCoffee-ground vomitus → partially digested blood\n\nMelena → black, tarry, foul-smelling stool\n\n## Lower GI bleeding\n\nCan present with:\n\nHematochezia → bright red/maroon blood passed per rectum.\n\n### Signs of significant blood loss\n\n- Tachycardia\n\n- Hypotension\n\n- Pallor\n\n- Weakness\n\n- Dizziness\n\n- Reduced urine output\n\n- Altered consciousness\n\n- Shock\n\n### Nursing priorities 🚨\n\nABCDE + circulation/resuscitation\n\n- Assess vital signs frequently.\n\n- Establish IV access.\n\n- Monitor fluid balance/urine output.\n\n- Prepare blood tests/crossmatch.\n\n- Administer fluids/blood products as ordered.\n\n- Keep patient NPO when appropriate.\n\n- Monitor stool/vomit.\n\n- Prepare for endoscopy.\n\n### ⭐ Exam\n\nPatient with hematemesis + hypotension + tachycardia:\n\nGI hemorrhage with possible hypovolemic shock.\n\n# 4. HEPATITIS\n\n### Definition\n\nHepatitis = inflammation of the liver.\n\nMajor viral types:\n\n| **Type** | **Main transmission** | **Chronic infection** |\n| --- | --- | --- |\n| HAV | Fecal-oral | Usually no |\n| HBV | Blood/body fluids/sexual/perinatal | Yes |\n| HCV | Mainly blood | Yes, common |\n| HDV | Requires HBV | Yes |\n| HEV | Fecal-oral | Usually no; special risks in pregnancy |\n\n### Symptoms\n\n- Fatigue\n\n- Fever\n\n- Loss of appetite\n\n- Nausea/vomiting\n\n- Right upper abdominal discomfort\n\n- Dark urine\n\n- Pale stool\n\n- Jaundice\n\n### Nursing care\n\n- Monitor liver function.\n\n- Monitor jaundice.\n\n- Encourage adequate nutrition.\n\n- Avoid alcohol.\n\n- Avoid unnecessary hepatotoxic drugs.\n\n- Educate regarding transmission.\n\n- Encourage vaccination where available.\n\n### ⭐ Important\n\nHepatitis A & E → mainly fecal-oral\n\nHepatitis B, C & D → primarily blood/body-fluid related.\n\n### Prevention\n\nHAV → good sanitation + vaccination.\n\nHBV → vaccination + safe sex + safe injections + blood screening.\n\nHCV → no effective vaccine currently; prevent blood exposure.\n\n# 5. CIRRHOSIS\n\n### Definition\n\nCirrhosis ni chronic progressive liver damage ambapo normal liver tissue hubadilishwa na fibrosis/scar tissue, na liver function hupungua.\n\n### Causes\n\n- Chronic hepatitis B/C\n\n- Long-term alcohol-related liver disease\n\n- Metabolic dysfunction-associated steatotic liver disease (MASLD)\n\n- Autoimmune/cholestatic diseases\n\n- Other chronic liver diseases\n\n### Signs & symptoms\n\n- Fatigue\n\n- Weight loss\n\n- Jaundice\n\n- Ascites\n\n- Peripheral edema\n\n- Easy bruising/bleeding\n\n- Spider angiomas\n\n- Muscle wasting\n\n### Important complications 🚨\n\n#### 1. Ascites\n\nFluid accumulation in abdomen.\n\n#### 2. Portal hypertension\n\nIncreased pressure in portal venous system.\n\nCan cause:\n\n- Esophageal varices\n\n- Splenomegaly\n\n- Ascites\n\n#### 3. Esophageal varices\n\nDilated veins that can rupture and cause massive GI bleeding.\n\n#### 4. Hepatic encephalopathy\n\nAccumulation of toxins, especially ammonia, contributes to altered brain function.\n\nSigns:\n\n- Confusion\n\n- Personality/behaviour changes\n\n- Reduced consciousness\n\n- Asterixis (flapping tremor)\n\n#### 5. Hepatorenal syndrome\n\nSevere liver disease associated with kidney dysfunction.\n\n## Nursing management\n\n### Ascites\n\n- Monitor abdominal girth.\n\n- Monitor weight.\n\n- Monitor fluid balance.\n\n- Sodium restriction may be prescribed.\n\n- Diuretics may be prescribed.\n\n- Therapeutic paracentesis may be required.\n\n### Hepatic encephalopathy\n\n- Monitor mental status.\n\n- Identify/treat precipitating factors.\n\n- Lactulose may be prescribed to reduce ammonia absorption.\n\n- Monitor stool pattern.\n\n### Varices\n\nGI bleeding is an emergency.\n\n### ⭐ Exam\n\nCirrhosis + confusion + asterixis:\n\nHepatic encephalopathy\n\nCirrhosis + hematemesis:\n\nSuspect ruptured esophageal varices.\n\n# 6. PANCREATITIS\n\n### Definition\n\nPancreatitis = inflammation of the pancreas.\n\n### Common causes\n\n- Gallstones\n\n- Alcohol\n\n- Hypertriglyceridemia\n\n- Certain drugs\n\n- Abdominal trauma\n\n- ERCP\n\n### Symptoms\n\nClassic:\n\nSevere epigastric abdominal pain radiating to the back\n\nOther:\n\n- Nausea/vomiting\n\n- Fever\n\n- Abdominal tenderness\n\n- Tachycardia\n\n### Investigations\n\n- Serum lipase — commonly preferred\n\n- Amylase\n\n- Liver tests\n\n- Electrolytes\n\n- Glucose\n\n- Imaging when indicated\n\n### Management\n\n- IV fluids\n\n- Pain management\n\n- Antiemetics\n\n- Early oral/enteral nutrition when tolerated/appropriate\n\n- Treat underlying cause\n\nSevere cases may require ICU care.\n\n### Complications\n\n- Shock\n\n- Respiratory failure\n\n- Acute kidney injury\n\n- Pancreatic necrosis\n\n- Pseudocyst\n\n- Sepsis/infection of necrosis\n\n### ⭐ Exam\n\nSevere epigastric pain radiating to the back + elevated lipase\n\n→ Acute pancreatitis\n\n# 7. DIARRHEA\n\n### Definition\n\nPassing loose or watery stools, usually ≥3 times per day or more frequently than normal for the person.\n\n### Causes\n\n- Bacterial infection\n\n- Viral infection\n\n- Parasites\n\n- Food poisoning\n\n- Antibiotics\n\n- Malabsorption\n\n- Inflammatory bowel disease\n\n### Main danger 🚨\n\nDEHYDRATION\n\n### Signs of dehydration\n\n- Thirst\n\n- Dry mouth\n\n- Reduced urine\n\n- Sunken eyes\n\n- Weakness\n\n- Tachycardia\n\n- Hypotension\n\n- Poor skin turgor\n\n### Nursing management\n\n#### Oral Rehydration Solution — ORS\n\nFor mild/moderate dehydration where oral intake is possible.\n\nORS replaces:\n\n- Water\n\n- Sodium\n\n- Potassium\n\n- Glucose/electrolytes\n\n### Other care\n\n- Continue feeding.\n\n- Continue breastfeeding in infants.\n\n- Monitor stool frequency.\n\n- Monitor urine output.\n\n- Maintain infection control.\n\n- Zinc supplementation is recommended for children with acute diarrhea according to local/WHO guidance.\n\n### 🚨 Severe dehydration\n\nMay require:\n\nIV fluids + urgent medical assessment\n\n### 👶 Child\n\nChildren can become dehydrated very quickly.\n\nWatch for:\n\n- Sunken eyes\n\n- Lethargy\n\n- Poor drinking\n\n- Reduced urine\n\n- Dry mouth\n\n### 👴 Older adult\n\nMzee is also at increased risk because thirst sensation may be reduced and comorbidities/medications can worsen fluid imbalance.\n\n# 8. CONSTIPATION\n\n### Definition\n\nDifficult, infrequent or incomplete passage of stool, often with hard/dry stools.\n\n### Causes\n\n- Low-fiber diet\n\n- Inadequate fluids\n\n- Lack of exercise\n\n- Ignoring urge to defecate\n\n- Pregnancy\n\n- Some medications e.g. opioids, iron\n\n- Neurological disorders\n\n- Bowel obstruction\n\n### Symptoms\n\n- Hard stool\n\n- Straining\n\n- Abdominal discomfort\n\n- Bloating\n\n- Feeling of incomplete evacuation\n\n### Nursing management\n\nLifestyle:\n\n- Increase fiber gradually.\n\n- Encourage adequate fluids if not contraindicated.\n\n- Encourage physical activity.\n\n- Establish regular toileting.\n\n- Respond to urge to defecate.\n\n### Medications\n\nDepending on cause:\n\n- Bulk-forming agents\n\n- Osmotic laxatives\n\n- Stool softeners\n\n- Stimulant laxatives\n\n### 🚨 Red flags\n\nConstipation +:\n\n- Severe abdominal pain\n\n- Persistent vomiting\n\n- Abdominal distension\n\n- Inability to pass stool and gas\n\n- Blood in stool\n\n- Unexplained weight loss\n\n→ Think bowel obstruction/serious pathology and refer urgently.\n\n# 👶 CHILD vs 👨 ADULT vs 👴 MZEE\n\n| **Condition** | **Child** | **Adult** | **Older adult** |\n| --- | --- | --- | --- |\n| GERD | Feeding problems, vomiting, irritability may occur | Heartburn/regurgitation | Symptoms may be atypical |\n| GI bleeding | Rapid deterioration possible | Hematemesis/melena/hematochezia | Higher risk of severe consequences |\n| Hepatitis | Growth/nutrition may be affected | Typical symptoms may occur | Comorbidities complicate disease |\n| Cirrhosis | Can occur with chronic liver disease | Ascites/varices/encephalopathy | Higher risk of complications |\n| Pancreatitis | Less common; different causes possible | Gallstones/alcohol common | Gallstones and comorbidities important |\n| Diarrhea | Rapid dehydration risk | Dehydration risk | High dehydration risk |\n| Constipation | Diet/toilet training/functional causes common | Diet, medications, disease | Very common; medications/low mobility important |\n\n# 🔥 GASTROINTESTINAL — EXAM MASTER POINTS\n\n- GERD → acid reflux into esophagus\n\n- GERD → heartburn + regurgitation\n\n- PUD → H. pylori + NSAIDs are major causes\n\n- PUD complication → bleeding, perforation, obstruction\n\n- Hematemesis → upper GI bleeding\n\n- Coffee-ground vomitus → upper GI bleeding\n\n- Melena → usually upper GI bleeding\n\n- Hematochezia → usually lower GI bleeding\n\n- Major GI bleeding → ABC + control shock\n\n- Hepatitis → inflammation of liver\n\n- HAV/HEV → fecal-oral\n\n- HBV/HCV/HDV → mainly blood/body-fluid transmission\n\n- HBV → vaccine available\n\n- HCV → no effective vaccine currently\n\n- Cirrhosis → fibrosis/scarring of liver\n\n- Cirrhosis + ascites → portal hypertension/liver failure context\n\n- Cirrhosis + confusion + asterixis → hepatic encephalopathy\n\n- Cirrhosis + hematemesis → suspect esophageal varices\n\n- Pancreatitis → severe epigastric pain radiating to back\n\n- Acute pancreatitis → lipase is an important diagnostic test\n\n- Diarrhea → biggest immediate danger is dehydration\n\n- Child with diarrhea → dehydration can develop rapidly\n\n- Constipation → increase fiber, fluids and activity when appropriate\n\n- Constipation + no stool AND no gas + distension/vomiting → suspect obstruction"}, {"t": "❤️ CARDIOVASCULAR — NURSING REVISION NOTES", "m": "# ❤️ CARDIOVASCULAR — NURSING REVISION NOTES\n\nHizi nimezipanga kwa mtindo wa exam revision: definition → causes/risk factors → signs & symptoms → investigations → management → nursing care → complications → high-yield points.\n\n# 1. HEART FAILURE (HF)\n\n### Definition\n\nHeart failure ni hali ambapo moyo hauwezi kusukuma damu kwa kiwango kinachokidhi mahitaji ya mwili, au unaweza kufanya hivyo kwa pressure kubwa isiyo ya kawaida.\n\n### Types\n\nLeft-sided heart failure → Blood backs up into the lungs.\n\nRight-sided heart failure → Blood backs up into systemic circulation.\n\n### Left-sided signs\n\n- Dyspnea\n\n- Orthopnea\n\n- Paroxysmal nocturnal dyspnea\n\n- Crackles\n\n- Cough\n\n- Pulmonary edema\n\n- Fatigue\n\n### Right-sided signs\n\n- Peripheral edema\n\n- Raised JVP\n\n- Hepatomegaly\n\n- Ascites\n\n- Weight gain\n\n### ⭐ Important\n\nLeft → Lungs\nRight → Rest of body\n\n## Risk factors/causes\n\n- Hypertension\n\n- Myocardial infarction\n\n- Coronary artery disease\n\n- Cardiomyopathy\n\n- Valvular heart disease\n\n- Arrhythmias\n\n### Investigations\n\n- ECG\n\n- Echocardiogram\n\n- Chest X-ray\n\n- BNP/NT-proBNP\n\n- Electrolytes\n\n- Renal function\n\n### Management\n\nDepending on type of HF:\n\n- Diuretics\n\n- ACE inhibitors/ARBs/ARNI\n\n- Beta-blockers\n\n- Mineralocorticoid receptor antagonists\n\n- SGLT2 inhibitors\n\n- Other guideline-directed therapy\n\n### Nursing care\n\n- Monitor BP, pulse, RR and SpO₂.\n\n- Monitor daily weight.\n\n- Monitor edema.\n\n- Monitor intake/output.\n\n- Position in Fowler's/high Fowler's if dyspneic.\n\n- Administer prescribed medications.\n\n- Educate about medication adherence and diet/fluid recommendations.\n\n### 🚨 Acute pulmonary edema\n\nSigns:\n\n- Severe dyspnea\n\n- Crackles\n\n- Hypoxia\n\n- Pink/frothy sputum may occur\n\nPriority:\n\nABC + oxygen/respiratory support as indicated + urgent medical management.\n\n# 2. MYOCARDIAL INFARCTION — MI ❤️‍🔥\n\n### Definition\n\nMI occurs when there is acute myocardial injury caused by myocardial ischemia, usually due to acute coronary artery occlusion.\n\n### Risk factors\n\n- Hypertension\n\n- Diabetes\n\n- Smoking\n\n- Hyperlipidemia\n\n- Obesity\n\n- Older age\n\n- Family history\n\n- Previous coronary artery disease\n\n### Symptoms\n\nClassic:\n\nSevere/prolonged chest pressure or discomfort\n\nMay radiate to:\n\n- Left/right arm\n\n- Shoulder\n\n- Neck\n\n- Jaw\n\n- Back\n\nOther:\n\n- Sweating\n\n- Nausea/vomiting\n\n- Dyspnea\n\n- Anxiety\n\n- Weakness\n\n### 👴 Older adults\n\nMay have atypical or less obvious symptoms, including:\n\n- Dyspnea\n\n- Fatigue\n\n- Confusion\n\n- Weakness\n\n## Investigations\n\n### ECG\n\n12-lead ECG should be obtained promptly in suspected acute coronary syndrome.\n\n### Cardiac biomarkers\n\nTroponin is the preferred biomarker of myocardial injury.\n\n## Management\n\nDepending on the type and setting:\n\n- Aspirin when appropriate\n\n- Other antiplatelet/anticoagulant therapy as indicated\n\n- Nitrates when appropriate\n\n- Reperfusion therapy for STEMI: \n\n- PCI preferred when available in an appropriate time window\n\n- Fibrinolysis when PCI cannot be achieved in time and there are no contraindications\n\n### Nursing priority\n\nDo not delay emergency assessment/ECG and reperfusion pathway.\n\n### Complications\n\n- Arrhythmias\n\n- Heart failure\n\n- Cardiogenic shock\n\n- Cardiac rupture\n\n- Pericarditis\n\n# 3. ANGINA PECTORIS\n\n### Definition\n\nAngina = chest discomfort caused by temporary myocardial ischemia without myocardial infarction.\n\n## Stable angina\n\nUsually:\n\n- Triggered by exertion/stress\n\n- Predictable\n\n- Relieved by rest or nitroglycerin\n\n## Unstable angina 🚨\n\n- New or worsening angina\n\n- May occur at rest\n\n- Less predictable\n\n- Medical emergency\n\n### Symptoms\n\n- Chest pressure/tightness\n\n- Pain may radiate to arm/jaw/back\n\n- Dyspnea\n\n- Sweating\n\n- Fatigue\n\n### Stable angina vs MI\n\n| **Stable Angina** | **MI** |\n| --- | --- |\n| Usually predictable | Often unpredictable |\n| Triggered by exertion | May occur at rest |\n| Relieved by rest/nitroglycerin | Persistent despite rest |\n| No myocardial necrosis | Myocardial injury/necrosis |\n\n### ⭐ Exam\n\nChest pain that doesn't improve with rest/nitroglycerin and is prolonged:\n\nThink ACS/MI → emergency assessment.\n\n# 4. HYPERTENSION\n\n### Definition\n\nHypertension = persistently elevated arterial blood pressure diagnosed using appropriate repeated measurements and clinical criteria.\n\n### Risk factors\n\n- Family history\n\n- Obesity\n\n- High salt intake\n\n- Physical inactivity\n\n- Smoking\n\n- Excess alcohol\n\n- Diabetes\n\n- Increasing age\n\n### Usually asymptomatic\n\nThat's why hypertension is often called:\n\n\"Silent killer.\"\n\n### Possible symptoms when severe\n\n- Headache\n\n- Visual disturbance\n\n- Chest pain\n\n- Dyspnea\n\n- Neurological symptoms\n\n## Complications\n\nLong-term uncontrolled hypertension can cause:\n\n❤️ Heart\n\n- Heart failure\n\n- MI\n\n🧠 Brain\n\n- Stroke\n\n👁️ Eyes\n\n- Retinopathy\n\n🫘 Kidneys\n\n- Chronic kidney disease\n\n### Management\n\n- Reduce salt intake.\n\n- Healthy diet.\n\n- Exercise.\n\n- Weight management.\n\n- Stop smoking.\n\n- Limit alcohol.\n\n- Antihypertensive medication as prescribed.\n\n### Common drug classes\n\n- ACE inhibitors\n\n- ARBs\n\n- Calcium-channel blockers e.g. amlodipine\n\n- Thiazide/thiazide-like diuretics\n\n- Beta-blockers in selected indications\n\n### 🚨 Hypertensive emergency\n\nSeverely elevated BP with acute target-organ damage.\n\nExamples:\n\n- Stroke\n\n- Acute pulmonary edema\n\n- Acute kidney injury\n\n- Aortic dissection\n\nRequires urgent hospital management and controlled BP reduction.\n\n# 5. ARRHYTHMIAS\n\n### Definition\n\nArrhythmia = abnormality of heart rate, rhythm, or conduction.\n\n### Common types\n\n## A. Bradycardia\n\nHeart rate:\n\n<60 bpm\n\nMay be normal in some healthy people, especially athletes.\n\nSymptoms if clinically significant:\n\n- Dizziness\n\n- Syncope\n\n- Fatigue\n\n- Hypotension\n\n## B. Tachycardia\n\nHeart rate:\n\n>100 bpm\n\nPossible causes:\n\n- Fever\n\n- Pain\n\n- Anxiety\n\n- Dehydration\n\n- Anemia\n\n- Infection\n\n## C. Atrial fibrillation — AF\n\nIrregular atrial electrical activity.\n\nTypical pulse:\n\nIrregularly irregular\n\nMajor complication:\n\nThromboembolic stroke\n\nManagement may include:\n\n- Rate control\n\n- Rhythm control in selected patients\n\n- Anticoagulation based on stroke-risk assessment\n\n## D. Ventricular fibrillation — VF 🚨\n\n- Chaotic ventricular electrical activity.\n\n- No effective cardiac output.\n\n- Patient is unresponsive and not breathing normally.\n\nTreatment:\n\nCPR + immediate defibrillation when indicated\n\n### ⭐ Exam\n\nVF = shockable rhythm.\n\n# 6. SHOCK\n\n### Definition\n\nShock = inadequate tissue perfusion and oxygen delivery, resulting in cellular dysfunction and organ failure if untreated.\n\n### Types\n\n| **Type** | **Main cause** |\n| --- | --- |\n| Hypovolemic | Blood/fluid loss |\n| Cardiogenic | Pump failure |\n| Septic | Severe infection |\n| Anaphylactic | Severe allergic reaction |\n| Neurogenic | Loss of sympathetic tone |\n\n### Signs\n\n- Hypotension\n\n- Tachycardia\n\n- Tachypnea\n\n- Weak pulse\n\n- Cold/clammy skin\n\n- Pallor\n\n- Reduced urine\n\n- Confusion\n\n- Altered consciousness\n\n### Cardiogenic shock\n\nCommon causes:\n\n- Large MI\n\n- Severe heart failure\n\nKey problem:\n\nThe heart cannot pump enough blood.\n\n### Nursing priority\n\n- ABCDE\n\n- Oxygen/ventilatory support as indicated\n\n- IV access\n\n- Monitor ECG/vital signs\n\n- Identify and treat cause\n\n- Fluids cautiously in cardiogenic shock because excessive fluid can worsen pulmonary edema.\n\n# 7. PERIPHERAL VASCULAR DISEASE\n\nPeripheral vascular disease often refers to disease affecting vessels of the limbs.\n\n## Peripheral Arterial Disease — PAD\n\nCause:\n\nAtherosclerotic narrowing of peripheral arteries.\n\n### Signs\n\nClassic:\n\nIntermittent claudication\n\nPain in leg muscles during walking that improves with rest.\n\nOther:\n\n- Cool limb\n\n- Pale skin\n\n- Weak/absent peripheral pulses\n\n- Shiny skin\n\n- Hair loss\n\n- Slow-healing wounds\n\n- Pain at rest in severe disease\n\n### Nursing care\n\n- Encourage prescribed walking/exercise program.\n\n- Stop smoking.\n\n- Control diabetes/BP/lipids.\n\n- Assess pulses and skin.\n\n- Protect feet from injury.\n\n- Ensure appropriate footwear.\n\n### 🚨 Acute limb ischemia\n\nClassic 6 Ps:\n\n- Pain\n\n- Pallor\n\n- Pulselessness\n\n- Paresthesia\n\n- Paralysis\n\n- Poikilothermia — cold limb\n\nAcute limb ischemia = emergency.\n\n# 8. DVT — DEEP VEIN THROMBOSIS\n\n### Definition\n\nDVT = formation of a blood clot in a deep vein, usually in the lower limb.\n\n### Risk factors — Virchow's Triad\n\n### 1. Stasis\n\n- Immobility\n\n- Prolonged bed rest\n\n- Long travel\n\n### 2. Vessel injury\n\n- Surgery\n\n- Trauma\n\n### 3. Hypercoagulability\n\n- Cancer\n\n- Pregnancy\n\n- Some medications\n\n- Previous DVT\n\n## Signs & symptoms\n\nUsually unilateral:\n\n- Leg swelling\n\n- Pain/tenderness\n\n- Warmth\n\n- Redness/discoloration\n\n⚠️ Do not rely on Homan's sign as a diagnostic test.\n\n# 🚨 DVT → Pulmonary Embolism\n\nA clot can break off and travel to the lungs.\n\n### PE signs\n\n- Sudden dyspnea\n\n- Chest pain\n\n- Tachycardia\n\n- Hypoxia\n\n- Hemoptysis may occur\n\n- Syncope/collapse in severe cases\n\nDVT + sudden dyspnea/chest pain = suspect PE → emergency.\n\n### Management of DVT\n\n- Anticoagulation is the main treatment for most patients.\n\n- Compression therapy may be used in selected cases.\n\n- Mobilization according to clinical condition/protocol.\n\n### Nursing care\n\n- Monitor affected limb.\n\n- Administer anticoagulants as prescribed.\n\n- Monitor for bleeding.\n\n- Encourage appropriate mobility.\n\n- Educate patient about medication adherence.\n\n- Do not massage the affected leg.\n\n### ⭐ Exam\n\nPatient with suspected DVT:\n\nDo NOT massage the leg.\n\n# 👶 CHILD vs 👨 ADULT vs 👴 MZEE\n\n| **Condition** | **Child** | **Adult** | **Older adult** |\n| --- | --- | --- | --- |\n| Heart failure | Less common; congenital/other causes | HTN, ischemic disease common | Multiple cardiac diseases common |\n| MI | Rare | Chest pain common | May present atypically |\n| Hypertension | Secondary causes more important | Often primary | Common; monitor orthostatic BP |\n| Arrhythmias | Congenital/structural causes possible | AF and other arrhythmias | AF and conduction problems more common |\n| Shock | Can deteriorate rapidly | ABCDE | May have subtle signs |\n| PAD | Rare | Atherosclerosis | More common |\n| DVT | Less common | Surgery/immobility etc. | Increased risk due to age, immobility/comorbidity |\n\n# 🔥 CARDIOVASCULAR — EXAM MASTER POINTS\n\n- Left heart failure → pulmonary congestion\n\n- Right heart failure → peripheral edema/JVP/ascites\n\n- Heart failure → daily weight is important\n\n- MI → myocardial injury due to acute ischemia\n\n- Troponin → preferred biomarker of myocardial injury\n\n- Suspected MI → prompt 12-lead ECG\n\n- Stable angina → exertion, relieved by rest\n\n- Unstable angina → emergency/ACS\n\n- Hypertension → often asymptomatic\n\n- Hypertension complications → heart, brain, kidneys, eyes\n\n- AF → irregularly irregular rhythm\n\n- AF → increased risk of embolic stroke\n\n- VF → cardiac arrest + shockable rhythm\n\n- VF → CPR + defibrillation\n\n- Cardiogenic shock → pump failure\n\n- PAD → intermittent claudication\n\n- Acute limb ischemia → 6 Ps\n\n- DVT → swelling/pain/warmth, usually unilateral\n\n- DVT → don't massage the affected leg\n\n- DVT can cause PE\n\n- Sudden dyspnea + DVT symptoms → suspect PE\n\n- Virchow's triad → stasis + endothelial injury + hypercoagulability\n\n- Older adult with MI may present with atypical symptoms\n\n- Shock → priority is ABCDE and treatment of underlying cause"}];
