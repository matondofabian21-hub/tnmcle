*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--tx)}

button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:8px;padding:7px 12px}button.p{background:var(--ac);border-color:var(--ac);color:#fff}button:disabled{opacity:.4}

.sec{display:block;width:100%;text-align:left;margin-bottom:6px;font-size:13px}.sec.on{border-color:var(--ac);outline:1px solid var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px}.grid button{padding:5px 0;font-size:12px}
.grid .ans{background:var(--ac);color:#fff;border-color:var(--ac)}.grid .flg{box-shadow:inset 0 -4px 0 var(--fl)}.grid .cur{outline:2px solid var(--tx)}.grid .c{background:var(--ok);border-color:var(--okb);color:var(--tx)}.grid .w{background:var(--no);border-color:var(--nob);color:var(--tx)}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin:8px 0;cursor:pointer}.opt.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent)}
.opt.ok{background:var(--ok);border-color:var(--okb)}.opt.bad{background:var(--no);border-color:var(--nob)}.opt b{min-width:20px}
.q{font-size:16px;font-weight:600}.mu{color:var(--mu);font-size:13px}.rat{border-left:4px solid var(--ac);padding:6px 10px;margin-top:8px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.big{font-size:34px;font-weight:700}

<script>
const S=[["A","Basic Nursing",1,40],["B","Medical Surgical Nursing",41,76],["C","Community Health Nursing",77,96],["D","Midwifery & Child Health",97,136],["E","Mental Health Nursing",137,160],["F","Leadership & Management",161,180]];
// [no, text, [A,B,C,D], answer, rationale] — add the remaining paper questions here in the same format.
const Q=[
[1, "This paper consists of 180 Multiple Choice Questions divided into Five Sections: - Section A: EBN 101 Basic Nursing (Questions 1 - 40) - Section B: EMS 102 Medical Surgical Nursing (Questions 41 - 80) - Section C: ECH 103 Community Health Nursing (Questions 81 - 110) - Section D: EMC 104 Midwifery and Child Health (Questions 111 - 150) - Section E: EMH 105 Mental Health Nursing (Questions 151 - 180) 2. Answer ALL questions in ALL sections. 3. Each question has four options (A, B, C, D). Select ONE correct answer. SECTION A: EBN 101 - BASIC NURSING (QUESTIONS 1 - 40) 1. You are teaching a group of first year student nurses on how to apply protective gear. Which protective gear will you insist the student to wear when handling contaminated linen?", ["Apron", "Gloves", "Mask", "Goggles"], "B", "Gloves protect the hands from direct contact with blood and body fluids on soiled linen. Hands are the main route of contamination.", "A"],
[2, "You have finished administering valium injection 10mg intramuscularly to Mr. Mpote. Which of the following actions will you take after the procedure?", ["Re-cap the needle using forceps", "Rinse the needle with antiseptic", "Discard the needle into sharps box", "Put the needle into a kidney dish"], "C", "Used needles go straight into a puncture-proof sharps box without recapping, to prevent needle-stick injury.", "A"],
[3, "You were collecting urine specimen to Mr. Majanga who is under indwelling catheter. The first action you are going to perform for him will be:", ["Disconnect catheter from tube and drain urine from the catheter", "Collect urine specimen from the drainage bag without disconnecting the catheter", "Release the catheter tube to allow self-draining of the urine", "Use sterile syringe to aspirate urine specimen from the drainage port"], "D", "A sterile syringe is used on the sampling port, which keeps the closed system intact and avoids infection.", "A"],
[4, "You are convincing colleagues to join Tanzania National Nurses Association. Which one of the following information will you emphasize as a primary purpose of the Professional Association?", ["Promote profession advancement", "Assist members to secure jobs abroad", "Establish links with other Professional Associations", "Support nurses in getting sufficient salaries"], "A", "The primary purpose of a professional association is to advance the profession through standards, education and advocacy.", "A"],
[5, "Mrs. Agrey reports to you that she experiences night blindness for one month now. Which of the following action will you take to solve her problem?", ["Clean her eyes and instill Gentamycine eye drops", "Apply eye pads and advise her to rest adequately", "Assess and refer her immediately to the doctor", "Advice her to eat vitamin A diet and wear glasses"], "C", "Night blindness is an early sign of vitamin A deficiency that can progress to blindness, so assess and refer for treatment.", "A"],
[6, "You are working in Kisarawe nutrition rehabilitation ward. Which of the following steps of nursing process will you follow in order to provide nutrition care to patients?", ["Assessment, implementing, planning, diagnosis, and evaluating", "Assessment, planning, diagnosis, implementing and evaluating", "Assessment, analysis, implementing and evaluating", "Assessment, diagnosis, planning, implementing and evaluating"], "D", "The nursing process order is assessment, diagnosis, planning, implementation, evaluation.", "A"],
[7, "You are inserting a nasal gastric tube for feeding to a baby Kijaruba. Which of the following actions will you carry to verify if the tube is in the stomach?", ["Take patient to X-ray department for abdominal examination", "Send patient for abdominal ultrasound scan and check the tube placement", "Aspirate gastric contents and check pH by using litmus paper", "Dip the tube in water to observe air bubbles and ask patient to speak"], "C", "Gastric aspirate with an acidic pH (blue litmus turns red) is the simple bedside check. Water bubbles are unsafe.", "A"],
[8, "You are providing care to a patient where splashing of blood is likely to occur. Which protective gear will you put on to protect your eyes?", ["Apron", "Gloves", "Mask", "Goggles"], "D", "Goggles or a face shield protect the eyes from splashes of blood and body fluid.", "A"],
[9, "You have finished dressing the wound of Mrs. Machale. How will you prepare the used equipment for future use?", ["Wash with soapy water, decontaminate, rinse, sterilize then dry", "Rinse, decontaminate, wash with soapy water, then sterilize", "Decontaminate, wash with soapy water, rinse, dry then sterilize", "Sterilize, wash with soapy water, decontaminate, rinse then dry"], "C", "The order is decontaminate (make safe to handle), clean, rinse, dry, then sterilize.", "A"],
[10, "You are admitting Mr. Majani into surgical ward for planned surgery. Which of the following groups of therapeutic communication techniques will you use while interacting with him?", ["Paraphrasing, structuring and summarizing", "Confronting, agreeing and clarifying", "Giving advice, depreciating and agreeing", "Defending, patronizing and reassurance"], "A", "Paraphrasing, structuring and summarizing are therapeutic. Giving advice, defending and false reassurance are blocks to communication.", "A"],
[11, "You come across with Mrs. Kibuyu who has a history of passing watery stools 10 times in the past twelve hours. What sign will alert you that Mrs. Kibuyu is dehydrated?", ["Edema", "Sweating", "Polyuria", "Sunken eyes"], "D", "Sunken eyes, dry mucosa and reduced skin turgor are signs of fluid loss.", "A"],
[12, "You are planning to communicate with a blind patient. Which of the following channels of communication will you use?", ["Symbols", "Spoken words", "Body language", "Signal"], "B", "A blind patient cannot see, so spoken words (and touch) are the effective channel.", "A"],
[13, "You received Mr. Green who comes from theatre following amputation of the left leg. Which type of bed will you make for him?", ["Unoccupied bed", "Divided bed", "Occupied bed", "Cardiac bed"], "B", "A divided (amputation) bed leaves the affected limb exposed to check for bleeding and allows position change.", "A"],
[14, "You are planning to feed Ms. Akini who is unable to feed herself following severe burns to her both hands. Which one of the following positions will you prefer during feeding?", ["Dorsal", "Lateral", "Sim's", "Fowler's"], "D", "Sitting up in Fowler's position lets her swallow safely and reduces the risk of aspiration.", "A"],
[15, "You are assigned to perform an abdominal examination to Ms. Yudea who has developed abdominal distention. Which of the following steps will you follow during the procedure?", ["Inspection, percussion, auscultation and palpation", "Inspection, palpation, percussion and auscultation", "Inspection, auscultation, palpation and percussion", "Inspection, palpation, auscultation and percussion"], "C", "As in the key, auscultation comes before palpation and percussion so that bowel sounds are not altered.", "A"],
[16, "The immediate action that you will take in order to help a patient with difficulty in breathing is:", ["Check vital signs", "Prepare cardiac bed", "Refer him to the doctor", "Put patient in fowler's position"], "D", "Sitting upright lets the diaphragm descend and the lungs expand, giving immediate relief.", "A"],
[17, "The steps that you will teach a group of women in order to avoid losing vitamin C when preparing vegetables will be:", ["Wash, sort, slice then cook the vegetables", "Slice, sort, wash then cook the vegetables", "Wash, cook, sort then slice the vegetables", "Sort, wash, cook then slice the vegetables"], "A", "Vitamin C is water-soluble and destroyed by heat and exposure, so wash before slicing and cook briefly.", "A"],
[18, "You are discussing with a group of lactating mothers on the use of food rich in calcium for development of bones to their infants. Which of the following food type will you emphasize these mothers for use?", ["Irish potatoes", "Green vegetables", "Whole grain", "Water melon"], "B", "Green leafy vegetables are a good source of calcium among the options.", "A"],
[19, "You working in pediatric ward and planning to assist feeding to baby Sloan who is five years old child suffering from Kwashiorkor. Which of the following groups of food will you give to the child?", ["Proteins", "Vitamins", "Carbohydrate", "Minerals"], "A", "Kwashiorkor is protein deficiency, so protein-rich foods are the priority.", "A"],
[20, "You are discharging Mr. Tukuli who has recovered from Tuberculosis. Which of the following advices will you tell him in order to prevent the spread of the disease to the community?", ["Do not travel by public transport", "Always keep distance when coughing or sneezing", "Cover the mouth when coughing and sneezing", "Avoid sharing of eating and drinking utensils with family"], "C", "TB spreads by droplets, so covering the mouth when coughing or sneezing is the key measure.", "A"],
[21, "Which of the following nursing interventions will you employ to prevent hypostatic pneumonia to an unconscious patient?", ["Changing soiled linen", "Altering the patient position frequently", "Massaging pressure areas when bathing", "Monitoring breathing rate as per guideline"], "B", "Regular position changes stop secretions pooling in the lungs.", "A"],
[22, "You observed a licensed nurse abusing a patient verbally. What action will you take to this nurse to protect professional values?", ["Report to nurse in charge", "Call the doctor of the ward", "Inform the security department", "Call for departmental meeting"], "A", "Professional misconduct is reported through the chain of command, starting with the nurse in charge.", "A"],
[23, "You are engaged in data collection of Mwigati community. Which of the following tools will you use to document information obtained from the community?", ["MTUHA book No. 2", "MTUHA book No. 3", "MTUHA book No. 4", "MTUHA book No. 5"], "B", "According to the paper's key, MTUHA book No. 3 is the community-based record.", "A"],
[24, "You are serving patient's confidential information to the office computer. Which action will you take to ensure the information is not seen with other staff?", ["Put computer password", "Protect the respective file", "Name the file as a confidential", "Ask staff not to open the file"], "A", "A password restricts access, which is the real protection of confidentiality.", "A"],
[25, "You are preparing equipment for assessing neurological function of musculoskeletal system. Which of the following instruments will you prepare to assess patient's tendon reflex?", ["Safety pins", "Tape measure", "Patella hammer", "Tuning fork"], "C", "A reflex hammer (patella hammer) taps the tendon to test deep tendon reflexes.", "A"],
[26, "You are assisting a patient who has difficulty in passing urine. Which of the following nursing measures will you take first?", ["Insert catheter to drain urine from the bladder", "Open nearby tap to stimulate urination reflex", "Apply warm compresses to genitalia to relax sphincter muscles", "Insert needle to suprapubic region to aspirate urine"], "B", "Simple non-invasive measures such as the sound of running water are tried before invasive ones.", "A"],
[27, "You are taking radial pulse of Mr. Juya. The standard pads of fingers that will you use in taking the pulse will be:", ["1-2 fingers", "2-5 fingers", "2-3 fingers", "3-5 fingers"], "C", "Use the pads of the 2nd and 3rd fingers; never the thumb, which has its own pulse.", "A"],
[28, "On recording finding of Mr. Juwa's vital signs into his case note, you made some mistakes. Which of the following action will you take to ensure proper keeping of records?", ["Strike off the records and remove from case note", "Erase the records and write on next page", "Draw a single line through the error, sign and rewrite", "Obtain new case note and initiate the records"], "C", "Records are legal documents: one line through the error, sign and date, then write the correct entry.", "A"],
[29, "You are administering digoxin tablet 0.5 mg to Mrs. Manenge who is suffering from congestive cardiac failure. Which of the following actions will you take first before administering the drug?", ["Check blood pressure", "Obtain body temperature", "Measure respiration", "Count pulse rate"], "D", "Digoxin slows the heart; count the apical pulse for one minute and withhold the dose if below 60 beats per minute.", "A"],
[30, "During sanitary round you find a patient fallen down on the floor due to wet surface and sustained injury of the right leg. Which of the following nursing legal aspects will you blame the ward nurses to have violated?", ["Harm", "Negligence", "Battery", "Assault"], "B", "Failing to keep the environment safe is negligence, a breach of the duty of care.", "A"],
[31, "You are discharging Mr. Tiddo who has recovered from asthmatic attack. The nursing instruction that you will give Mr. Tiddo to prevent recurrent of the disease will include:", ["Avoid allergens and dust environments", "Perform frequent oral hygiene", "Rest in a well-ventilated room", "Drink plenty of cold fluids"], "A", "Avoiding triggers such as dust and allergens is the main prevention of asthma attacks.", "A"],
[32, "You are teaching community health students on waste segregation and disposal according to colour coded dust bins. Which of the following coded colour dust bins would you tell the students to use when discarding food leftover?", ["Yellow", "Red", "Blue", "Green"], "D", "Food leftovers are general (non-infectious) waste, which goes into the green bin.", "A"],
[33, "While giving care to a patient with Intravenous Infusion you observed that the fluid does not flow and the site of injection is swollen. Your immediate actions will be:", ["Stop the infusion and remove the cannula", "Insert another cannula and report to in-charge", "Call for help and prepare infusion tray", "Massage the swollen site and apply bandage"], "A", "Swelling with no flow is infiltration. Stop the infusion and remove the cannula, then re-site it.", "A"],
[34, "You are preparing chlorine solution for decontamination of used equipment. Which of the following strengths of chlorine solution will you use for soaking the used equipment?", ["1:5 parts", "1:6 parts", "1:7 parts", "1:8 parts"], "A", "Per the paper's key, the strength is 1:5 (one part stock to five parts water).", "A"],
[35, "You are working at emergency department where you meet baby Belinda who has drunk kerosene. Which of the following immediately nursing interventions will you do to the child so as to rescue his life?", ["Give orange juice", "Give boiled milk", "Give soft porridge", "Give plenty of fluid"], "B", "The paper's key gives milk. Never induce vomiting. Current practice is to keep the child calm and refer urgently.", "A"],
[36, "You are providing nursing care to a patient who has just returned to the ward from operating theatre. Which of the following nursing interventions will you perform first?", ["Observe infusion site", "Check blood pressure", "Check incision site", "Check breathing pattern"], "D", "Airway and breathing come first (ABC) after anaesthesia.", "A"],
[37, "Mr Yokohama a known diabetic patient was brought to you in hypoglycemic coma state. Which of the following nursing interventions will you take immediately?", ["Insert normal saline infusion", "Give ringer's lactate solution", "Administering intravenous glucose", "Provide dextrose saline"], "C", "Hypoglycaemic coma needs intravenous glucose at once to restore blood sugar and protect the brain.", "A"],
[38, "You are feeding Mr. Gombe who was diagnosed to have aspiration pneumonia, he begins to cough and is having difficulty breathing. Which of the following nursing interventions will you implement as a priority?", ["Suck patient's mouth", "Change patient to tube feeding", "Apply oxygen via nasal cannula", "Turn the patient to the side"], "D", "Stop feeding and turn him to the side so food drains from the airway, then suction and give oxygen.", "A"],
[39, "On assessing Mr. Sinjaa 86 years old you concluded that he has impaired breathing pattern related to inflammation of the lungs. Which of the following signs and symptoms Mr. Sinjaa presented that lead you to the nursing diagnosis?", ["Productive cough and fever", "Wheezing sound and chest tightness", "Blood stained sputum and sweating", "Nose flaring and blowing"], "B", "Wheezing and chest tightness show narrowed airways and altered breathing pattern, as in the key.", "A"],
[40, "You received Mrs. Mwata coming from operating theatre following tonsillectomy. Which one of the following signs will alert you that she is bleeding internally?", ["Coughing frequently", "Continuously sneezing", "Excessive swallowing", "Wheezing sound"], "C", "Frequent swallowing signals blood trickling down the throat after tonsillectomy.", "A"],
[41, "You are working in surgical ward with first year student nurses who are undergoing practicum learning. Which of the following nursing procedures will you assign the students to perform?", ["Perform nasal irrigation", "Wound incision", "Care underwater seal drainage", "Checking vital signs"], "D", "First-year students are assigned simple, low-risk tasks such as vital signs.", "B"],
[42, "You are providing care to Mr. Chilimo who is diagnosed with staphylococcal food poisoning and has frequency bowel movement. Which of the following patient's problems will you give immediate attention?", ["Fluid volume deficit", "Abdominal distension", "Altered food intolerance", "Altered body comfort"], "A", "Diarrhoea and vomiting cause dehydration, the life-threatening problem.", "B"],
[43, "What would be your nursing diagnosis for Mr. Jumbi who is brought in surgical ward on a stretcher with history of severe pain on the left leg following motorcycle accident?", ["Impaired swelling due to immobilization", "Impaired physical mobility related to pain and swelling", "Altered muscular skeleton system", "Ineffective normal daily function related to pain on the affected area"], "B", "Impaired physical mobility related to pain and swelling is a correctly written nursing diagnosis.", "B"],
[44, "Mr. Toti admitted in Medical ward due to acute respiratory distress, complaining with severe chest pain and difficulty in breathing. What will be your priority intervention for him?", ["Give analgesics to relieve pain", "Lie the patient on recumbent position with lower limbs flexed", "Administer oxygen through nasal cannula 1 liters per minutes to relieve chest tightness", "Lie patient in a sitting up position while lying his chest slightly forward"], "C", "Oxygen therapy treats hypoxia first and is the priority; positioning follows.", "B"],
[45, "You are preparing to administer medication via a nasogastric tube. Which one of the following interventions will you start with?", ["Check the patient's residual volume", "Flush the tubing with water", "Assess and verify the tube placement", "Pour medication into the syringe barrel"], "C", "Always confirm correct tube placement first to prevent giving drugs into the lungs.", "B"],
[46, "You are preparing an emergency tray for resuscitation to Mr. Colin who is having cardiac arrest. Which type of medicine will you put in the tray?", ["Lidocaine", "Epinephrine", "Atropine", "Adrenaline"], "B", "Epinephrine (adrenaline) is the first-line drug in cardiac arrest; the key marks epinephrine.", "B"],
[47, "After triaging four patients at the emergency department, you decided to give care according to your observations. Which of the following patients will you give first priority?", ["A 2 years old patient who has croup and crying vigorously", "A 6 year old patient who has developed reaction after administering intravenous X-Pen injection", "A 10 year old patient who has a fracture of the right ulna", "A 12 years old patient who has lower abdominal cramping after feeding"], "B", "A reaction to injected penicillin may be anaphylaxis, which threatens airway and circulation.", "B"],
[48, "You are caring a 4 years old boy who is admitted with partial superficial thickness burns on the thigh and treated under open method. Which of the following actions will you take when caring for the patient?", ["Use sterile water during debridement of the wound", "Wear a cap, mask, gown and gloves during patient contact", "Use sterile gloves during changing of patient's bed linens and to remove dressing", "Apply sterile gauze with prescribed topical antimicrobial ointment to enhance wound healing"], "B", "In the open method the wound is exposed, so staff wear protective gear to prevent infection.", "B"],
[49, "You are giving advice to Mrs. Changlai who has been discharged after recovery from peptic ulcer disease. Which of the following information will you give her?", ["Take medication as prescribed to cure the ulcer", "Use acetylsalicylic acid (aspirin) for pain", "Place head of the bed on blocks to prevent reflux", "Eat six small plain feedings daily to prevent attack"], "D", "Small frequent bland meals avoid acid overload; aspirin is an ulcer irritant.", "B"],
[50, "You are teaching Ms. Chuwi on the side effect of iron tablets. Which of the following statements indicate to you that the patient has understood the side effects you have taught her?", ["I will bring a stool specimen every week to the doctor", "I should take my iron tablet with vitamin D capsules", "It would be best if I took my medication with meals only", "I may notice my stool turning to greenish black colour"], "D", "Iron normally darkens the stool; knowing this prevents alarm.", "B"],
[51, "You are caring 34-year-old woman is admitted in medical ward with pneumonia. Which of the following patient's problems will you address first basing on priority of care?", ["Altered body temperature", "Disturbed comfort", "Impaired breathing pattern", "Knowledge deficit"], "C", "Breathing is the first priority (ABC).", "B"],
[52, "You are caring for Mama Kinao with acute glomerulonephritis. Which of the following nursing implications will you consider while planning care for her?", ["Increase fluid intake", "Decrease sodium intake", "Increase potassium intake", "Decrease carbohydrate intake"], "B", "Sodium restriction limits oedema and hypertension caused by fluid retention.", "B"],
[53, "You are teaching first year student nurses on planning nursing care to Mr. Alie who has diabetic nephropathy. Which of the following nursing measures will you include in the plan?", ["Increase protein in diet", "Restrict protein intake", "Increase potassium intake", "Decrease potassium intake"], "B", "Restricting protein lowers the nitrogen load on the damaged kidneys.", "B"],
[54, "You are preparing Mr. Kowaki for laparotomy. Which of the following nursing intervention will you take to prevent hypostatic pneumonia?", ["Instruct patient on walking exercises", "Educate patient on loud speaking exercises", "Encourage patient on squatting exercises", "Teach patient on coughing exercises"], "D", "Pre-operative teaching of deep breathing and coughing keeps the airways clear afterwards.", "B"],
[55, "You are caring for Mr. Yuu who has a history of passing scanty and concentrated urine following diarrhea and vomiting for three days. Which of the following nursing interventions will you perform to evaluate patient's fluid status?", ["Check vital signs", "Assess skin turgor", "Check daily body weights", "Observe abdominal distention"], "C", "Daily weight is the most accurate measure of fluid gain or loss.", "B"],
[56, "When assessing Mr. Jaii 64 years old, you noted that he has generalized body edema, blood pressure 170/110 mmHg and body temperature of 36.7° C. Which of the following diet will you recommend to this patient?", ["Consume more minerals diet", "Take high protein diet", "Use high carbohydrate diet", "Eat nutritive low salt diet"], "D", "Oedema with hypertension calls for a nutritious low-salt diet.", "B"],
[57, "During preparation of Chiddy a 12-year-old child for appendectomy, the parents bring in the priest to pray for the child. The time for surgery was due while they were praying. Which of the following actions will you take without causing trouble?", ["Gently tell parents to stop praying so that the child can be taken to theatre", "Gently give the parents and priest time they need for prayers prior to theatre", "Gently tell parents the child could die from ruptured appendix if surgery is delayed", "Gently permit the parents and priest to stay and pray as the child goes to theatre"], "B", "Respecting spiritual needs with a brief delay builds trust and reduces anxiety.", "B"],
[58, "You are administering prescribed quinine injection to Mr. Rabii through intravenous infusion; suddenly he develops hypotension, cyanosis, and tachycardia. Which of the following immediate actions will you take to save him?", ["Call the ward in charge and physician", "Clamp the tubing and administer oxygen", "Raise the head and foot of the bed", "Slow the infusion and lay the patient flat"], "B", "Stop the infusion by clamping, and give oxygen: this is a reaction to quinine and needs urgent support.", "B"],
[59, "Mr. Tatuu reported at Care and Treatment Center for HIV testing. Which of the following action will you perform first?", ["Conduct Pre-test counseling", "Conduct Couple counseling", "Conduct Post-test counseling", "Conduct Group counseling"], "A", "Pre-test counselling comes first, before the test, and gives information and consent.", "B"],
[60, "You received Mr. Janja 68 years old at the dispensary with history of falling down and complaining of pain and swelling of his knee joint. Which of the following measures will you take as the first aid measures?", ["Apply plaster of Paris", "Apply traction", "Apply crepe bandage", "Put back slab"], "C", "A crepe bandage supports a sprained, swollen knee without immobilizing it.", "B"],
[61, "You received Mrs. Pilaku at outpatient department with insect lodged in the ear. Which of the following actions will you take to dislodge the insect?", ["Irrigate the ear with water", "Apply suction to the ear", "Instill the ear with mineral oil", "Blow in air to the ear"], "C", "Mineral oil suffocates and floats out a live insect lodged in the ear.", "B"],
[62, "During changing over shift you found Mrs. Sewaji severely convulsing and biting of the tongue. Which of the following immediate nursing intervention will you take to reduce the convulsions?", ["Shift patient from the bed to the floor", "Place padded spatula between patient's teeth", "Restrict the patient movement out of bed", "Give phenobarbitone injection intramuscularly"], "B", "Protect the tongue and head during the convulsion; never restrain the movements.", "B"],
[63, "You are assigned to care of patient with a chest tube following chest surgery. Which of the following precautions will you take to ensure patient's safety?", ["Encourage patient to take adequate chest exercise", "Secure the drainage container in an upright position", "Stripping or milking the chest tube to promote drainage", "Lie patient in a semi fowlers and insist patient to cough and deep breathe every 2 hours"], "B", "The drainage container is kept secured below the chest to maintain the water seal.", "B"],
[64, "You are performing Cardio-Pulmonary Resuscitation (CPR) to Mr. Agisye at casualty department. Which of the following cycle of actions will you follow?", ["15 chest compression, then 1 effective artificial breath until help arrive", "15 chest compression, then 2 effective artificial breath until help arrive", "15 chest compression, then 3 effective artificial breath until help arrive", "15 chest compression, then 4 effective artificial breath until help arrive"], "B", "The ratio in the key is 15 compressions to 2 effective breaths.", "B"],

Q.sort((a,b)=>a[0]-b[0]);
const secOf=n=>S.find(s=>s[0]===(Q.find(q=>q[0]===n)||[])[5]);
const st={a:{},f:new Set(),i:0,sec:null,done:false};
const K="tnmcle2017_v1";
function save(){try{localStorage.setItem(K,JSON.stringify({a:Object.fromEntries(Object.entries(st.a).map(([i,v])=>[Q[i][0],v])),f:[...st.f].map(i=>Q[i][0]),n:Q[st.i][0],done:st.done}))}catch(e){}}
try{const d=JSON.parse(localStorage.getItem(K)||"null");if(d){const ix=n=>Q.findIndex(q=>q[0]==n);for(const[n,v]of Object.entries(d.a||{})){const j=ix(n);if(j>=0)st.a[j]=v}for(const n of d.f||[]){const j=ix(n);if(j>=0)st.f.add(j)}const j=ix(d.n);if(j>=0)st.i=j;st.done=!!d.done}}catch(e){}
function resetAll(){try{localStorage.removeItem(K)}catch(e){}location.reload()}
const $=id=>document.getElementById(id);
function side(){save(); $("secs").innerHTML='<div class="mu" style="margin-bottom:6px">Sections</div>'+S.map(s=>{const k=Q.filter(q=>secOf(q[0])===s).length;return `<button class="sec ${st.sec===s[0]?'on':''}" onclick="goSec('${s[0]}')" ${k?'':'disabled'}>${s[0]}: ${s[1]} <span class="mu">(${k?k+' loaded':'not loaded'})</span></button>`}).join("")+`<button class="sec ${st.sec===null?'on':''}" onclick="goSec(null)">All questions</button>`;
 $("grid").innerHTML=Q.map((q,i)=>{let c=[];if(st.done){c.push(st.a[i]===undefined?'':st.a[i]===q[3]?'c':'w')}else if(st.a[i]!==undefined)c.push('ans');if(st.f.has(i))c.push('flg');if(i===st.i)c.push('cur');return `<button class="${c.join(' ')}" onclick="go(${i})">${q[0]}</button>`}).join("");
 const n=Object.keys(st.a).length;$("pb").style.width=n/Q.length*100+"%";$("cnt").textContent=`${n} / ${Q.length} answered`}
function goSec(l){st.sec=l;if(l){const i=Q.findIndex(q=>secOf(q[0])[0]===l);if(i>=0)st.i=i}render()}
function go(i){st.i=i;st.sec=secOf(Q[i][0])[0];if(st.done&&view==="review")return render();view=st.done?"review":"exam";render()}
let view="exam",rf="all";
function opts(i,rev){const q=Q[i];return q[2].map((t,k)=>{const L="ABCD"[k];let c="opt";if(rev){if(L===q[3])c+=" ok";else if(st.a[i]===L)c+=" bad";}else if(st.a[i]===L)c+=" sel";return `<div class="${c}" ${rev?'':`onclick="pick(${i},'${L}')"`}><b>${L}.</b><span>${t}${rev&&L===q[3]?' ✓':''}${rev&&st.a[i]===L&&L!==q[3]?' ✗ (your answer)':''}</span></div>`}).join("")}
function pick(i,L){st.a[i]=L;render()}
function flag(i){st.f.has(i)?st.f.delete(i):st.f.add(i);render()}
function render(){side();if(view==="result")return;const m=$("m");
 if(view==="review"){m.innerHTML=`<div class="row" style="margin-bottom:10px">${[["all","All"],["wrong","Wrong"],["none","Unanswered"],["flag","Flagged"]].map(([k,l])=>`<button class="${rf===k?'p':''}" onclick="rf='${k}';render()">${l}</button>`).join("")}</div>`+Q.map((q,i)=>{const ok=st.a[i]===q[3];if(rf==="wrong"&&(ok||st.a[i]===undefined))return"";if(rf==="none"&&st.a[i]!==undefined)return"";if(rf==="flag"&&!st.f.has(i))return"";return `<div class="card"><div class="mu">Q${q[0]} · Section ${secOf(q[0])[0]} · ${st.a[i]===undefined?'Unanswered':ok?'Correct':'Incorrect'}</div><div class="q">${q[1]}</div>${opts(i,true)}<div class="rat"><b>Correct answer: ${q[3]}.</b> ${q[4]}</div></div>`}).join("")+`<div class="row"><button onclick="showRes()">Back to results</button></div>`;return}
 const i=st.i,q=Q[i],list=Q.map((x,k)=>k).filter(k=>!st.sec||secOf(Q[k][0])[0]===st.sec),p=list.indexOf(i);
 m.innerHTML=`<div class="card"><div class="row"><span class="mu" style="flex:1">Question ${q[0]} of 180 · Section ${secOf(q[0])[0]}: ${secOf(q[0])[1]}</span><button onclick="flag(${i})">${st.f.has(i)?'⚑ Flagged':'⚐ Flag for review'}</button></div><p class="q">${q[1]}</p>${opts(i,false)}<div class="row" style="margin-top:10px"><button onclick="go(${list[p-1]})" ${p<=0?'disabled':''}>← Previous</button><button class="p" onclick="go(${list[p+1]})" ${p>=list.length-1?'disabled':''}>Next →</button></div></div><div class="mu">Flagged: ${[...st.f].map(k=>'Q'+Q[k][0]).join(', ')||'none'}</div>`}
function stats(){return S.map(s=>{const qs=Q.map((q,i)=>i).filter(i=>secOf(Q[i][0])===s);const c=qs.filter(i=>st.a[i]===Q[i][3]).length;return{s,n:qs.length,c,pct:qs.length?c/qs.length*100:null}})}
const TIPS={A:"Drill the nursing process phases, ABC prioritization, fluid/IV calculations and first-aid triage; practise ‘first action’ questions.",B:"Revise pre/post-operative care, shock, renal, cardiac and respiratory conditions; link each sign to its pathophysiology and priority nursing diagnosis.",C:"Study outbreak investigation steps, IMCI classifications, immunization targets, epidemiology formulas (median, fatality rate) and community assessment sequence.",D:"Rehearse the partograph, third-stage management, PPH, obstetric emergencies, newborn care and PMTCT/family planning protocols.",E:"Review mental status exam terminology, therapeutic communication, delusion types and safety interventions for psychiatric emergencies.",F:"Learn leadership styles, communication directions, delegation rules, supervision tools, budgets and conflict-resolution modes."};
function showRes(){view="result";const r=stats(),tot=Q.length,sc=Q.filter((q,i)=>st.a[i]===q[3]).length/2,max=tot/2;
 $("m").innerHTML=`<div class="card"><div class="mu">Final score (${tot} loaded questions × 0.5 mark)</div><div class="big">${sc} / ${max} Marks</div><div>${(sc/max*100).toFixed(1)}%</div></div>
 <div class="card"><b>Section breakdown</b><table><tr><th>Section</th><th>Correct</th><th>Marks</th><th>%</th></tr>${r.map(x=>x.n?`<tr><td>${x.s[0]}: ${x.s[1]}</td><td>${x.c}/${x.n}</td><td>${x.c/2}/${x.n/2}</td><td class="${x.pct<50?'lo':''}">${x.pct.toFixed(0)}%</td></tr>`:`<tr><td>${x.s[0]}: ${x.s[1]}</td><td colspan="3" class="mu">No questions loaded</td></tr>`).join("")}</table></div>
 <div class="card"><b>Recommendations Report</b>${(()=>{const w=r.filter(x=>x.n&&x.pct<50);return(w.length?w.map(x=>`<p><b class="lo">${x.s[1]} (${x.pct.toFixed(0)}%)</b><br>${TIPS[x.s[0]]} Re-attempt the missed items in Review Mode and write a one-line rule for each.</p>`).join(""):`<p>No section is below 50%. Keep sharpening with timed practice (about 1 minute per question) and re-read rationales for every miss.</p>`)+`<p class="mu">General: flagged questions (${st.f.size}) show where confidence is low; revisit those first.</p>`})()}</div>
 <div class="row"><button class="p" onclick="view='review';render()">Open Review Mode</button><button onclick="resetAll()">Restart exam</button></div>`}
function doSubmit(){st.done=true;$("sub").textContent="View Results";showRes();side()}
$("sub").onclick=()=>{const n=Object.keys(st.a).length;if(st.done)return showRes();view="confirm";side();$("m").innerHTML=`<div class="card"><b>Submit exam?</b><p>You have answered ${n} of ${Q.length} questions. You cannot change answers after submitting.</p><div class="row"><button class="p" onclick="doSubmit()">Yes, submit</button><button onclick="view='exam';render()">Cancel</button></div></div>`};
if(st.done){$("sub").textContent="View Results";side();showRes()}else render();
</script></body></html>
