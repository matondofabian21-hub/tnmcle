<style>
:root{--bg:#f6f7f9;--sf:#fff;--tx:#1b2430;--mu:#5d6b7c;--bd:#d8dee6;--ac:#0f6e56;--ok:#d9f2e4;--okb:#1b8a50;--no:#fbe0e0;--nob:#c23b3b;--fl:#f3b63f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12171d;--sf:#1b222b;--tx:#e8edf3;--mu:#97a4b4;--bd:#2f3946;--ac:#3fbf9c;--ok:#16372a;--okb:#3fbf7c;--no:#3d1c1c;--nob:#e06a6a}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--sf);border-bottom:1px solid var(--bd);padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:16px;margin:0;flex:1;min-width:180px}.bar{height:8px;background:var(--bd);border-radius:4px;flex:1 1 100%;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .2s}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:8px;padding:7px 12px}button.p{background:var(--ac);border-color:var(--ac);color:#fff}button:disabled{opacity:.4}
.wrap{display:flex;gap:14px;padding:14px;max-width:1100px;margin:auto}nav{width:230px;flex:none}main{flex:1;min-width:0}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.sec{display:block;width:100%;text-align:left;margin-bottom:6px;font-size:13px}.sec.on{border-color:var(--ac);outline:1px solid var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px}.grid button{padding:5px 0;font-size:12px}
.grid .ans{background:var(--ac);color:#fff;border-color:var(--ac)}.grid .flg{box-shadow:inset 0 -4px 0 var(--fl)}.grid .cur{outline:2px solid var(--tx)}.grid .c{background:var(--ok);border-color:var(--okb);color:var(--tx)}.grid .w{background:var(--no);border-color:var(--nob);color:var(--tx)}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin:8px 0;cursor:pointer}.opt.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent)}
.opt.ok{background:var(--ok);border-color:var(--okb)}.opt.bad{background:var(--no);border-color:var(--nob)}.opt b{min-width:20px}
.q{font-size:16px;font-weight:600}.mu{color:var(--mu);font-size:13px}.rat{border-left:4px solid var(--ac);padding:6px 10px;margin-top:8px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.big{font-size:34px;font-weight:700}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px}.lo{color:var(--nob);font-weight:600}

<header><h1>TNMCLE RN0029:2023 – Registration Nurses</h1><span id="cnt" class="mu"></span><button id="sub" class="p">Submit Exam</button><div class="bar"><i id="pb"></i></div></header>
<div class="wrap"><nav><div class="card" id="secs"></div><div class="card"><div class="mu" style="margin-bottom:6px">Question grid</div><div class="grid" id="grid"></div><div class="mu" style="margin-top:8px">Filled = answered · gold underline = flagged</div></div></nav><main id="m"></main></div>
<script>
const S=[["A","Basic Nursing",1,40],["B","Medical Surgical Nursing",41,76],["C","Community Health Nursing",77,96],["D","Midwifery & Child Health",97,136],["E","Mental Health Nursing",137,160],["F","Leadership & Management",161,180]];
// [no, text, [A,B,C,D], answer, rationale] — add the remaining paper questions here in the same format.
const Q=[
[3,"Which symptom in Mr. Madu’s first 24 hours after a percutaneous liver biopsy indicates a complication?",["Anorexia, nausea and vomiting","Pain and itching at the biopsy site","Pulse 112, BP 100/60, respiration 20","Abdominal distension and discomfort"],"C","Tachycardia with falling BP signals internal haemorrhage, the main complication of liver biopsy."],
[5,"Which method of abdominal examination is performed second?",["Percussion","Auscultation","Palpation","Inspection"],"B","Abdominal order: inspection, auscultation, percussion, palpation, so that palpation does not alter bowel sounds."],
[7,"Mr. Wakosi’s stool is clay coloured. Which diagnosis will you suggest to the physician?",["Pancreatitis","Appendicitis","Colitis","Hepatitis"],"D","Clay stools mean absent bile pigment (stercobilin) from hepatobiliary obstruction or dysfunction, as in hepatitis."],
[10,"Which intervention applies specifically to a patient with an endotracheal tube?",["Examine the patient’s lungs","Smooth the larynx with lubricant","Give adequate fluids","Ensure the endotracheal tube is safely secured"],"D","Accidental extubation or tube migration is the tube-specific risk, so securing it is priority."],
[12,"Priority action for a patient on blood transfusion who develops chills and headache?",["Stop the transfusion immediately and report","Give analgesics to reduce pain","Slow the rate of transfusion","Check vital signs"],"A","Chills and headache suggest a transfusion reaction. Stop the transfusion first, keep the line open with saline, then check vitals and report."],
[13,"Mr. Mpera, 72, has not passed urine for three days and has a distended lower abdomen. First nursing intervention?",["Open nearby tap water","Aspirate bladder with a syringe","Place him in dorsal position","Insert an indwelling catheter"],"D","Acute retention is relieved by catheterization under aseptic technique."],
[14,"A 4-year-old boy with hypothermia is classified as an emergency. Which intervention first?",["Ask junior nurse to prepare porridge","Cover the boy with warm linen","Take frequent oral body temperature","Educate family on management of hypothermia"],"B","Stop further heat loss and rewarm passively first; feeding and teaching come later."],
[15,"Miss Naina has clubbed fingers on both hands. Which disease do you suspect?",["Chronic hypertension","Chronic diabetes mellitus","Chronic renal failure","Chronic heart disease"],"D","Clubbing results from chronic hypoxia, seen in chronic cardiopulmonary disease."],
[16,"How will you teach students to detect a pressure sore?",["Ask the patient if he or she has sores","Observe facial reaction during bed making","Assess patient bedding during bed making","Assess patient skin integrity during bed making"],"D","Skin inspection at bed-making (especially over bony prominences) is the direct way to find early breakdown."],
[17,"Which statement shows Mr. Liguo can legally undergo prostatectomy?",["“Mr. Liguo had an opportunity to ask questions”","“Mr. Liguo’s decision was made without pressure”","“Mr. Liguo signed the consent form by himself”","“Mr. Liguo’s physical examination results are normal”"],"C","The signed informed consent is the legal document; the other options are components of it but not proof."],
[19,"What is the purpose of the planning phase of the nursing process?",["Identify the patient’s goals and appropriate nursing interventions","Determine the extent to which goals have been achieved","Identify health care needs and prepare diagnostic statements","Carry out planned interventions"],"A","Planning = setting priorities, goals/outcomes and interventions. B is evaluation, C is diagnosis, D is implementation."],
[22,"Which assessment is usually completed on admission of a client to a health agency?",["Model assessment","Focused assessment","Ongoing assessment","Comprehensive assessment"],"D","Admission calls for a comprehensive (complete database) assessment."],
[23,"Miss Makuti had endoscopy 30 minutes ago and asks for water. What will you do?",["Offer the drink of water","Give small sips of water","Tell that drinks are not allowed","Wait until her gag reflex is functioning"],"D","Throat anaesthesia suppresses the gag reflex; feeding before it returns risks aspiration."],
[24,"Which principle applies when you know true facts about a patient but do not expose them to anybody?",["Confidentiality","Veracity","Fidelity","Privacy"],"A","Confidentiality is non-disclosure of patient information."],
[25,"Deficiency effects: reproductive failure, haemolysis of red cells and muscular dystrophy. Which vitamin is lacking?",["Vitamin A","Vitamin B","Vitamin D","Vitamin E"],"D","Vitamin E is an antioxidant protecting cell membranes; deficiency causes haemolytic anaemia, myopathy and reproductive failure."],
[26,"Mrs. Chikodu is recovering from anaesthesia after appendectomy, rolling, rubbing her limbs and complaining of pain. Immediate intervention?",["Assess for pain and bleeding","Administer a narcotic if ordered","Call the doctor to review","Observe without disturbing her"],"A","Restlessness post-op may signal pain or haemorrhage/hypoxia; assess before medicating."],
[28,"Mr. Mandi in ICU has blood glucose 38 mmol/L. Which acid-base imbalance?",["Electrolyte imbalance","Metabolic acidosis","Metabolic alkalosis","Metabolic failure"],"B","Severe hyperglycaemia causes ketone production (DKA) and hence metabolic acidosis."],
[31,"Baby’s temperature: 39 °C at 2 pm, 36.5 °C at 8 pm, 40 °C at 2 am. Type of fever?",["Relapsing fever","Constant fever","Remittent fever","Intermittent fever"],"D","Intermittent fever swings between fever and normal temperature within 24 hours; remittent fever never returns to normal."],
[32,"3,000 ml of 0.9% saline in 24 h with a 15 drops/ml set. Drops per minute?",["15","31","28","42"],"B","3000 × 15 ÷ (24 × 60) = 31.25, about 31 drops/min."],
[34,"Which action prevents hospital-acquired infection?",["Clean patient beddings and belongings","Encourage staff to avoid coughing near patients","Give penicillin to all suspected infections","Wash hands before and after handling the patient"],"D","Hand hygiene is the single most effective measure against cross-infection."],
[35,"Mr. Kombe has a fractured right humerus. All are appropriate EXCEPT:",["Check airway, breathing and circulation","Support the injured part with a hand or rolled blanket","Immobilize the arm against the trunk using a splint","Lay the patient flat and apply Plaster of Paris"],"D","POP is applied by trained staff after assessment and reduction, not as first aid in casualty."],
[36,"Which is the rationale of triage?",["It is a hierarchy based on potential for loss of life","It gives all victims equal priority","It follows first in, first served","It is a routine in all emergency departments"],"A","Triage prioritizes by urgency and survivability, not arrival order."],
[38,"Mr. Cheka is in distress from retained tracheal secretions and cannot cough effectively. First intervention?",["Perform tracheal suctioning","Ask the patient to drink water","Advise coughing exercises","Encourage the patient to cough"],"A","The patient cannot clear the airway himself, so suction removes secretions and restores patency."],
[40,"Mr. Chengu is likely to become dehydrated after frequent watery stools. Which category is this nursing diagnosis?",["Actual","Wellness","Potential (risk)","Syndromic"],"C","“Likely to” / “at risk for” statements are potential (risk) nursing diagnoses."],
[45,"Sr. Kituko’s sputum is still TB positive after six consecutive months of treatment. Intervention?",["Schedule another six months of TB treatment","Arrange directly observed therapy by a responsible family member or public health nurse","Schedule more teaching sessions until he understands risks of non-compliance","Have a recovered TB patient tell him about successful treatment"],"B","Persistent positivity suggests non-adherence or resistance; supervised dosing (DOT) ensures drugs are actually taken."],
[46,"Which signs and symptoms would you score as correct for acute renal failure?",["Increasing urine output, generalized oedema, insomnia, anxiety","Decreased fluid retention, emaciation, night sweats, confusion","Reduced urine output, swelling of ankles, cheeks and feet","Moderate urine output, painful micturition, swollen bladder"],"C","Oliguria with fluid retention (periorbital and ankle oedema) is the hallmark of acute renal failure."],
[50,"You give a low-purine diet to Mr. Dere (gout) and Mr. Tukio (kidney stones). The goal is to decrease:",["Serum levels of uric acid","Possibility of constipation","Retention of fluids","Cholesterol levels"],"A","Purines are metabolized to uric acid, which causes gout and uric-acid stones."],
[51,"What would you expect of Rumi, 9 years, exploring his concept of death?",["Death is a temporary state of sleep","Death just happens","Death is a final process","Death is punishment for being bad"],"C","From about 9–10 years, children understand death as final, universal and irreversible."],
[52,"Key component of a quality assurance programme in nursing practice?",["Acuity system for client satisfaction","Determination of criteria to meet standards","Case management for continuity of care","Patient satisfaction questionnaire"],"B","QA starts by setting standards and criteria against which care is measured."],
[53,"Which task can be safely delegated to a health attendant?",["Evaluate voiding pattern after catheter removal","Obtain dietary history from a client with peptic ulcer","Assist a patient with first colostomy irrigation","Obtain a stool specimen from a client with diarrhoea"],"D","Assessment, evaluation and teaching stay with the nurse; specimen collection is a routine, low-risk task."],
[54,"In a care plan you wrote “Observe bleeding at site of incision.” This statement is the nurse’s:",["Objective","Goal","Diagnosis","Intervention"],"D","An action the nurse performs is a nursing intervention."],
[57,"Mr. Bonanza, 75, has frequent hard stools from poor diet. Which foods will you plan?",["Cassava, banana, green vegetables, beans","Meat, orange, maize, green vegetables","Milk, green vegetables, pawpaw and plenty of fluids","Bread, fish, green vegetables, yam"],"C","Fibre-rich vegetables and fruit plus ample fluids soften stool; cassava and unripe banana are constipating."],
[59,"Mrs. Muti is on peritoneal dialysis. What benefit do you tell her husband?",["Filters excessive chemicals and bacteria from the kidneys","Reduces higher blood cholesterol and metabolic acid","Reduces overloaded fluids and worn-out blood cells","Removes waste products and excess fluids from the body"],"D","Dialysis substitutes for kidney function by removing wastes and excess fluid."],
[60,"Verifying 200 mg Ampicillin for Mr. Dawa, what do you check first?",["Expiring date","Chart to see whether the medicine was ordered","Route of delivery","Patient’s name against the medicine"],"B","Never give a drug without a valid order; verify the prescription before the other rights."],
[61,"Care for a patient with right hemiplegia after stroke to aid recovery:",["Instruct to stay in bed most of the time","Send to a long-term care facility","Assist in performing a range of exercises","Hold the left extremities during movements"],"C","Early range-of-motion exercises prevent contractures and promote recovery."],
[64,"Changes oral medicines undergo after contact with body fluids so the body can use them:",["Transference","Elimination","Absorption","Concentration"],"C","Absorption moves the drug from its site of administration into the bloodstream."],
[65,"Nursing management for Mr. Katikare with herpes zoster includes:",["Administer herpes zoster immunization","Expect lesions in the perineal area","Apply antifungal cream","Place on contact precautions"],"D","Zoster is viral; vesicle fluid is infectious, so contact precautions (airborne if disseminated) apply. Antifungals and vaccination are inappropriate."],
[66,"Priority finding after assessing a patient with burns to the face and neck?",["Increased thirst","Scattered large vesicles","Difficulty with vision","Increased respiration"],"D","Facial/neck burns threaten the airway through oedema and inhalation injury; airway comes first."],
[67,"Health talk to Mr. Hofu on effects of cigarette smoking will include:",["COPD and muscle atrophy","COPD and lung cancer","COPD and hepatic failure","COPD and pancreatic failure"],"B","Smoking is the major cause of COPD and lung cancer."],
[70,"Which statement do you anticipate in the history of Mr. Gemas with query duodenal ulcer?",["Recent progressive weight loss","Awakening with pain at night","Increasing indigestion after meals","Episodes of nausea and vomiting"],"B","Duodenal ulcer pain occurs when the stomach is empty, often at night, and is relieved by food; gastric ulcer pain follows meals with weight loss."],
[73,"Why instruct Mrs. Siwapati with PID to sleep with head elevated about 45°?",["Allows coughing and deep breathing","Decreases abdominal muscle tension","Assists to localize drainage in the lower abdomen","Prevents inflammation of the fallopian tubes"],"C","Semi-Fowler’s lets pelvic exudate gravitate to the pouch of Douglas, away from the upper abdomen."],
[76,"Which reactions indicate pain’s sympathetic responses?",["Increased blood pressure, respiration and pulse rate","Increased urination, headache and pulse rate","Decreased blood pressure, pulse and temperature","Decreased blood pressure, nausea and vomiting"],"A","Acute pain triggers fight-or-flight: raised BP, pulse and respiration. Parasympathetic pain causes low BP, nausea and vomiting."],
[80,"Majority of Mitohu pupils have Schistosoma eggs in urine. Besides using latrines, your advice is to:",["Avoid swimming in ponds","Declare strict quarantine","Wear shoes","Drink boiled water"],"A","Schistosomiasis is acquired through skin contact with water containing cercariae; avoiding infested water, plus latrine use, breaks transmission."],
[83,"Which environmental information from Mbaa community falls under the social environment?",["Number of schools, colleges, vocational institutes, temples, churches and mosques","Total population, total families, morbidity rate, number of infants","Houses, water supply, sanitation, electricity, toilets","Community halls, festivals, retired persons, family income, occupation"],"A","Social environment covers institutions and social structures (education, religion); housing and sanitation are physical environment, population data are demographic."],
[87,"Which statement by Zaiba shows she understood prevention of TB spread?",["“I must isolate myself from my family members”","“I should always cover my mouth and nose when sneezing”","“I will burn my old clothes when I return home”","“I have to use separate utensils whenever I am served meals”"],"B","TB spreads by droplets, so respiratory hygiene (covering mouth and nose) is the key measure; isolation, burning clothes and separate utensils are unnecessary."],
[89,"Which signs and symptoms guide the action plan for Mr. Kachunda’s child with kwashiorkor?",["Night blindness, dry conjunctiva, anaemia, angular stomatitis","Red beefy tongue, diarrhoea, haemorrhage, curved bent bones","Low body weight, oedema and excessive subcutaneous fat","Apathetic, face like an old man, lack of subcutaneous fat"],"C","Kwashiorkor shows oedema with some retained subcutaneous fat; marasmus shows an ‘old man’ face and wasting."],
[90,"Days absent due to malaria: 18, 25, 20, 1, 2, 3, 5, 6, 7, 7, 3, 4, 10, 12, 9, 7, 9, 10, 30, 15. What is the median?",["4 days","7 days","8 days","10 days"],"C","Sorted (n = 20): 1,2,3,3,4,5,6,7,7,7,9,9,10,10,12,15,18,20,25,30. Median = (7 + 9) ÷ 2 = 8."],
[93,"Which method prevents pregnancy and STIs best for teenagers?",["Consistent and correct use of condom","Use of spermicides during sexual act","Lactational amenorrhoea method","Billings ovulation method"],"A","Condoms are the only listed method that also gives dual protection against STIs including HIV."],
[95,"Mrs. Kasuga is treated for trichomonas vaginalis. Advice to prevent reoccurrence?",["Abstain until cured","Use condom when in contact with partner","Continue treatment if symptoms persist","Bring your sexual partner for treatment"],"D","Trichomoniasis is sexually transmitted; untreated partners cause reinfection, so both must be treated."],
[96,"In Mbuta village 2 of 20 people with cholera died last year. Fatality rate?",["5%","10%","15%","20%"],"B","Case fatality rate = deaths ÷ cases × 100 = 2 ÷ 20 × 100 = 10%."],
[97,"On admission in labour ward, fetal heart rate is below 110 bpm. Which intervention ensures fetal wellbeing?",["Ensure mother is well dehydrated","Take BP to assess for hypertension","Reassure the woman to ensure relaxation","Administer oxygen to the woman to improve fetal condition"],"D","Bradycardia indicates fetal hypoxia; maternal oxygen (with left lateral position) improves fetal oxygenation. Dehydration would worsen it."],
[98,"On the partograph, cervical dilatation moves to the right of the alert line. First action?",["Report to in-charge and consider transfer","Prepare woman for theatre","Lie the woman in her left lateral","Prepare woman for vaginal examination"],"A","Crossing the alert line signals slow progress; refer early to a facility able to manage it before the action line is reached."],
[103,"Characteristics of a normal full-term baby to tell a primigravida:",["2.0 kg, length 35 cm, head circumference 25 cm","3.0 kg, length 45 cm, head circumference 30 cm","3.5 kg, length 50 cm, head circumference 34 cm","2.5 kg, length 40 cm, head circumference 38 cm"],"C","Term newborn: about 3–4 kg, length about 50 cm, head circumference about 33–35 cm."],
[104,"Rationale for placing a jaundiced baby under phototherapy?",["The light changes yellow colour into normal","The light changes bilirubin so it can be excreted in urine and stool","The light increases baby’s body energy","Give glucose as much as possible"],"B","Light photo-isomerizes unconjugated bilirubin into water-soluble forms excreted without liver conjugation."],
[105,"Number-one objective when examining a pregnant woman at antenatal clinic?",["Give advice on diet","Identify at-risk pregnant women and manage accordingly","Prepare woman to deliver live baby safely","Prepare woman for caesarean section as necessary"],"B","Antenatal screening aims first to detect risk factors early so complications are prevented or referred."],
[108,"Which women are likely to develop postpartum haemorrhage?",["History of urinary tract infection","History of hyperemesis","History of grand multiparity","History of severe painful labour"],"C","Grand multiparity causes uterine atony (poor retraction), the commonest cause of PPH."],
[110,"Reassuring a mother whose 4-month-old is frothing and smiling all the time:",["The infant tries to hold head upright at 4 months","Bubbling makes the baby look different at 2–4 months","Use a soft towel to keep him dry","Language development starts at 4 months so bubbling is common"],"D","Cooing and bubbling are normal early speech development."],
[112,"Hamisa has cervix 2 cm dilated with severe pain; abruptio placentae suspected. Which additional sign confirms it?",["Greenish vaginal discharge","Excessive vaginal bleeding","Tetanic uterine contraction","Rigid, board-like abdomen"],"D","Concealed retroplacental bleeding makes the uterus hard and board-like and painful."],
[114,"Pregnant woman with sudden sharp lower abdominal pain, fewer contractions and fetal heart not heard. Suspect:",["Fetal distress","Maternal distress","Uterine rupture","Anaemia"],"C","Sudden tearing pain, cessation of contractions and loss of fetal heart sounds are classic for uterine rupture."],
[115,"Observations in scoring a newborn who looks tired immediately after delivery (Apgar):",["Heart rate, respiratory effort, muscle tone, reflex irritability and colour","Respiratory rate, reflex, irritability, muscle tone, colour, temperature","Heart rate, respiratory rate, colour, muscle tone, response to stimuli","Temperature, heart rate, colour, effort, response, muscle tone"],"A","Apgar = Appearance (colour), Pulse, Grimace (reflex irritability), Activity (tone), Respiration (effort)."],
[116,"First ANC visit at 14 weeks. When is the 2nd visit?",["20–24 weeks","22–26 weeks","24–28 weeks","28–32 weeks"],"A","Focused ANC schedule: 1st before 12–16 weeks, 2nd at 20–24, 3rd at 28–32, 4th at 36 weeks."],
[118,"Which manoeuvre delivers the after-coming head in breech?",["Mauriceau–Smellie–Veit","Lovset’s","Leopold’s","Zavanelli"],"A","Lovset delivers the shoulders/arms; Mauriceau–Smellie–Veit flexes and delivers the head. Leopold is palpation; Zavanelli replaces the head."],
[120,"For how long should the mother exclusively breastfeed?",["First twelve months","First eight months","First six months","First four months"],"C","WHO recommends exclusive breastfeeding for the first six months."],
[121,"Finding on vaginal exam confirming cord presentation:",["Hard pulsating mass in front of presenting part, intact membranes","Hard pulsating mass, ruptured membranes","Soft pulsating mass in front of presenting part, intact membranes","Soft pulsating mass, ruptured membranes"],"C","Cord presentation means the cord lies before the presenting part with intact membranes; it feels soft and pulsatile. Ruptured membranes would be cord prolapse."],
[122,"Technique to test the stepping reflex:",["Stimulating toes by firm pressure","Holding the infant upright so the sole is in firm pressure","Stimulating the ball of the foot","Stroking the lateral sole"],"B","Held upright with feet touching a surface, the newborn makes stepping movements."],
[123,"Which signs confirm the first stage of labour?",["Full dilatation 10 cm, bulging vulva, head descended","True uterine contractions, show, cervical dilatation above 3 cm","Irregular contractions, backache, closed cervix","Gush of blood, lengthening of cord, rupture of membranes"],"B","Active labour: regular contractions, show and progressive dilatation beyond 3 cm. A is second stage, C false labour, D third stage."],
[124,"Which feature on vaginal examination suggests face presentation?",["Part of occipital bone","Part of lateral frontal bone","Part of eyebrows","Feeling part of supra-orbital ridge"],"D","Face presentation: palpable orbital ridges, nose, mouth and chin."],
[126,"On IV oxytocin during vertex delivery, monitor fluid intake and output because it:",["Causes dehydration","Is toxic to the kidney","Causes excessive thirst","Causes water intoxication"],"D","Oxytocin has antidiuretic action, causing water retention and intoxication if fluids are excessive."],
[129,"Fundus 18 h after delivery is firm, 2 fingers above umbilicus and deviated left. First action?",["Stimulate uterine contraction","Give magnesium sulphate tablets","Ask the woman to empty bladder","Administer oxytocin IV drip"],"C","A full bladder displaces the uterus upwards and sideways and may cause PPH; emptying it comes first."],
[130,"Mrs. Kitabu at 20 weeks is suspected to have hydatidiform mole. Decision?",["Collect urine to rule out pregnancy","Look for vaginal bleeding","Give ergometrine 0.5 mg IM immediately","Refer her to hospital for further management"],"D","Molar pregnancy needs evacuation and follow-up for choriocarcinoma at a referral hospital."],
[131,"Pregnant woman at RCH clinic with vaginal bleeding in third trimester:",["Give iron supplement","Refer patient to hospital","Advise bed rest","Plan for normal delivery"],"B","Antepartum haemorrhage (placenta praevia or abruption) is an emergency requiring hospital care; do no vaginal examination."],
[133,"Nursing diagnosis for Ms. Mjee: lower abdominal pain, backache, moderate contractions, progressive show:",["Impaired physical ability related to labour pains","Impaired fluid and electrolyte balance","Altered social interaction","Pain related to uterine contractions and pressure from the descending head"],"D","Her presenting problem is labour pain."],
[134,"Mother of infant with bilateral clubfeet is scared. Therapeutic response?",["“Don’t worry. I will tell the surgeon to stop planning the surgery”","“Don’t worry. Your baby’s clubfeet will be easily corrected without harm”","“You sound frightened. What would you like to suggest?”","“Don’t worry. Your husband will be happy”"],"C","Therapeutic communication reflects feelings and invites expression; A, B and D give false reassurance or dismiss feelings."],
[135,"Which baby action shows correct breastfeeding attachment?",["Mouth open, sucking noises heard","Baby’s mouth is wide open on the breast","Mouth open and milk dribbling","Mouth open and rapid swallowing"],"B","Good attachment: wide-open mouth, chin touching breast, lower lip turned out, more areola above than below. Noises and dribbling suggest poor attachment."],
[138,"Bi Bwanaki is aggressive: irritable, frowning, restless and agitated. Which intervention?",["Assist the client to consider alternative responses to angry feelings","Ask why she feels that way, then find an alternative solution","Ignore the behaviour to defuse the situation","Encourage her to remain alone when aggressive"],"A","Help the client channel anger into acceptable responses. Asking ‘why’ is non-therapeutic, ignoring or isolating escalates or abandons."],
[139,"Minza was in class when a bomb blasted at a military base near her school three years ago. Which signs and symptoms apply?",["Sadness, lethargy and hopelessness","Hostility, irritability and suspiciousness","Depression, restlessness and tense feelings","Severe flashback, nightmares and irrational fear"],"D","Re-experiencing (flashbacks, nightmares) after trauma indicates post-traumatic stress disorder."],
[152,"Which intervention, progressively with support, for a patient with claustrophobia?",["Expose the patient to open places","Expose the patient to closed-in places","Expose the patient to closed high-height places","Expose the patient to dark places"],"B","Claustrophobia is fear of enclosed spaces; graded exposure (systematic desensitization) to them reduces the phobia."],
[153,"Mr. Abuti is very euphoric, excited, overactive and easily swayed. Nursing intervention?",["Discourage use of abusive language","Keep music volume high with bright light","Leave the client alone","Protect the client by engaging him in useful activities"],"D","In mania, channel excess energy into safe, constructive activity and keep stimulation low; loud music and light worsen it."],
[154,"A 12-year-old girl is brought by her parents for undesirable bedwetting. What will you do?",["Let the girl express her concerns to you","Let the elder sisters monitor her","Let the parents provide conducive beddings","Let school teachers express the girl’s concerns"],"A","Assessment begins with the child’s own account in a private, non-judgemental setting."],
[156,"Mr. Mandaka lies in a fetal position for long hours (withdrawn). Which intervention?",["Ask direct questions and encourage talking","Awaken him and involve him in occupational therapy","Sit beside him in silence and occasionally ask open-ended questions","Remain quiet and ask other patients not to be near him"],"C","For withdrawn or stuporous patients, a quiet accepting presence builds trust before communication is expected."],

Q.sort((a,b)=>a[0]-b[0]);
const secOf=n=>S.find(s=>n>=s[2]&&n<=s[3]);
const st={a:{},f:new Set(),i:0,sec:null,done:false};
const K="tnmcle2023_v1";
function save(){try{localStorage.setItem(K,JSON.stringify({a:Object.fromEntries(Object.entries(st.a).map(([i,v])=>[Q[i][0],v])),f:[...st.f].map(i=>Q[i][0]),n:Q[st.i][0],done:st.done}))}catch(e){}}
try{const d=JSON.parse(localStorage.getItem(K)||"null");if(d){const ix=n=>Q.findIndex(q=>q[0]==n);for(const[n,v]of Object.entries(d.a||{})){const j=ix(n);if(j>=0)st.a[j]=v}for(const n of d.f||[]){const j=ix(n);if(j>=0)st.f.add(j)}const j=ix(d.n);if(j>=0)st.i=j;st.done=!!d.done}}catch(e){}
function resetAll(){try{localStorage.removeItem(K)}catch(e){}location.reload()}
const $=id=>document.getElementById(id);
function side(){save(); $("secs").innerHTML='<div class="mu" style="margin-bottom:6px">Sections</div>'+S.map(s=>{const k=Q.filter(q=>secOf(q[0])===s).length;return `<button class="sec ${st.sec===s[0]?'on':''}" onclick="goSec('${s[0]}')" ${k?'':'disabled'}>${s[0]}: ${s[1]} <span class="mu">(${k?k+' loaded':'not loaded'})</span></button>`}).join("")+`<button class="sec ${st.sec===null?'on':''}" onclick="goSec(null)">All questions</button>`;
 $("grid").innerHTML=Q.map((q,i)=>{let c=[];if(st.done){c.push(st.a[i]===undefined?'':st.a[i]===q[3]?'c':'w')}else if(st.a[i]!==undefined)c.push('ans');if(st.f.has(i))c.push('flg');if(i===st.i)c.push('cur');return `<button class="${c.join(' ')}" onclick="go(${i})">${q[0]}</button>`}).join("");
 const n=Object.keys(st.a).length;$("pb").style.width=n/Q.length*100+"%";$("cnt").textContent=`${n} / ${Q.length} answered`}
function goSec(l){st.sec=l;if(l){const i=Q.findIndex(q=>secOf(q[0])[0]===l);if(i>=0)st.i=i}render()}
function go(i){st.i=i;st.sec=secOf(Q[i][0])[0];if(st.done&&view==="review")return render();view=st.done?"review":"exam";render()}
let view="exam",rf="all";
function opts(i,rev){const q=Q[i];return q[2].map((t,k)=>{const L="ABCD"[k];let c="opt";if(rev){if(L===q[3])c+=" ok";else if(st.a[i]===L)c+=" bad";}else if(st.a[i]===L)c+=" sel";return `<div class="${c}" ${rev?'':`onclick="pick(${i},'${L}')"`}><b>${L}.</b><span>${t}${rev&&L===q[3]?' ✓':''}${rev&&st.a[i]===L&&L!==q[3]?' ✗ (your answer)':''}</span></div>`}).join("")}
function pick(i,L){st.a[i]=L;render()}
function flag(i){st.f.has(i)?st.f.delete(i):st.f.add(i);render()}
function render(){side();if(view==="result")return;const m=$("m");
 if(view==="review"){m.innerHTML=`<div class="row" style="margin-bottom:10px">${[["all","All"],["wrong","Wrong"],["none","Unanswered"],["flag","Flagged"]].map(([k,l])=>`<button class="${rf===k?'p':''}" onclick="rf='${k}';render()">${l}</button>`).join("")}</div>`+Q.map((q,i)=>{const ok=st.a[i]===q[3];if(rf==="wrong"&&(ok||st.a[i]===undefined))return"";if(rf==="none"&&st.a[i]!==undefined)return"";if(rf==="flag"&&!st.f.has(i))return"";return `<div class="card"><div class="mu">Q${q[0]} · Section ${secOf(q[0])[0]} · ${st.a[i]===undefined?'Unanswered':ok?'Correct':'Incorrect'}</div><div class="q">${q[1]}</div>${opts(i,true)}<div class="rat"><b>Correct answer: ${q[3]}.</b> ${q[4]}</div></div>`}).join("")+`<div class="row"><button onclick="showRes()">Back to results</button></div>`;return}
 const i=st.i,q=Q[i],list=Q.map((x,k)=>k).filter(k=>!st.sec||secOf(Q[k][0])[0]===st.sec),p=list.indexOf(i);
 m.innerHTML=`<div class="card"><div class="row"><span class="mu" style="flex:1">Question ${q[0]} of 180 · Section ${secOf(q[0])[0]}: ${secOf(q[0])[1]}</span><button onclick="flag(${i})">${st.f.has(i)?'⚑ Flagged':'⚐ Flag for review'}</button></div><p class="q">${q[1]}</p>${opts(i,false)}<div class="row" style="margin-top:10px"><button onclick="go(${list[p-1]})" ${p<=0?'disabled':''}>← Previous</button><button class="p" onclick="go(${list[p+1]})" ${p>=list.length-1?'disabled':''}>Next →</button></div></div><div class="mu">Flagged: ${[...st.f].map(k=>'Q'+Q[k][0]).join(', ')||'none'}</div>`}
function stats(){return S.map(s=>{const qs=Q.map((q,i)=>i).filter(i=>secOf(Q[i][0])===s);const c=qs.filter(i=>st.a[i]===Q[i][3]).length;return{s,n:qs.length,c,pct:qs.length?c/qs.length*100:null}})}
const TIPS={A:"Drill the nursing process phases, ABC prioritization, fluid/IV calculations and first-aid triage; practise ‘first action’ questions.",B:"Revise pre/post-operative care, shock, renal, cardiac and respiratory conditions; link each sign to its pathophysiology and priority nursing diagnosis.",C:"Study outbreak investigation steps, IMCI classifications, immunization targets, epidemiology formulas (median, fatality rate) and community assessment sequence.",D:"Rehearse the partograph, third-stage management, PPH, obstetric emergencies, newborn care and PMTCT/family planning protocols.",E:"Review mental status exam terminology, therapeutic communication, delusion types and safety interventions for psychiatric emergencies.",F:"Learn leadership styles, communication directions, delegation rules, supervision tools, budgets and conflict-resolution modes."};

 $("m").innerHTML=`<div class="card"><div class="mu">Final score (${tot} loaded questions × 0.5 mark)</div><div class="big">${sc} / ${max} Marks</div><div>${(sc/max*100).toFixed(1)}%</div></div>
 <div class="card"><b>Section breakdown</b><table><tr><th>Section</th><th>Correct</th><th>Marks</th><th>%</th></tr>${r.map(x=>x.n?`<tr><td>${x.s[0]}: ${x.s[1]}</td><td>${x.c}/${x.n}</td><td>${x.c/2}/${x.n/2}</td><td class="${x.pct<50?'lo':''}">${x.pct.toFixed(0)}%</td></tr>`:`<tr><td>${x.s[0]}: ${x.s[1]}</td><td colspan="3" class="mu">No questions loaded</td></tr>`).join("")}</table></div>
 <div class="card"><b>Recommendations Report</b>${(()=>{const w=r.filter(x=>x.n&&x.pct<50);return(w.length?w.map(x=>`<p><b class="lo">${x.s[1]} (${x.pct.toFixed(0)}%)</b><br>${TIPS[x.s[0]]} Re-attempt the missed items in Review Mode and write a one-line rule for each.</p>`).join(""):`<p>No section is below 50%. Keep sharpening with timed practice (about 1 minute per question) and re-read rationales for every miss.</p>`)+`<p class="mu">General: flagged questions (${st.f.size}) show where confidence is low; revisit those first.</p>`})()}</div>
 <div class="row"><button class="p" onclick="view='review';render()">Open Review Mode</button><button onclick="resetAll()">Restart exam</button></div>`}
function doSubmit(){st.done=true;$("sub").textContent="View Results";showRes();side()}
$("sub").onclick=()=>{const n=Object.keys(st.a).length;if(st.done)return showRes();view="confirm";side();$("m").innerHTML=`<div class="card"><b>Submit exam?</b><p>You have answered ${n} of ${Q.length} questions. You cannot change answers after submitting.</p><div class="row"><button class="p" onclick="doSubmit()">Yes, submit</button><button onclick="view='exam';render()">Cancel</button></div></div>`};
if(st.done){$("sub").textContent="View Results";side();showRes()}else render();
</script></body></html>
