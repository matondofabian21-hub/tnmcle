<style>
:root{--bg:#f6f7f9;--sf:#fff;--tx:#1b2430;--mu:#5d6b7c;--bd:#d8dee6;--ac:#0f6e56;--ok:#d9f2e4;--okb:#1b8a50;--no:#fbe0e0;--nob:#c23b3b;--fl:#f3b63f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12171d;--sf:#1b222b;--tx:#e8edf3;--mu:#97a4b4;--bd:#2f3946;--ac:#3fbf9c;--ok:#16372a;--okb:#3fbf7c;--no:#3d1c1c;--nob:#e06a6a}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--sf);border-bottom:1px solid var(--bd);padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:16px;margin:0;flex:1;min-width:180px}.bar{height:8px;background:var(--bd);border-radius:4px;flex:1 1 100%;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .2s}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:8px;padding:7px 12px}button.p{background:var(--ac);border-color:var(--ac);color:#fff}button:disabled{opacity:.4}
.wrap{display:flex;gap:14px;padding:14px;max-width:1100px;margin:auto}nav{width:230px;flex:none}main{flex:1;min-width:0}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.sec{display:block;width:100%;text-align:left;margin-bottom:6px;font-size:13px}.sec.on{border-color:var(--ac);outline:1px solid var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px}.grid button{padding:5px 0;font-size:12px}
.grid .ans{background:var(--ac);color:#fff;border-color:var(--ac)}.grid .flg{box-shadow:inset 0 -4px 0 var(--fl)}.grid .cur{outline:2px solid var(--tx)}.grid .c{background:var(--ok);border-color:var(--okb);color:var(--tx)}.grid .w{background:var(--no);border-color:var(--nob);color:var(--tx)}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin:8px 0;cursor:pointer}.opt.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent)}
.opt.ok{background:var(--ok);border-color:var(--okb)}.opt.bad{background:var(--no);border-color:var(--nob)}.opt b{min-width:20px}
.q{font-size:16px;font-weight:600}.mu{color:var(--mu);font-size:13px}.rat{border-left:4px solid var(--ac);padding:6px 10px;margin-top:8px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.big{font-size:34px;font-weight:700}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px}.lo{color:var(--nob);font-weight:600}

<header><a href="./" style="text-decoration:none;font-size:20px" title="Home">🏠</a><h1>TNMCLE RN0029:2023 – Registration Nurses</h1><span id="cnt" class="mu"></span><button id="sub" class="p">Submit Exam</button><div class="bar"><i id="pb"></i></div></header>
<div class="wrap"><nav><div class="card" id="secs"></div><div class="card"><div class="mu" style="margin-bottom:6px">Question grid</div><div class="grid" id="grid"></div><div class="mu" style="margin-top:8px">Filled = answered · gold underline = flagged</div></div></nav><main id="m"></main></div>
<script>
const S=[["A","Basic Nursing",1,40],["B","Medical Surgical Nursing",41,76],["C","Community Health Nursing",77,96],["D","Midwifery & Child Health",97,136],["E","Mental Health Nursing",137,160],["F","Leadership & Management",161,180]];
// [no, text, [A,B,C,D], answer, rationale] — add the remaining paper questions here in the same format.
const Q=[
[1, "You assigned Miss Hodi a group of patients to care for. Which patient would you expect the nurse to assess first?", ["Mr. Kadaka, 52 years old, who reported increasing lethargy and confusion", "Mr. Ndegetu, who had surgery 2 days ago, complaining of pain", "Mr. Mkani, who has hypertension, complaining of piercing mid-sternal pain", "Mr. Mbishi, newly admitted with Hb 8.3 g/dl"], "C", "Piercing mid-sternal pain in a hypertensive patient suggests acute coronary syndrome or aortic dissection, an immediately life-threatening cardiovascular emergency. Prioritization by acuity places it ahead of post-operative pain, moderate anaemia or gradual neurological change."],
[2, "Mr. Kuli has dry skin, sweating, rapid pulse, high fever and limited urination. Which nursing diagnosis will you include in his care plan?", ["Fluid loss related to excessive sweating", "Dehydration related to high fever and sweating", "Disturbance in metabolic system reaction related to high fever", "Impaired body fluid balance related to excessive perspiration loss"], "B", "Dry skin, tachycardia and oliguria are defining characteristics of dehydration (deficient fluid volume). A correct diagnosis names the problem and its cause (PES format); fever with sweating is the cause. The other options are vague or do not name a recognized nursing problem."],
[3, "Which finding in Mr. Madu during the first 24 hours after a percutaneous liver biopsy indicates a complication?", ["Anorexia, nausea and vomiting", "Pain and itching at the biopsy site", "Pulse 112, blood pressure 100/60 and respiration 20", "Abdominal distension and discomfort"], "C", "A rising pulse with falling blood pressure signals internal haemorrhage, the commonest serious complication of liver biopsy because the liver is highly vascular."],
[4, "A nurse places a patient on a stretcher whose rails do not work well. On the way to X-ray the patient falls and fractures the femur. Which legal action applies?", ["Exempted from lawsuit because of unawareness of the defective equipment", "Liable to the employer for not placing effective equipment", "Negligence because of failure to report defective equipment", "Liable to the supervisor for not observing misallocation of duty"], "C", "Negligence is failure to act as a reasonably prudent nurse would. Using equipment known to be faulty without reporting it breaches the duty of care and caused harm."],
[5, "Which method of abdominal examination is performed second?", ["Percussion", "Auscultation", "Palpation", "Inspection"], "B", "The abdominal sequence is inspection, auscultation, percussion, then palpation, because percussion and palpation can change bowel sounds."],
[6, "Mrs. Eliza is on blood transfusion. Which nursing intervention will you perform?", ["Monitor the patient’s renal output", "Check the patient’s skin turgor", "Check the patient’s body weight", "Take the patient’s blood sample"], "A", "Haemolytic transfusion reactions can cause acute kidney injury and circulatory overload, so urine output is monitored to detect renal compromise early (alongside vital signs)."],
[7, "Mr. Wakosi’s stool is clay coloured. Which disease will you suggest to the physician?", ["Pancreatitis", "Appendicitis", "Colitis", "Hepatitis"], "D", "Clay-coloured stool means bile pigment (stercobilin) is not reaching the gut, which occurs in hepatocellular or biliary obstruction such as hepatitis."],
[8, "A patient with cancer is on tube feeding. What will you consider to maintain nutritional status?", ["Feed small portions frequently", "Feed only with light fluids", "Feed nourishing food between normal meals", "Give supplementary foods, mainly vitamins"], "A", "Cancer patients have anorexia, early satiety and nausea; small frequent feeds improve tolerance and total intake and reduce the risk of aspiration and vomiting."],
[9, "You are caring for Mr. Fuko who is on oxygen via nasal cannula. Which intervention will you perform?", ["Ensure hygiene, including applying oil-based lubricant to the nares", "Loop the tubing over the ears and adjust it firmly under the chin", "Reassess the nares, cheeks and ears for signs of pressure every 2 hours", "Alternate the position of the prongs, curving upward then downward, every 2 hours"], "C", "Cannula tubing exerts pressure on the nares, cheeks and ears and can cause skin breakdown, so these sites are reassessed regularly. Oil-based lubricants are contraindicated with oxygen (fire risk and lipoid pneumonia); water-soluble gel is used."],
[10, "Which intervention is specific to a patient with an endotracheal tube?", ["Examine the patient’s lungs", "Smooth the larynx with lubricant", "Give the patient adequate fluids", "Ensure the endotracheal tube is safely secured"], "D", "Accidental extubation or tube migration is the tube-specific danger, so securing the tube and checking its position is the priority. The other options apply to many patients."],
[11, "You assigned Ms. Haria, an enrolled nurse, to prepare a trolley for wound dressing. Where will you expect her to place drums with sterile cotton swabs and gauze?", ["Bottom shelf", "Top shelf", "Sterile field", "Side of the trolley"], "B", "On a dressing trolley the top shelf holds sterile (clean) items and the bottom shelf holds contaminated or used items, to prevent contamination of sterile materials."],
[12, "Priority action for a patient on blood transfusion who develops chills and headache?", ["Stop the transfusion immediately and report", "Give analgesics to reduce pain", "Slow the rate of the transfusion", "Check vital signs"], "A", "Chills and headache suggest a transfusion reaction. Stopping the transfusion immediately limits the dose of incompatible or contaminated blood; the line is kept open with saline, then vital signs are checked and the reaction reported."],
[13, "Mr. Mpera, 72, has not passed urine for three days and has a distended lower abdomen. What is the first nursing intervention?", ["Open a nearby tap of water", "Aspirate the bladder with a syringe", "Place him in dorsal position", "Insert an indwelling catheter"], "D", "This is acute urinary retention, relieved by aseptic catheterization to prevent bladder over-distension and renal damage."],
[14, "A 4-year-old boy with hypothermia is classified as an emergency. Which intervention first?", ["Ask a junior nurse to prepare porridge", "Cover the boy with warm linen", "Take frequent oral body temperature", "Educate the family on management of hypothermia"], "B", "The first step is to stop further heat loss and rewarm passively with warm covers. Feeding, monitoring and health education follow."],
[15, "Miss Naina has clubbed fingers on both arms. Which disease do you suspect?", ["Chronic hypertension", "Chronic diabetes mellitus", "Chronic renal failure", "Chronic heart disease"], "D", "Clubbing results from chronic tissue hypoxia and is associated with chronic cardiopulmonary disease (cyanotic heart disease, bronchiectasis, lung cancer)."],
[16, "You are teaching first-year students how to detect pressure sores. Which action will you tell them to perform?", ["Ask the patient if he or she has sores", "Observe the patient’s facial reaction during bed making", "Assess the patient’s bedding during bed making", "Assess the patient’s skin integrity during bed making"], "D", "Direct inspection of the skin, especially over bony prominences, finds early pressure injury (non-blanching erythema) before breakdown. Bed making is a routine opportunity to do it."],
[17, "Which statement shows that Mr. Liguo can legally undergo prostatectomy?", ["“Mr. Liguo had an opportunity to ask questions”", "“Mr. Liguo’s decision was made without pressure”", "“Mr. Liguo signed the consent form by himself”", "“Mr. Liguo’s physical examination results are normal”"], "C", "A competent adult’s signed informed consent is the legal authorization for surgery. The other statements are elements of informed consent but not the legal document itself."],
[18, "One activity in the implementation phase of the nursing process is to:", ["Consult other health personnel", "Interview support persons", "Review and revise the nursing care plan", "Analyze the reasons for the outcomes"], "A", "Implementation includes carrying out care and collaborating or consulting with other health professionals. Interviewing is assessment; reviewing, revising and analyzing outcomes belong to evaluation."],
[19, "The purpose of the planning phase of the nursing process is to:", ["Identify the patient’s goals and appropriate nursing interventions", "Determine the extent to which goals of nursing care have been achieved", "Identify the patient’s health care needs and prepare diagnostic statements", "Carry out planned nursing interventions to help the patient attain goals"], "A", "Planning sets priorities, expected outcomes and interventions. B is evaluation, C is diagnosis and D is implementation."],
[20, "Mr. Beka is at risk of developing hypovolaemic shock. Which intervention is a priority?", ["Insert intravenous fluids", "Elevate the foot of the bed", "Find out the causes of his problem", "Place him in a recumbent position"], "A", "Early IV access and fluid replacement maintain circulating volume and tissue perfusion. Positioning is supportive and finding the cause proceeds simultaneously."],
[21, "A terminally ill patient says, “I have never believed in God or an afterlife. But now it is too terrible to imagine that I will not exist.” What do you conclude about his feelings?", ["“This patient will likely not have a peaceful death”", "“This patient needs to be reassured that his feelings are normal”", "“This patient is experiencing spiritual distress”", "“This patient needs a clergyman to discuss with”"], "C", "Anxiety about meaning, death and non-existence is spiritual distress (a challenge to belief or value system). Nursing first recognizes it, then explores his needs; a clergyman is only offered if he wishes."],
[22, "Which type of assessment is usually completed on admission of a client to a health care agency?", ["Model assessment", "Focused assessment", "Ongoing assessment", "Comprehensive assessment"], "D", "A comprehensive (complete database) assessment is done on admission; focused and ongoing assessments follow to monitor specific problems."],
[23, "Miss Makuti had an endoscopy 30 minutes ago and asks for water. What will you do?", ["Offer the drink of water", "Give small sips of water", "Tell her that drinks are not allowed", "Wait until her gag reflex is functioning"], "D", "Topical pharyngeal anaesthesia suppresses the gag reflex for 1–2 hours; oral intake before it returns risks aspiration."],
[24, "Which principle applies when you know true facts about your patient but do not expose them to anybody?", ["Confidentiality", "Veracity", "Fidelity", "Privacy"], "A", "Confidentiality is the duty not to disclose patient information without permission. Veracity is truth-telling, fidelity is keeping promises, privacy concerns bodily or personal space."],
[25, "A 45-year-old man shows reproductive failure, haemolysis of red blood cells and muscular dystrophy. Which vitamin does he lack?", ["Vitamin A", "Vitamin B", "Vitamin D", "Vitamin E"], "D", "Vitamin E is an antioxidant that protects cell membranes. Deficiency causes haemolytic anaemia, myopathy and reproductive failure."],
[26, "Mrs. Chikodu, recovering from anaesthesia after appendectomy, is rolling from side to side, rubbing her arms and legs and complaining of pain. What do you do immediately?", ["Assess for pain and bleeding", "Administer a narcotic if ordered", "Call the doctor to review the patient", "Observe the patient without disturbing her"], "A", "Post-operative restlessness may be due to pain, haemorrhage or hypoxia. Assessment must come before medication or calling for help."],
[27, "You are teaching nursing students about Fowler’s position. Which advantage will you tell them?", ["Keeps the beddings far from you and prevents contamination", "Allows the patient to perform activities while on the bed", "Promotes blood return to the heart and reduces oedema", "Reduces muscle strain to the nurse when caring for the patient"], "B", "Fowler’s (sitting up at 45–60 degrees) lets patients eat, read and take part in activities comfortably and also eases breathing. This is the best available option; C is physiologically incorrect because Fowler’s reduces venous return."],
[28, "Mr. Mandi in ICU has a blood glucose level of 38 mmol/L. Which acid-base imbalance does he have?", ["Electrolyte imbalance", "Metabolic acidosis", "Metabolic alkalosis", "Metabolic failure"], "B", "Severe hyperglycaemia with insulin lack causes fat breakdown and ketone (acid) production, as in diabetic ketoacidosis, producing metabolic acidosis."],
[29, "Which important consideration applies when giving medicines to an elderly patient?", ["Multiple simultaneous medicines can be dangerous to elderly patients", "Medicines affect elderly patients during the early hours of the morning", "The elderly patient metabolizes medicines differently from younger patients", "Medicines have an effect on the respiratory system of elderly patients"], "C", "Ageing reduces hepatic metabolism, renal clearance and changes body composition, so drug action, half-life and toxicity differ from younger adults and doses need adjustment."],
[30, "According to Maslow’s hierarchy, which nursing diagnosis comes first for a critically ill patient with fractured ribs?", ["Ineffective breathing pattern related to pain", "Impaired verbal communication related to tracheostomy", "Anxiety related to impending surgery", "Risk for injury related to autoimmune dysfunction"], "A", "Oxygenation is a physiological need and the base of Maslow’s hierarchy, so breathing takes priority over communication, anxiety or safety."],
[31, "A baby’s temperature is 39 °C at 2:00 pm, 36.5 °C at 8:00 pm and 40 °C at 2:00 am. Which type of fever?", ["Relapsing fever", "Constant fever", "Remittent fever", "Intermittent fever"], "D", "In intermittent fever the temperature swings between fever and the normal range within 24 hours. Remittent fever fluctuates but never returns to normal; relapsing fever has fever-free days between episodes."],
[32, "The doctor prescribed 3,000 ml of 0.9% normal saline for Mr. Masa over 24 hours. The IV set delivers 15 drops per ml. How many drops per minute will you regulate?", ["15", "31", "28", "42"], "B", "Drops per minute = (3000 ml × 15) ÷ (24 × 60 min) = 45,000 ÷ 1,440 = 31.25, about 31 drops per minute."],
[33, "You were checking vital signs for Mr. Sindo and found a blood pressure of ?/110 mmHg (systolic value cut off on the scan). What is your interpretation?", ["Low blood pressure", "Normal blood pressure", "High blood pressure", "Abnormal pressure"], "C", "A diastolic pressure of 110 mmHg is well above 90 mmHg, indicating hypertension."],
[34, "You instruct student nurses that one role is to prevent and protect patients from hospital-acquired infections. Which action achieves this?", ["Clean patient beddings and belongings", "Encourage staff to avoid coughing near patients", "Administer penicillin to all patients suspected to have infection", "Wash hands before and after handling the patient"], "D", "Hand hygiene is the single most effective measure to break the chain of cross-infection."],
[35, "Mr. Kombe has fractured his right humerus and is brought to the casualty department. All of the following are your actions EXCEPT:", ["Check airway, breathing and circulation", "Support the injured part with a hand or rolled blanket", "Immobilize the arm against the trunk using a splint", "Lay the patient flat and apply Plaster of Paris"], "D", "Plaster of Paris is applied by trained staff after assessment, X-ray and reduction, not as initial emergency care. Initial care is ABC, support and splintage."],
[36, "Which rationale of triage will you explain to the emergency care team?", ["It is a hierarchy based on the potential for loss of life", "It assists all victims to receive equal priority and care", "It follows the first in, first served rule", "It is a routine in all emergency care departments"], "A", "Triage sorts casualties by urgency and survivability so that limited resources save the most lives, not by arrival order or equal priority."],
[37, "You are giving first aid to people involved in a motor accident. Which victim do you attend first?", ["A 10-year-old boy crying with a painful closed fractured leg", "A 32-year-old woman with a slightly bleeding lacerated hand", "A 45-year-old man with an open head injury, with no pulse and no respiration", "A 62-year-old man reporting chest pain and shortness of breath"], "D", "In triage the priority is the casualty with a life-threatening but salvageable problem (possible cardiac or thoracic injury). A victim with an open head injury and no pulse or respiration is considered non-salvageable in a multiple-casualty setting; crying and minor bleeding patients can wait."],
[38, "Mr. Cheka is in acute distress from retained tracheal secretions and cannot cough effectively. What is your first intervention?", ["Perform tracheal suctioning", "Ask the patient to drink water", "Advise coughing exercises", "Encourage the patient to cough"], "A", "He cannot clear the airway himself, so suctioning removes secretions and restores airway patency immediately."],
[39, "Mr. Nyau is brought to your ward unconscious on a stretcher. Which lifting technique will you apply to move him to bed?", ["Stand in front of the stretcher and use upper body muscles", "Stand in front of the stretcher with one foot placed close to the bed", "Stand in front of the stretcher and use both legs and hip muscles", "Stand in front of the stretcher and place one foot backward"], "C", "Correct body mechanics use the large leg and hip muscles with a wide base of support, keep the back straight and avoid using the weak back and arm muscles."],
[40, "Mr. Chengu is likely to become dehydrated after frequent watery stools. How is this nursing diagnosis categorized?", ["Actual nursing diagnosis", "Wellness nursing diagnosis", "Potential (risk) nursing diagnosis", "Syndromic nursing diagnosis"], "C", "“Likely to” or “at risk for” statements describe a problem that has not yet occurred, which is a potential (risk) nursing diagnosis."],
[41, "You are guiding first-year student nurses in preparing Mr. Mayanga for pneumonectomy. Which goal will you emphasize regarding physical preparation?", ["Decrease the risk of hypotension and enhance the action of anaesthetic agents", "Reduce bacteria on the skin of the patient and promote sleep and rest", "Decrease the patient’s anxiety and prevent postoperative complications", "Confirm that all consent forms are signed and that the patient understands the procedure"], "B", "Physical preparation includes skin preparation to lower the bacterial count and promote rest. Anxiety reduction and consent are psychological and legal preparation; A relates to pre-medication."],
[42, "Miss Jane returned from theatre after thoracotomy. To ensure her breathing pattern functions well, in which position will you tell your juniors to place her?", ["Semi-Fowler’s position", "Prone position", "Sitting-up position", "Recumbent position"], "A", "Semi-Fowler’s lets the diaphragm descend and the chest expand fully, improving ventilation and drainage after chest surgery. Prone and flat positions restrict chest expansion."],
[43, "Mr. Kimbo, 15 years old, is admitted with a history of anorexia nervosa. Which statement, if made by the boy, requires your immediate follow-up?", ["“Nobody likes me because I look ugly”", "“I am feeling dizzy and weak today”", "“My gums were bleeding this morning”", "“I am getting fatter every day”"], "B", "Dizziness and weakness in starvation suggest hypotension, hypoglycaemia, electrolyte disturbance or cardiac instability, a physiological risk that outranks body-image statements."],
[44, "Which nursing action ensures maximum safety of a patient with ascites after you administer frusemide (Lasix)?", ["Measure the client’s serum potassium accurately", "Assess the patient for signs of hyperkalaemia", "Weigh the client weekly", "Document the client’s intake and output"], "A", "Frusemide is a potassium-wasting loop diuretic and causes hypokalaemia, which can lead to arrhythmias. Monitoring serum potassium protects safety; weighing should be daily, not weekly."],
[45, "Sir Kituko’s sputum is still TB positive after six consecutive months of treatment. What will be your intervention?", ["Schedule another six consecutive months of TB treatment", "Arrange directly observed therapy by a responsible family member or public health nurse", "Schedule more teaching sessions until he understands the risks of non-compliance", "Have a recovered TB patient tell him about successful treatment"], "B", "Persistent positivity usually reflects non-adherence (or resistance). Supervised dosing (DOT) ensures every dose is taken, which is the standard response."],
[46, "A third-year student assesses a patient with acute renal failure. Which signs and symptoms would you score as right?", ["Increasing urine output, generalized oedema, insomnia and anxiety", "Decreased fluid retention, emaciation, night sweats and confusion", "Reduced urine output, swelling of the ankles, cheeks and feet", "Moderate urine output, painful micturition, swollen urinary bladder"], "C", "Oliguria with fluid retention (periorbital and ankle oedema) is the hallmark of acute renal failure."],
[47, "You are discharging a patient recovering from an angina pectoris crisis. Which instructions will you give to the patient and family?", ["Avoid emotions and perform moderate physical exercise", "Modify medicine therapy and avoid risk factors", "Perform moderate exercises, eat and drink normally", "Come to the clinic for diagnostic tests and measure body weight"], "A", "Emotional stress and strenuous exertion raise myocardial oxygen demand and trigger angina, while moderate exercise improves cardiac conditioning. Patients must not modify medicines themselves."],
[48, "Which food choices will you schedule for Mr. Jeri, who is on traction due to a fractured right femur?", ["Maize, carrots, eggs, beans and cabbage", "Banana, apples, groundnuts, cashew nuts and peas", "Ugali, beef, potatoes, wheat bread and cereals", "Rice, fish, oranges, fresh milk and vegetable salad"], "D", "Bone healing needs protein, calcium (milk, fish) and vitamin C (oranges), and fibre and fluids prevent constipation during immobility."],
[49, "A patient says, “I had pus draining from my ear before getting the ear pain and mild fever.” What will you suggest to the physician?", ["Otitis externa", "Barotitis media", "Otitis media", "Acute mastoiditis"], "C", "Purulent discharge through a perforated tympanic membrane with fever and ear pain is typical of otitis media. External otitis does not involve fever at this level and mastoiditis presents with post-auricular swelling."],
[50, "You give a low-purine diet to Mr. Dere with gout and Mr. Tukio with kidney stones. The goal is to decrease:", ["Their serum levels of uric acid", "Possibilities of constipation", "Retention of fluids in their bodies", "Cholesterol levels"], "A", "Purines are metabolized to uric acid, which crystallizes in joints (gout) and forms uric-acid stones."],
[51, "What would you expect from Rumi, a 9-year-old child, when exploring his concept of death?", ["Regards death as a temporary state of sleep", "Believes death is something that “just happens”", "Knows that death is a final process", "Thinks death is punishment for being bad"], "C", "From about 9–10 years children understand that death is final, universal and irreversible. Younger children see it as temporary or as punishment."],
[52, "What is a key component of a quality assurance programme in nursing practice?", ["An acuity system for client satisfaction", "Determination of criteria to meet standards", "Case management for continuity of care", "Patient satisfaction questionnaire"], "B", "Quality assurance begins by setting standards and the criteria used to measure whether care meets them."],
[53, "When planning assignments in the morning shift, which task is safely delegated to a health attendant?", ["Evaluate the voiding pattern of a patient after urinary retention catheter removal", "Obtain a dietary history from a client with peptic ulcer disease", "Assist a patient with a new colostomy in practising his first colostomy irrigation", "Obtain a stool specimen from a client with diarrhoea"], "D", "Assessment, evaluation and teaching require nursing judgement and cannot be delegated. Collecting a specimen is a routine, low-risk task suitable for unlicensed staff."],
[54, "After assessing Mrs. Kuka after chest surgery, you wrote in the care plan, “Observe bleeding at site of incision.” This statement is the nurse’s:", ["Objective", "Goal", "Diagnosis", "Intervention"], "D", "A statement of an action the nurse will perform is a nursing intervention (order)."],
[55, "You receive a patient from theatre after open reduction and internal fixation of the left femur. Which nursing order prevents immediate complications?", ["Place the patient in lateral position", "Assess the site of fracture for bleeding", "Provide adequate fluids", "Provide a diet rich in protein"], "B", "The immediate danger after femoral surgery is haemorrhage and hypovolaemic shock; observing the wound and drains for bleeding comes first. Diet and fluids address later recovery."],
[56, "As a member of the nursing care team discussing the best treatment for a disease or illness, which treatment would you insist on as the best?", ["Body exercises and adequate rest", "Body fluids and adequate rest", "Body hygiene and adequate rest", "Balanced diet and adequate rest"], "D", "Adequate nutrition and rest are the basic supportive treatments for recovery from any illness because they support immunity and tissue repair."],
[57, "Mr. Bonanza, aged 75, complains of frequent hard stools related to an inappropriate diet. Which combination of foods will you plan for him?", ["Cassava, banana, green vegetables and beans", "Meat, orange, maize and green vegetables", "Milk, green vegetables, pawpaw and plenty of fluids", "Bread, fish, green vegetables and yam"], "C", "Fibre from vegetables and pawpaw plus plenty of fluids softens stool and promotes peristalsis. Cassava and unripe banana are constipating."],
[58, "Mrs. Nyamu has altered nutrition, less than body requirements, related to inability to feed herself. Which intervention will you propose?", ["Insert nasogastric tube feeding", "Offer pain medication before meals", "Ask for food preferences", "Provide a pleasant environment"], "A", "When a patient cannot feed herself and intake is inadequate, enteral (nasogastric) feeding delivers nutrition. The other options improve appetite but do not solve inability to feed."],
[59, "Mrs. Muti is on peritoneal dialysis. Her husband asks about the benefit of the procedure. What is your response?", ["It filters excessive chemicals and bacteria from the kidneys", "It reduces the level of higher blood cholesterol and metabolic acid", "It reduces overloaded fluids and worn-out blood cells in the serum", "It removes waste products and excess fluids from the body"], "D", "Dialysis replaces kidney function by removing waste products (urea, creatinine) and excess fluid across the peritoneal membrane."],
[60, "You are verifying whether to give 200 mg of ampicillin to Mr. Dawa. What should you check first?", ["Expiry date of the medicine", "Chart to see whether the medicine was ordered", "Route of delivery of the medicine", "Patient’s name against the medicine"], "B", "A drug may only be given on a valid order, so the prescription is verified first before the other checks (the “rights” of medication administration)."],
[61, "You are caring for a patient with right hemiplegia from stroke. Which intervention will you carry out to aid recovery?", ["Instruct the patient to stay in bed most of the time", "Send the patient to a long-term care facility", "Assist the patient in performing a range of exercises", "Hold the patient’s left extremities during movements"], "C", "Early range-of-motion exercises prevent contractures, spasticity and complications of immobility and promote neurological recovery."],
[62, "A patient had a left arm cast applied 4 hours ago. Which sign alerted you to circulatory impairment?", ["The nail beds of the left hand blanch and the colour returns bluish in two seconds", "The client complained of pain at the fracture site", "The client’s fingers on the left hand were cold to touch", "The client was unable to move the fingers of the left hand"], "C", "Coldness (with pallor, cyanosis, delayed capillary refill and weak pulse) indicates reduced arterial perfusion from a cast that is too tight. Pain at the fracture site is expected, and inability to move the fingers suggests nerve compromise."],
[63, "You are admitting a jaundiced patient with pancreatic cancer. Which need will you regard as a priority?", ["Nutrition", "Self-image", "Skin integrity", "Urinary elimination"], "C", "Retained bile salts cause intense itching; scratching breaks the skin and predisposes to infection, so skin integrity is the immediate nursing priority."],
[64, "A first-year student asks about the changes orally given medicines undergo after contact with body fluids so they can be used by the body. Which process is this?", ["Transference", "Elimination", "Absorption", "Concentration"], "C", "Absorption is the movement of a drug from its site of administration into the bloodstream."],
[65, "Nursing management for Mr. Katikare with herpes zoster will include:", ["Administer a herpes zoster immunization to Mr. Katikare", "Expect to find lesions in the perineal area", "Apply antifungal cream to the herpes zoster", "Place Mr. Katikare on contact precautions"], "D", "Zoster is caused by the varicella-zoster virus; fluid in the vesicles is infectious, so contact precautions are used. Antifungals do not treat viral lesions, and vaccination is not treatment."],
[66, "Which finding will you regard as a priority after assessing a patient with burns on the face and neck?", ["Increased thirst", "Scattered large vesicles", "Difficulty with vision", "Increased respiration"], "D", "Facial and neck burns threaten the airway through oedema and inhalation injury; a change in respiration signals airway compromise, which is the first priority (airway before fluids or eyes)."],
[67, "You are providing health advice to Mr. Hofu on the effects of cigarette smoking. Which will you include in the health talk?", ["Chronic obstructive pulmonary disease and muscle atrophy", "Chronic obstructive pulmonary disease and lung cancer", "Chronic obstructive pulmonary disease and hepatic failure", "Chronic obstructive pulmonary disease and pancreatic failure"], "B", "Smoking is the major cause of COPD and lung cancer."],
[68, "On discharging a patient with an incision you focus on promoting healing and preventing infection. Which statement shows he understood the advice?", ["“I will resume normal exercises whenever I feel like it, six days after discharge”", "“I should immediately report to hospital if my temperature rises over 38 °C”", "“I will observe fluid output and colour of my urine”", "“I will have to open my wound for perspiration after every shower”"], "B", "Fever above 38 °C is an early sign of wound infection and requires prompt reporting. Opening the wound or resuming exercise without guidance harms healing."],
[69, "You receive a toddler who swallowed several adult aspirin tablets. The toddler is unconscious. What is your immediate nursing action?", ["Give emetic syrup", "Conduct cardiopulmonary resuscitation", "Perform gastric lavage", "Place the toddler in a well-ventilated room"], "B", "Airway, breathing and circulation take priority in an unconscious patient. Emetics are contraindicated when consciousness is reduced (aspiration), and lavage comes after stabilization."],
[70, "Which statement do you anticipate when taking the history of Mr. Gemas with query duodenal ulcer?", ["Recent progressive weight loss", "Awakening with pain at night", "Increasing indigestion after meals", "Episodes of nausea and vomiting"], "B", "Duodenal ulcer pain occurs when the stomach is empty (between meals and at night) and is relieved by food. Gastric ulcer pain follows meals and is associated with weight loss."],
[71, "Which infection precautions are appropriate for Mr. Janasi with hepatitis A?", ["Standard precautions", "Droplet precautions", "Blood-borne precautions", "Contact precautions"], "D", "Hepatitis A spreads by the faecal-oral route, so enteric (contact) precautions with strict hand hygiene are used."],
[72, "A patient has high fever, profuse sweating, bleeding from all body openings and lethargy. Which nursing diagnosis will you deal with first?", ["Sleep pattern disturbance related to pain", "Potential to develop jaundice related to severe sweating", "Impaired physical mobility related to fever", "Fluid and electrolyte imbalance related to fluid loss"], "D", "Bleeding and sweating cause life-threatening volume depletion and shock, so fluid and electrolyte imbalance is the priority."],
[73, "You instruct Mrs. Siwapati, who has pelvic inflammatory disease, to sleep with her head elevated about 45 degrees. What is your rationale?", ["Allows coughing and deep breathing effectively", "Decreases abdominal muscle tension", "Assists to localize drainage in the lower abdomen", "Prevents inflammation of the fallopian tubes"], "C", "Semi-Fowler’s position lets pelvic exudate drain by gravity into the pouch of Douglas, preventing spread to the upper abdomen (peritonitis, subphrenic abscess)."],
[74, "What is the priority to include in a teaching plan for a patient with pruritus?", ["Measures to keep the patient from scratching", "Teaching warning signs and symptoms of infection", "Obtaining daily skin assessment", "Use of medicines to decrease the level of anxiety"], "A", "Scratching damages the skin and causes secondary infection, so controlling scratching protects skin integrity and is the first teaching priority."],
[75, "What important consideration will you include in the discharge teaching plan for Mrs. Nduki, 40 years old, who underwent a vaginal hysterectomy?", ["Anticipate heavy vaginal bleeding", "Stop sexual intercourse for 2 months", "Take hormone replacement therapy", "Do not douche with any type of solution"], "D", "Douching can introduce infection to the healing vaginal vault. Heavy bleeding is abnormal and must be reported. Abstinence is usually 6–8 weeks and HRT is only needed if the ovaries were removed."],
[76, "You are teaching first-year students about the effect of pain on the nervous system. Which reactions indicate sympathetic responses to pain?", ["Increased blood pressure, respiration and pulse rate", "Increased urination, headache and pulse rate", "Decreased blood pressure, pulse and temperature", "Decreased blood pressure, nausea and vomiting"], "A", "Acute pain triggers the fight-or-flight response, raising blood pressure, pulse and respiration. Low blood pressure, nausea and vomiting are parasympathetic responses seen with deep or visceral pain."],
[77, "Which information will you consider when collecting data on the health status of the community in the catchment area of the health centre where you are newly posted?", ["Birth rate, infant mortality, growth rate and business status", "Birth rate, divorce rate, maternal mortality and number of cars in the community", "Life expectancy, productivity, socialization rate and number of schools", "Literacy rate, productivity, mortality rate and nutritional status"], "D", "Health status is described by indicators such as mortality, morbidity and nutritional status, together with literacy as a determinant. Business status, divorce rate and number of cars are not health indicators."],
[78, "At Mtizamo Primary School you find most pupils infected with scabies. Which action will you take to combat the situation?", ["Refer the school children with scabies to hospital for treatment", "Examine all the school children with scabies to explore other infections", "Advise the school children with scabies to wear clean clothes", "Apply benzyl benzoate emulsion to the school children with scabies"], "D", "In an outbreak the quickest control is mass treatment on site with a scabicide such as benzyl benzoate, plus washing of clothes and bedding. Referral of everyone is impractical."],
[79, "You are conducting a home visit to the family of Mr. Turuo. Which characteristic of a family as a social practice will you observe?", ["Division of family duties", "Family income", "Eating habits", "Education performance"], "A", "How duties and roles are shared among family members is a social function and practice of the family; income, eating habits and education are economic, nutritional and educational characteristics."],
[80, "Most Mitohu Primary School pupils have Schistosoma eggs in their urine. Your advice for prevention and control, besides using latrines, is to:", ["Avoid swimming in ponds", "Declare strict quarantine", "Wear shoes", "Drink boiled water"], "A", "Schistosoma haematobium is acquired when cercariae in fresh water penetrate the skin. Avoiding infested water and using latrines (to stop eggs reaching water) break the transmission cycle."],
[81, "There is a cholera outbreak at Singeli Village within the catchment area of your health centre. Which measure will you take to control the outbreak?", ["Declare quarantine of the village", "Notify the District Health Officer", "Isolate the victims", "Provide barrier nursing to the victims"], "B", "Cholera is a notifiable disease; immediate notification of the district health authority triggers the coordinated outbreak response. Quarantine of a whole village is not recommended for cholera."],
[82, "An outbreak of measles has been reported at Mchiriku Village. Which control measure will you employ first towards epidemiological investigation?", ["Determine the number of children involved in the outbreak", "Classify whether the outbreak is epidemic or just sporadic", "Report the incidence to the District Medical Officer", "Confirm whether it is a disease that has to be reported"], "D", "The first step in an outbreak investigation is to verify the diagnosis and confirm that the disease is notifiable; counting cases, classifying and reporting follow."],
[83, "Which environmental information from Mbaa community will you collect under the heading of social environment?", ["Number of schools, colleges, vocational institutes, temples, churches and mosques", "Total population, total families, morbidity rate, number of infants and the disease at risk group", "Houses, water supply, sanitation, electricity, toilets and bathrooms", "Community halls, festivals, meetings, land, soil, retired persons, family income and occupation"], "A", "Social environment covers social institutions (education, religion). C is the physical environment and B is demographic data."],
[84, "Which nursing management will you give first to a child classified as severe pneumonia based on IMCI guidelines?", ["Refer him urgently to the hospital", "Give prescribed antibiotic", "Instruct the mother to increase fluid intake", "Admit the child for resting"], "B", "IMCI says to give the first dose of an appropriate antibiotic before urgent referral, so that treatment is not delayed during transfer."],
[85, "After visiting Dar es Salaam Milk Production Company you decide to give health education to workers on the proper use of protective appliances. What is your rationale?", ["Prevent incidents of accidents", "Control incidents of accident", "Preserve the safety of products", "Protect staff from nosocomial infections"], "A", "Protective appliances (gloves, boots, masks) are occupational health measures that primarily prevent injuries and exposure at work. Nosocomial infection is hospital-specific."],
[86, "You are caring for Amina with HIV/AIDS at her home. You learn that she has not disclosed her HIV status to her partner. Which nursing action will you take?", ["Counsel the client to disclose to the partner about her HIV status", "Encourage the client to bring her partner for HIV testing as well", "Avoid forcing the client to disclose her HIV status", "Schedule the client to be discussed in a clinical meeting"], "A", "Counselling that supports voluntary disclosure protects the partner from infection and enables shared care, while respecting the client’s autonomy and confidentiality."],
[87, "Which statement by Zaiba on discharge shows she understood your health talk on preventing the spread of tuberculosis?", ["“Well! It is important that I isolate myself from my family members”", "“Yes! I should always cover my mouth and nose when sneezing”", "“Aha! I will need to burn my old clothes when I return home”", "“Ooh! I have to use separate utensils whenever I am served meals”"], "B", "TB spreads through airborne droplet nuclei, so covering the mouth and nose when coughing or sneezing is the key preventive behaviour. Isolation, burning clothes and separate utensils are not necessary."],
[88, "In interpreting a histogram on immunization coverage in Mutakujatu village, you learned that the village is at minimum level. Which percentage leads you to conclude the immunization level?", ["Less than 50% of the children are not immunized", "Less than 65% of the children are not immunized", "Less than 75% of the children are not immunized", "Less than 85% of the children are not immunized"], "A", "Minimum acceptable coverage is about 50% immunized, meaning fewer than 50% of children are not immunized. This item is badly worded; verify against your course notes."],
[89, "Which signs and symptoms would you base your action plan on for Mr. Kachunda’s child with kwashiorkor?", ["Night blindness, dryness of conjunctiva, anaemia and angular stomatitis", "Red beefy tongue, diarrhoea, haemorrhage and curved bent bones", "Low body weight, oedema and excessive subcutaneous fat", "Apathetic, face looks like an old man and lack of subcutaneous fat"], "C", "Kwashiorkor (protein deficiency) is marked by oedema, with some retained subcutaneous fat. D describes marasmus."],
[90, "Days absent due to malaria at Mkwakwani Primary School: 18, 25, 20, 1, 2, 3, 5, 6, 7, 7, 3, 4, 10, 12, 9, 7, 9, 10, 30 and 15. What is the median?", ["4 days", "7 days", "8 days", "10 days"], "C", "Sorted values (n = 20): 1, 2, 3, 3, 4, 5, 6, 7, 7, 7, 9, 9, 10, 10, 12, 15, 18, 20, 25, 30. The median is the average of the 10th and 11th values: (7 + 9) ÷ 2 = 8."],
[91, "Drawing the community nursing diagnosis of a village is a very important phase after community assessment. Which activity will you perform first before reaching that phase?", ["Taking family history", "Evaluating village costumes", "Conducting a village survey", "Checking understanding of villagers"], "C", "Assessment (data collection through a community survey) precedes analysis and diagnosis of community health problems."],
[92, "What advice will you give to Dukani Village Health Committee after finding that 20% of its under-five children were malnourished?", ["To ask different donors and village committees to support their children", "To assess the amount of funds each household allocates for their children", "To buy foods rich in fats from supermarkets for their children", "To mix the nutritional values of locally available food for their children"], "D", "Sustainable community nutrition improvement uses affordable, locally available foods combined to give a balanced diet, rather than donor dependence or expensive store foods."],
[93, "During reproductive and child health services to teenagers, you learn that they want family planning methods that best prevent sexually transmitted diseases. Which method will you advise?", ["Consistent and correct use of condom", "Use of spermicides during the sexual act", "Lactational amenorrhoea method", "Billings ovulation method"], "A", "Condoms are the only listed method that provides dual protection against pregnancy and STIs including HIV."],
[94, "You are assigned to feed a premature baby weighing 2000 grams. Which amount of feed will you calculate?", ["80 ml/kg/day", "40 ml/kg/day", "120 ml/kg/day", "60 ml/kg/day"], "C", "A stable low-birth-weight baby of 2 kg is fed on increasing volumes up to about 120–150 ml/kg/day in 8 divided feeds. Verify the exact schedule in your national newborn guidelines."],
[95, "Mrs. Kasuga, on treatment for Trichomonas vaginalis, asks how to prevent reoccurrence. What is the appropriate advice?", ["Abstain from sexual intercourse until you are cured", "Use a condom when in contact with your partner", "Continue with your treatment if signs and symptoms persist", "Bring your sexual partner for treatment"], "D", "Trichomoniasis is sexually transmitted, and an untreated partner reinfects the woman (ping-pong effect), so both partners must be treated at the same time."],
[96, "A community report from Mbuta Village states that 2 out of 20 people with cholera died last year. What was the fatality rate?", ["5%", "10%", "15%", "20%"], "B", "Case fatality rate = deaths ÷ cases × 100 = 2 ÷ 20 × 100 = 10%."],
[97, "You are admitting a pregnant woman to the labour ward and find the fetal heart rate is less than 110 beats per minute. Which intervention will you take to ensure fetal wellbeing?", ["Ensure the mother is well dehydrated", "Take blood pressure to assess the woman for the risk of hypertension", "Reassure the woman to ensure maternal relaxation to calm the situation", "Administer oxygen to the woman to improve fetal condition"], "D", "Fetal bradycardia indicates hypoxia. Maternal oxygen (with left lateral position) improves oxygen delivery to the fetus. Dehydration would make it worse."],
[98, "On the partograph, the woman’s cervical dilatation moves to the right of the alert line. Which first action will you take?", ["Report to the in-charge and consider transfer", "Prepare the woman for theatre", "Lie the woman in her left lateral position", "Prepare the woman for vaginal examination"], "A", "Crossing the alert line signals slow progress, so the in-charge is informed and early referral is considered before the action line is reached."],
[99, "Which question will you ask a couple who come to your gynaecology clinic for infertility concerns?", ["“Is there any religious culture concerning your infertility?”", "“What is the pattern of your sexual relations?”", "“Do you consider adopting a child?”", "“Have you discussed your problem with any friend or family?”"], "B", "Frequency and timing of intercourse is a key part of the infertility history because it directly affects the chance of conception."],
[100, "Miss Mzuka, a form three student, tells you she is sexually active but does not want to get pregnant. What advice will you give?", ["Discuss with your parent before receiving contraceptive", "Use condoms when having sexual intercourse", "Tell your partner to buy condoms", "Take oral contraceptives before having sexual intercourse"], "B", "Condoms prevent pregnancy and STIs/HIV and are available without prescription, giving dual protection to an adolescent."],
[101, "Which action will you take before applying controlled cord traction during active management of the third stage of labour?", ["Give oxytocin intramuscularly and apply fundal pressure", "Give oxytocin intravenously and ask the mother to push", "Give ergometrine and deliver the cord spontaneously", "Give oxytocin intramuscularly and wait for uterine contraction"], "D", "In active management, oxytocin 10 IU IM is given within one minute of birth, then the midwife waits for a firm uterine contraction before applying controlled cord traction. Fundal pressure is never applied because it risks uterine inversion."],
[102, "After assessing Mrs. Litunu, who has a normal puerperium, you proposed: “assess vital signs, pulse, respiration and blood pressure every 15 minutes in the recovery room, then every 1 hour until stable.” What was the nursing diagnosis?", ["Risk for fluid volume deficit (PPH) related to uterine atony", "Risk for altered tissue perfusion related to sluggish blood flow in the pelvis", "Risk for uterine infection related to membrane rupture for a prolonged length of time", "Risk for alteration in sexuality pattern related to leaking breasts"], "A", "Frequent early postpartum monitoring detects haemorrhage, the commonest early complication, which results from uterine atony."],
[103, "Which characteristics of a normal full-term baby will you tell a primigravida?", ["Weight about 2.0 kg or more, length 35 cm and head circumference 25 cm", "Weight about 3.0 kg or more, length 45 cm and head circumference 30 cm", "Weight about 3.5 kg or more, length 50 cm and head circumference 34 cm", "Weight about 2.5 kg or more, length 40 cm and head circumference 38 cm"], "C", "A term newborn weighs about 3–4 kg, measures about 50 cm in length and has a head circumference of about 33–35 cm."],
[104, "What is the appropriate response to a student nurse who asks the rationale for placing a baby with jaundice under phototherapy?", ["The light changes yellow colour into normal", "The light changes the shape and structure of bilirubin molecules so that they can be excreted in the urine and stool", "The light increases the baby’s body energy", "Give glucose as much as possible"], "B", "Light photo-isomerizes unconjugated bilirubin into water-soluble isomers that are excreted without liver conjugation."],
[105, "Which objective will you set as number one when examining a pregnant woman at the RCH clinic during the antenatal period?", ["Give the necessary advice on diet to women during pregnancy", "Identify at-risk pregnant women and manage accordingly", "Prepare the pregnant woman to deliver a live baby safely", "Prepare the woman for a caesarean section as necessary"], "B", "Antenatal care aims first to detect risk factors and complications early so they are managed or referred before they threaten mother or baby."],
[106, "Mrs. Kazimoto has just delivered a live male baby but the placenta is retained in the uterus. What should be the first step in rescuing Mrs. Kazimoto’s life?", ["Inform the obstetrician at once", "Empty urine from the bladder at once", "Give injection oxytocin at once", "Give injection oxytocin at once"], "B", "A full bladder impedes uterine contraction and placental separation, so emptying it is the first simple step before oxytocin and manual removal. Options C and D are identical in the scanned paper, so the question is flawed; verify the key with your facilitator."],
[107, "You have admitted a woman in active labour with cervix dilated 6 cm and strong contractions. Which action will you take to save the woman?", ["Administer prostaglandin and encourage the woman to rest", "Initiate a partograph and monitor maternal and fetal conditions", "Notify the obstetrician and prepare the woman for caesarean section", "Give intravenous infusion and prepare the woman for second stage"], "B", "Once active labour starts (cervix 4 cm or more) the partograph is started to monitor progress and detect abnormal labour early."],
[108, "Which category of pregnant women is likely to develop postpartum haemorrhage, which you would emphasize to midwives?", ["Women with a history of urinary tract infection", "Women with a history of hyperemesis", "Women with a history of grand multiparity", "Women with a history of severe painful labour"], "C", "Grand multiparity weakens uterine muscle, causing atony, the commonest cause of postpartum haemorrhage."],
[109, "Which technique will you apply to facilitate breech delivery of fetal legs that fail to come out spontaneously?", ["Pull the legs while the baby is delivered", "Hold the baby on the flanks and pull", "Push behind the knee to bend the legs", "Grasp the legs forward and pull out"], "C", "Pinard’s manoeuvre: pressure behind the knee flexes the leg so the foot can be delivered. Pulling the legs or trunk risks extension of the arms or head."],
[110, "Which remark will you use to reassure a lactating mother who complained that her 4-month-old child was frothing and smiling all the time?", ["The infant tries to hold the head upright at 4 months", "Bubbling makes the baby look different at 2–4 months", "Encourage the mother to use a soft towel at the baby’s mouth to keep him dry", "Language development starts at 4 months, so bubbling is common"], "D", "Cooing, bubbling and drooling are normal early speech and oral development around 3–4 months."],
[111, "Which temperature range indicates that the BCG vaccine you kept in a freezer is well preserved?", ["0 °C to +8 °C", "0 °C to +10 °C", "−15 °C to −25 °C (printed as “−15 °C to 20 °C” in the scan)", "−15 °C to 30 °C"], "C", "A freezer holds vaccines at −15 °C to −25 °C, which BCG tolerates. Verify the wording of this option in the original paper."],
[112, "On assessing Hamisa you note the cervix is dilated 2 cm with severe abdominal pain, and you suspect abruptio placentae. Which additional sign confirms the condition?", ["Greenish vaginal discharge", "Excessive vaginal bleeding", "Tetanic uterine contraction", "Rigid, board-like abdomen"], "D", "Retroplacental bleeding infiltrates the myometrium, giving a hard, tender, board-like uterus."],
[113, "Which step will you instruct a student nurse to follow first in conducting delivery of the second twin?", ["Palpate the uterus to determine the fetal lie", "Rupture the membrane of the second twin", "Perform vaginal examination", "Check fetal condition"], "A", "After the first twin, the lie of the second twin is confirmed by abdominal palpation (and corrected if transverse) before membranes are ruptured."],
[114, "What will you suspect on receiving a pregnant woman with a history of sudden sharp pain in the lower abdomen, fewer contractions and no fetal heart heard?", ["Fetal distress", "Maternal distress", "Uterine rupture", "Anaemia"], "C", "Sudden tearing pain, cessation of contractions and absent fetal heart sounds are classic features of uterine rupture."],
[115, "Which observations will you involve in scoring a newborn baby who looks tired immediately after delivery?", ["Heart rate, respiratory effort, muscle tone, reflex irritability and colour", "Respiratory rate, reflex, irritability, muscle tone, colour and temperature", "Heart rate, respiratory rate, colour, muscle tone and response to stimuli", "Temperature, heart rate, colour, effort, response to stimuli and muscle tone"], "A", "The Apgar score comprises Appearance (colour), Pulse (heart rate), Grimace (reflex irritability), Activity (muscle tone) and Respiration (effort). Temperature is not included."],
[116, "A woman visits the RCH for the first time in the 14th week of gestation. At what gestation period should you advise her to come for the 2nd visit?", ["20–24 weeks", "22–26 weeks", "24–28 weeks", "28–32 weeks"], "A", "In the focused antenatal care schedule the visits are at 12–16 weeks, 20–24 weeks, 28–32 weeks and 36 weeks."],
[117, "A child has been prescribed a high-protein diet. Which diet will you plan?", ["Banana, ugali, cabbage, chips and spinach", "Dagaa, rice, eggs, oranges and margarine", "Peanuts, groundnuts, beef, milk and fish", "Mango, mchicha, soft porridge, carrot and water"], "C", "Beef, fish, milk, groundnuts and nuts are rich in protein. The other options are mainly carbohydrate, fat or vitamins."],
[118, "You are assisting Mrs. Kuno, in the second stage of labour with breech presentation. Which manoeuvre will you apply to deliver the after-coming head?", ["Mauriceau–Smellie–Veit manoeuvre", "Løvset’s manoeuvre", "Leopold manoeuvre", "Zavanelli manoeuvre"], "A", "Mauriceau–Smellie–Veit flexes and delivers the after-coming head. Løvset delivers the arms, Leopold is abdominal palpation and Zavanelli replaces the head."],
[119, "After observing a gush of blood, an indicative sign of serious postpartum haemorrhage (PPH) in Miss Hoja, what is your first intervention to save her life?", ["Clear the airway", "Stop the bleeding", "Check the vital signs", "Shout for help"], "D", "PPH management is a team emergency; calling for help first mobilizes staff for resuscitation, uterine massage, IV access and drugs."],
[120, "You are preparing a pregnant woman for exclusive breastfeeding. For which period will you insist the mother exclusively breastfeeds her child?", ["First twelve months", "First eight months", "First six months", "First four months"], "C", "WHO recommends exclusive breastfeeding for the first six months, with complementary foods introduced afterwards."],
[121, "A pregnant woman is referred to your labour ward with cord presentation. Which finding should you reveal during vaginal examination to confirm the condition?", ["Hard pulsating mass in front of the presenting part with intact membranes", "Hard pulsating mass in front of the presenting part with ruptured membranes", "Soft pulsating mass in front of the presenting part with intact membranes", "Soft pulsating mass in front of the presenting part with ruptured membranes"], "C", "Cord presentation means the cord lies in front of the presenting part with intact membranes and feels soft and pulsatile. With ruptured membranes it is cord prolapse."],
[122, "Which technique will you apply to rule out abnormalities of the stepping reflex in a newborn?", ["Stimulating the toes of the foot by firm pressure", "Holding the infant upright so that the sole is in firm pressure", "Stimulating the ball of the foot by firm pressure", "Stroking the lateral aspect of the sole of the foot by firm pressure"], "B", "When held upright with the soles on a surface, a normal newborn makes alternate stepping movements."],
[123, "You are admitting Mrs. Jonga and suspect she is in the first stage of labour. Which signs confirm this?", ["Full dilatation of the cervix at 10 cm, bulging of the vulva and the head has descended", "True uterine contractions, show and cervical dilatation above 3 cm", "Irregular contractions, backache and closed cervix", "Gush of blood, lengthening of the umbilical cord and rupture of membranes"], "B", "True labour has regular, progressive contractions with show and cervical dilatation. A describes the second stage, C false labour and D the third stage."],
[124, "Which feature will you feel during per-vaginal examination that will lead you to suspect face presentation?", ["Part of the occipital bone", "Part of the lateral frontal bone", "Part of the eyebrows", "Part of the supra-orbital ridge of the fetus"], "D", "In face presentation the orbital ridges, nose, mouth and chin are palpable, and the mouth and malar bones form a triangle."],
[125, "You gave Pentavalent vaccine (DPT-HepB + Hib) 0.5 ml to a six-month-old baby. Which instruction will you give to the mother?", ["If the child runs a high fever below 39 °C, give an aspirin tablet", "If the child has fever, contact a nearby midwife for advice", "If the fever is persistent, or below 38.3 °C, contact the paediatrician", "If the child has fever, contact the nearby clinic for first aid treatment"], "C", "Mild post-vaccine fever is expected and is managed with paracetamol; persistent or high fever needs medical review. Aspirin must not be given to children (Reye syndrome). The numbers in this option are garbled in the scan; verify."],
[126, "You are assisting a woman who is undergoing spontaneous vertex delivery and is on intravenous oxytocin. What is your priority of care in relation to the medicine?", ["Monitor fluid intake and output as it causes dehydration", "Monitor fluid intake and output as it is toxic to the kidney", "Monitor fluid intake and output as it causes excessive thirst", "Monitor fluid intake and output as it causes water intoxication"], "D", "Oxytocin has an antidiuretic effect, so large volumes of fluid can cause water retention and intoxication (hyponatraemia)."],
[127, "You are assisting a mother in the first postnatal ward day following caesarean section. What will be the primary goal of care?", ["Prevent infection", "Monitor vital signs", "Care for the wound", "Relieve pain"], "D", "Pain relief on the first post-operative day allows early mobilization, breastfeeding and bonding and prevents complications of immobility."],
[128, "At the RCH clinic you received Miss Jakala, aged 20, who was raped 6 hours ago. Which intervention will you do first?", ["Refer to the gynaecologist for further management", "Advise her to report to the Social Welfare Officer", "Check for a pregnancy test", "Provide emergency contraceptive"], "D", "Emergency contraception works best within 72 hours (the sooner the better), so it is given early along with HIV post-exposure prophylaxis and STI prophylaxis."],
[129, "You palpate the fundus of a mother 18 hours after delivery and find it firm, 2 fingers above the umbilicus and deviated to the left of the midline. Which immediate action will you take first?", ["Stimulate uterine contraction", "Give the mother magnesium sulphate tablets", "Ask the woman to empty her bladder", "Administer oxytocin through IV drip"], "C", "A high, deviated fundus indicates a full bladder pushing the uterus upwards and sideways. A full bladder prevents retraction and may cause haemorrhage, so emptying it comes first."],
[130, "Mrs. Kitabu visits your clinic at the 20th week of pregnancy for a check-up. On assessment you suspect she has a hydatidiform mole. What will be your decision?", ["Collect a urine specimen to rule out pregnancy", "Look for evidence of vaginal bleeding", "Give intramuscular ergometrine 0.5 mg immediately", "Refer her to hospital for further management"], "D", "A molar pregnancy needs evacuation, histology and follow-up for choriocarcinoma in a referral hospital. Ergometrine is not given at a peripheral clinic."],
[131, "Which nursing intervention will you perform for a pregnant woman in her third trimester attending the RCH clinic who has vaginal bleeding?", ["Give iron supplement", "Refer the patient to hospital", "Advise bed rest", "Plan for normal delivery"], "B", "Antepartum haemorrhage (placenta praevia or abruption) is an emergency that requires hospital care; no vaginal examination is done at the clinic."],
[132, "Which action will you take first to assist Mrs. Jipu, gravida 2 para 1, who was admitted to maternity ward complaining of labour pains and suddenly developed unclassified vaginal bleeding?", ["Raise the foot of the bed to prevent shock", "Transfer the woman to the labour ward for further management", "Record blood loss to monitor severity of bleeding", "Ask her to sign a consent form ready for operation"], "A", "First aid for acute bleeding is to prevent shock by raising the foot of the bed (with IV access) while help is called. Do not do a vaginal examination until placenta praevia is excluded."],
[133, "Which nursing diagnosis will you record for Ms. Mjee, who has lower abdominal pain, backache, moderate contractions and progressive show?", ["Impaired physical ability related to labour pains", "Impaired fluid and electrolyte balance related to maternal exertion", "Altered social interaction related to isolation from family", "Pain related to uterine contractions and pressure from the descending head"], "D", "Her presenting problem is labour pain from uterine contractions and fetal descent."],
[134, "The mother of an infant born with bilateral clubfeet is scared and cries that her baby is going to have surgery. Which therapeutic response will you give?", ["“Don’t worry. I will tell the surgeon to stop planning the surgery”", "“Don’t worry. Your baby’s clubfeet will be easily corrected without causing any harm”", "“You sound frightened. What would you like to suggest?”", "“Don’t worry. Your husband will be happy to find the clubfeet corrected”"], "C", "Therapeutic communication reflects feelings and invites the mother to express her concerns. A, B and D give false reassurance or dismiss her feelings."],
[135, "You are teaching a group of expectant primigravida women on proper breastfeeding. Which baby action indicates correct attachment?", ["Mouth is open, sucking noises heard from the mouth", "The baby’s mouth is wide open on the breast", "Mouth is open and milk dribbling", "Mouth is open and rapid swallowing"], "B", "Good attachment: a wide-open mouth, chin touching the breast, lower lip turned out and more areola visible above than below. Noises and dribbling suggest poor attachment."],
[136, "What nursing goal will you propose for a pregnant woman at 36 weeks’ gestation complaining of vaginal bleeding, headache, epigastric pain, nausea and vomiting?", ["Maintain fetal oxygenation and assist the woman with immediate delivery", "Provide nursing management associated with emotional support and early complications", "Identify treatment and support the woman through the grieving process", "Assist in successful teaching on infant feeding patterns and provide critical care"], "A", "Bleeding with headache and epigastric pain at term suggests severe pre-eclampsia or abruption (possibly HELLP); fetal and maternal survival depend on stabilization and delivery."],
[137, "You are performing a mental status evaluation on Mrs. Janga. Which of her claims forced you to declare that she has a disorder of thought process?", ["“There are insects crawling over me”", "“I am the President of Tanzania”", "“I am tired of life, why not hang myself”", "“I buried me yesterday”"], "B", "A fixed false belief that is out of keeping with reality and culture (here a grandiose delusion) is a disorder of thought. A is a tactile hallucination (perception) and C expresses suicidal ideation (mood). Option D could also be a delusion, so verify against your course notes."],
[138, "While assessing Bi Bwanaki you find she is aggressive, as evidenced by irritability, frowning, restlessness and agitation. Which nursing intervention will you take?", ["Assist the client to consider alternative responses to angry feelings", "Ask the client why she feels the way she does, then find an alternative solution", "Ignore the client’s behaviour in order to defuse the aggressive situation", "Encourage the client to remain alone when she feels aggressive"], "A", "Helping the client find acceptable ways of expressing anger builds coping. Asking “why” is non-therapeutic, and ignoring or isolating the client can escalate the aggression."],
[139, "Minza was attending a class when a bomb blasted at a military base near her school three years ago. You decide to give her imipramine. Which signs and symptoms did you draw from the patient?", ["Sadness, lethargy and hopelessness", "Hostility, irritability and suspiciousness", "Depression, restlessness and tense feelings", "Severe flashback, nightmare and irrational fear"], "D", "Re-experiencing symptoms (flashbacks, nightmares) and fear after a traumatic event characterize post-traumatic stress disorder."],
[151, "During a major ward round in a psychiatric ward a client tells you, “Hey, you big headed woman, what are you looking at?” Which statement will be your response to him?", ["“Oh! Dear. Don’t utter to me like that again”", "“Oh! Dear. Why are you abusing me like that?”", "“Oh! Dear. I don’t understand where that comment came from”", "“Oh! Dear. What is wrong with you?”"], "C", "A calm, non-judgemental, non-defensive reply de-escalates hostility and invites the client to clarify. A, B and D are confrontational or judgemental."],
[152, "Which nursing intervention will you employ progressively, along with support, for a patient with claustrophobia?", ["Expose the patient to open places", "Expose the patient to closed-in places", "Expose the patient to closed high-height places", "Expose the patient to dark places"], "B", "Claustrophobia is fear of enclosed spaces; graded exposure (systematic desensitization) to enclosed spaces with support reduces the phobic response."],
[153, "You admit Mr. Abuti, who is very euphoric, excited, overactive and easily swayed from his actions. What would be your nursing intervention?", ["Discourage the client’s use of abusive language", "Keep the music volume high with bright light", "Leave the client alone intelligently", "Protect the client by engaging him in useful activities"], "D", "In mania, excess energy is channelled into safe, constructive activities while stimulation is kept low. Loud music and bright light worsen excitement."],
[154, "What will you do for a 12-year-old girl who came to the clinic with her parents complaining of undesirable bedwetting behaviour without justification?", ["Let the girl express her concerns to you", "Let the elder sisters monitor their youngster’s behaviour", "Let the parents provide her conducive beddings", "Let the school teachers express the girl’s concerns"], "A", "Assessment of enuresis begins with a private, non-judgemental interview of the child herself to explore feelings, stressors and causes."],
[155, "Which features will you observe in Mwajuma, who suffers from hebephrenic schizophrenia?", ["Expressive ideas and grievances", "Paranoid delusion and smiling without reason", "Mannerisms and raised sexual urge", "Hoarding tendency and being decorated in an extraordinary way"], "C", "Hebephrenic (disorganized) schizophrenia shows silliness, mannerisms, grimacing, inappropriate affect and disinhibited behaviour. Paranoid delusions characterize the paranoid type. Verify against your course notes."],
[156, "You find Mr. Mandaka on the bed pulled into a fetal position for long hours. Which nursing intervention would you employ?", ["Ask Mr. Mandaka direct questions and encourage talking", "Awaken Mr. Mandaka and involve him in occupational therapy", "Sit beside Mr. Mandaka in silence and occasionally ask an open-ended question", "Remain quiet and ask other patients not to be near the patient"], "C", "For a withdrawn or stuporous patient, a quiet, accepting presence builds trust before communication is expected. Direct questions and forced activity overwhelm the patient. (The names in this question are inconsistent in the scan and were standardized.)"],
[157, "Mr. Jota, in the excitement phase of catatonic schizophrenia, climbed a very high tree and exclaimed that he would jump down in response to unknown voices. Which measure will you take to prevent him from injury?", ["Arrange as many mattresses as possible at the floor side to let the patient throw himself over them", "Tell the patient that God is not pleased with people who kill themselves", "Stay with a few staff under the tree until the patient steps down willingly", "With the assistance of policemen, ask other staff to take the patient down"], "D", "Command hallucinations with imminent danger need a trained team to bring the patient down safely. Waiting or setting up a place to jump does not protect him."],
[158, "Which statement expressed by a patient suggests that he has a delusion of persecution?", ["“Someone put poison into my food that I ate yesterday”", "“I have realized that policemen are after me”", "“I can’t take the medicine because I died two days ago”", "“My hand is broken; I hence can’t handle the plate”"], "B", "A delusion of persecution is a fixed false belief that others are plotting to harm or follow the person. C is a nihilistic delusion and D a somatic delusion. Option A is also persecutory in some texts; verify."],
[159, "Which statement in a care plan indicates a nursing intervention for Mr. Jokeri, who has a sexual disorder?", ["Expressed dissatisfaction with sexual behaviours such as voyeurism", "Ineffective sexuality patterns related to conflict with sexual orientations", "Assess areas of stress in Jokeri’s life and examine the relationship with the sexual partner", "Jokeri will express satisfaction with his own sexuality pattern"], "C", "A is assessment data, B is a nursing diagnosis and D is an expected outcome. C describes an action the nurse performs, which is an intervention."],
[160, "You assessed Yustani and found him suspicious, with diminished trust, jealousy, hallucinations and argumentativeness. Which nursing diagnosis will you write for the patient?", ["Self-care deficit related to persistence of violent behaviour", "Altered thought process related to perceptual disturbances", "Impaired communication related to perceptual deficit", "Non-compliance to treatment related to increased risk of relapse"], "B", "Suspiciousness, jealousy and hallucinations reflect disturbed thinking and perception, so altered thought processes is the matching diagnosis."],
[161, "You are planning the duty roster. Which shift will you allocate more staff than others?", ["Morning shift", "Afternoon shift", "Evening shift", "Night shift"], "A", "The morning shift carries the heaviest workload: ward rounds, investigations, procedures, admissions and discharges."],
[162, "Which management function involves guiding the behaviour of subordinate staff, setting plans of the future in motion and detecting deviations of performance from desirable standards?", ["Directing", "Coordinating", "Organizing", "Controlling"], "A", "Directing (actuating) guides, supervises and motivates staff to carry out plans. Controlling is a separate function that measures performance against standards. The wording is ambiguous, so verify the key."],
[163, "Before going on annual leave you decided to consult one of your subordinate staff to act on your behalf, aiming to get work done willingly and smoothly. Which leadership style were you employing?", ["Democratic style", "Laissez-faire style", "Authoritarian style", "Directing motivational style"], "A", "Consulting staff and sharing decisions is democratic (participative) leadership, which raises willingness and cooperation."],
[164, "Which management style would you use to achieve quality of both services rendered to patients and welfare of your ward staff?ú", ["Country club management", "Organizational management", "Team management", "Authority-obedience management"], "C", "In the Blake–Mouton managerial grid, team management (high concern for people and for production) achieves both quality service and staff welfare."],
[165, "What would you do to improve working conditions in your unit where patient satisfaction has dropped to 60% and staff morale has declined to the lowest level?", ["Seek help from a capable manager of another unit", "Call for a staff meeting and include this in the agenda", "Develop a two-month strategic plan to deal with the concerns", "Ask all staff to write down their educational needs"], "B", "Involving staff in identifying causes and solutions through a meeting is the first step of participatory problem solving and rebuilds morale before a plan is made."],
[166, "Which level of managerial communication are you applying when calling meetings with in-charges of other departments at the same level of the hierarchy?", ["Diagonal communication", "Downward communication", "Lateral communication", "Upward communication"], "C", "Communication between peers at the same hierarchical level is lateral (horizontal) communication."],
[167, "You are determining objectives of the ward day activities. On which of the following guidelines will you NOT base?", ["Hospital policy", "Nursing care plan", "National health policy", "Infection prevention and control"], "C", "Daily ward objectives are drawn from local, operational guides (hospital policy, patient care plans and infection control standards). National health policy is too broad for day-to-day objectives. Verify the key."],
[168, "Your part in administrative work is to advise the matron, collect information and filter it before presenting it to the matron of your hospital. Which category of staff are you playing?", ["General staff", "Specialist staff", "Supporting staff", "Technical staff"], "A", "General staff assist the line manager by gathering, filtering and presenting information and by giving advice, whereas specialists give expert technical advice. Verify the key."],
